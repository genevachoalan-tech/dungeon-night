// 渲染人物面板
window.G.g6RenderCharPanel=function(p){
  const charData=G6_CHAR_SKILLS[p.character]||{equip:['主武器','副武器','道具']};
  let html='<div class="g6-char-panel" id="g6CharPanel">';
  // 血量条
  html+='<div class="g6-panel-hpbar"><span class="hp-label">⚙️ 血量</span><div class="hp-ticks">';
  for(let i=0;i<=9;i++){
    const filled=i<=p.hp?'filled':'';
    html+='<div class="hp-tick '+filled+'">'+i+'</div>';
  }
  html+='</div><span style="color:#ff6666;font-size:12px;margin-left:8px">命'+(p.life||1)+' 血'+(p.hp||0)+'</span></div>';
  // 面板主体
  html+='<div class="g6-panel-body">';
  // 头像
  html+='<div class="g6-panel-avatar"><img src="'+CHARACTERS.find(c=>c.id===p.character).img+'"><div class="char-name">'+p.name+'</div></div>';
  // 右侧
  html+='<div class="g6-panel-right">';
  // 装备槽
  html+='<div class="g6-panel-equips">';
  (p.equipSlots||charData.equip).forEach((slotName,i)=>{
    const item=p.equipment?.[i];
    html+='<div class="g6-panel-slot'+(item?'':' empty')+'"><div class="slot-name">'+slotName+'</div>'+(item?item.name:'')+'</div>';
  });
  html+='</div>';
  // 技能槽
  html+='<div class="g6-panel-skills">';
  for(let i=0;i<3;i++){
    const skill=p.skills?.[i];
    if(skill){
      html+='<div class="g6-panel-skill" style="border-color:'+skill.color+'">';
      html+='<div class="skill-name" style="color:'+skill.color+'">'+skill.name+'</div>';
      html+='<div class="skill-desc">'+skill.desc+'</div>';
      html+='</div>';
    }else{
      html+='<div class="g6-panel-skill empty">技能槽'+(i+1)+'</div>';
    }
  }
  html+='</div>';
  // 背包
  html+='<div class="g6-panel-backpack"><div class="bp-title">🎒 背包（最多2件装备/技能）</div><div class="bp-slots">';
  for(let i=0;i<2;i++){
    const item=p.backpack?.[i];
    html+='<div class="bp-slot">'+(item?item.name:'空')+'</div>';
  }
  html+='</div></div>';
  html+='</div></div></div>';
  return html;
};

// 切换人物面板
function g6SwitchPanel(playerId){
  const p=state.players[playerId];
  if(!p)return;
  // 权限检查：只能看同队伍或主持人
  if(!isHost){
    const myP=state.players[myPeerId];
    if(!myP||p.team!==myP.team)return;
  }
  document.querySelectorAll('.g6-panel-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panelTab-'+playerId)?.classList.add('active');
  const panel=document.getElementById('g6CharPanel');
  if(panel)panel.outerHTML=G.g6RenderCharPanel(p);
}

window.G.g6RenderButtons=function(){
  const g=state.game;const btns=document.getElementById('g6Buttons');
  if(!btns)return;
  const myP=state.players[myPeerId];
  if(!myP||myP.dead){btns.innerHTML='';return}
  if(g.phase==='routeselect'){btns.innerHTML='';return}
  if(myP.team!==g.currentTeam){btns.innerHTML='<span style="color:var(--text-dim)">等待'+(g.currentTeam==='red'?'红队':'蓝队')+'行动...</span>';return}
  if(g.phase==='moving'){
    btns.innerHTML='<button class="btn" onclick="sendAction({type:\'g6move\'})">🚶 队伍前进1格</button>';
  }else if(g.phase==='combat'){
    const c=g.combat;
    if(c.attacker===myPeerId&&!c.resolved){
      if(c.rolling){
        btns.innerHTML='<button class="btn btn-red" onclick="G.g6Lock()">🎯 锁定！</button>';
      }else{
        btns.innerHTML='<button class="btn" onclick="G.g6StartRoll()">🎲 投骰攻击</button>';
      }
    }else if(c.resolved){
      btns.innerHTML='<span style="color:var(--gold)">结算中...</span>';
    }else{
      const attacker=state.players[c.attacker];
      btns.innerHTML='<span style="color:var(--text-dim)">等待'+(attacker?attacker.name:'')+'投骰...</span>';
    }
  }else{
    btns.innerHTML='';
  }
};

// 选择路线
window.G.g6SelectRoute=function(peerId,route){
  const p=state.players[peerId];const g=state.game;
  if(g.phase!=='routeselect')return;
  if(g.teamPos[p.team].route)return; // 已选择
  g.teamPos[p.team].route=route;
  state.message=(p.team==='red'?'红队':'蓝队')+'选择了'+(route==='top'?'上路':'下路');
  // 检查两队是否都选好了
  if(g.teamPos.red.route&&g.teamPos.blue.route){
    g.phase='moving';
    state.message+=' | 两队路线已确定，开始探索！';
  }
  broadcastState();this.renderG6();
};

// 队伍移动
window.G.g6Move=function(peerId){
  const p=state.players[peerId];const g=state.game;
  if(p.team!==g.currentTeam||g.phase!=='moving')return;
  const team=p.team;
  const tp=g.teamPos[team];
  if(!tp.route)return;
  const floorData=g.floor===1?G6_FLOOR1:G6_FLOOR2;
  const routeData=floorData[tp.route];
  let newPos=tp.pos+1;
  // 到达BOSS/出口
  if(newPos>=routeData.length){
    // 触发BOSS/出口
    this.g6TriggerBoss(team);
    return;
  }
  tp.pos=newPos;
  const cell=routeData[newPos];
  const cellType=G6_CELL_TYPES[cell.type];
  state.message=(team==='red'?'红队':'蓝队')+'前进到'+(tp.route==='top'?'上路':'下路')+newPos+'格（'+cellType.icon+cellType.name+'）';
  this.g6TriggerCell(team,tp.route,newPos,cell);
};

// 触发格子效果
window.G.g6TriggerCell=function(team,route,pos,cell){
  const g=state.game;
  const members=Object.values(state.players).filter(p=>p.team===team&&!p.dead);
  const cellKey=route+'-'+pos;
  switch(cell.type){
    case 'spring':
      members.forEach(p=>{p.hp=Math.min(9,(p.hp||0)+(g.floor===1?2:3))});
      g.lastEffect={type:'heal',text:(team==='red'?'红队':'蓝队')+'每人+'+(g.floor===1?2:3)+'血',sub:'💧泉水'};
      state.message+=' | 泉水回复'+(g.floor===1?2:3)+'血';
      this.g6EndTeamTurn();
      break;
    case 'chest':
      g.lastEffect={type:'gold',text:(team==='red'?'红队':'蓝队')+'发现宝箱！',sub:'📦宝箱'};
      state.message+=' | 宝箱格（装备系统开发中）';
      this.g6EndTeamTurn();
      break;
    case 'clover':
      if(!g.cloverUsed.includes(g.floor+'-'+cellKey)){
        g.cloverUsed.push(g.floor+'-'+cellKey);
        g.lastEffect={type:'gold',text:(team==='red'?'红队':'蓝队')+'触发三叶草事件！',sub:'🍀三叶草'};
        state.message+=' | 三叶草随机事件（开发中）';
      }else{
        state.message+=' | 三叶草事件已触发过';
      }
      this.g6EndTeamTurn();
      break;
    case 'monster':
      if(g.monstersDefeated[team].includes(cellKey)){
        state.message+=' | 怪兽已被击败，可通过';
        this.g6EndTeamTurn();
      }else{
        g.phase='combat';
        // 随机选择怪物
        const monsterKeys=Object.keys(G6_MONSTERS).filter(k=>!G6_MONSTERS[k].isDragon);
        const monsterKey=monsterKeys[Math.floor(Math.random()*monsterKeys.length)];
        const monster={...G6_MONSTERS[monsterKey]};
        // 选择当前队伍第一个存活玩家作为攻击者
        const attackerEntry=Object.entries(state.players).find(([id,p])=>p.team===team&&!p.dead);
        g.combat={
          monster:monster,
          monsterHp:monster.hp,
          cellKey:cellKey,
          team:team,
          attacker:attackerEntry?attackerEntry[0]:null,
          attackerIndex:0,
          rolling:false,
          resolved:false,
          ring:0,
          dice:0,
          pointer:0,
          crit:false,
          round:1,
          log:[]
        };
        state.message+=' | ⚔️ 遭遇'+monster.name+'！'+(attackerEntry?attackerEntry[1].name:'')+'投骰攻击';
        g.lastEffect={type:'combat',text:'遭遇'+monster.name+'！',sub:'💀怪兽格'};
      }
      break;
    case 'start':
      state.message+=' | 雕像格商店（开发中）';
      this.g6EndTeamTurn();
      break;
    default:
      this.g6EndTeamTurn();
  }
  broadcastState();this.renderG6();
};

// 触发BOSS/出口
window.G.g6TriggerBoss=function(team){
  const g=state.game;
  const floorData=g.floor===1?G6_FLOOR1:G6_FLOOR2;
  if(floorData.boss.type==='exit'){
    this.g6EndGame(team);return;
  }
  // 龙BOSS
  if(g.bossDefeated){
    // 已击败，直接通过
    if(g.floor===1){
      g.floor=2;
      g.teamPos={red:{route:null,pos:0},blue:{route:null,pos:0}};
      g.phase='routeselect';
      g.bossDefeated=false;
      Object.values(state.players).forEach(p=>{p.floor=2});
      state.message='🎉 进入第二层！请重新选择路线';
    }
    this.g6EndTeamTurn();
    return;
  }
  g.phase='combat';
  state.message=(team==='red'?'红队':'蓝队')+'挑战🐉龙BOSS！';
  g.lastEffect={type:'dragon',text:'🐉 龙BOSS出现！',sub:'守关BOSS'};
  broadcastState();this.renderG6();
  setTimeout(()=>this.g6AutoCombat(team,'boss',true),2000);
};

// 战斗结算（玩家投骰后）
window.G.g6ResolveCombat=function(peerId,action){
  const g=state.game;const c=g.combat;
  if(!c||c.resolved)return;
  const attacker=state.players[peerId];
  if(!attacker||c.attacker!==peerId)return;
  
  c.ring=action.ring;c.dice=action.dice;c.crit=action.crit;c.resolved=true;
  const isEven=c.dice%2===0;
  const monster=c.monster;
  
  let log=[];
  log.push(attacker.name+' 投出 '+c.dice+'点 '+(isEven?'(双数)':'(单数)'));
  
  // 计算伤害
  let damage=0;
  if(c.ring>0){
    // 武器数值：暂时主武器+1，副武器+0
    const weaponBonus=1;
    damage=c.ring+weaponBonus;
    log.push('命中 '+c.ring+'环，伤害='+c.ring+'+'+weaponBonus+'='+damage);
    
    // 暴击：5环+双数=一击毙命（非龙族）
    if(c.crit){
      damage=999;
      log.push('💥 暴击！一击毙命！');
      g.lastEffect={type:'crit',text:attacker.name+' 暴击一击毙命！',sub:'💥暴击'};
    }
    
    c.monsterHp=Math.max(0,c.monsterHp-damage);
    log.push(monster.name+' 剩余 '+c.monsterHp+' 血');
  }else{
    log.push('脱靶！未命中');
    // 未上靶受怪物反击
    const counterDmg=monster.atk;
    attacker.hp=(attacker.hp||0)-counterDmg;
    log.push(monster.name+' 反击！'+attacker.name+' -'+counterDmg+'血');
    this.g6CheckDeath(attacker);
    g.lastEffect={type:'damage',text:attacker.name+' 脱靶被反击 -'+counterDmg+'血',sub:'❌脱靶'};
  }
  
  c.log=log;
  
  // 检查怪物是否死亡
  if(c.monsterHp<=0){
    log.push('🎉 '+monster.name+' 被击败！');
    // 给金币
    const team=c.team;
    const members=Object.values(state.players).filter(p=>p.team===team&&!p.dead);
    const goldPer=Math.ceil(monster.gold/members.length);
    members.forEach(p=>{p.gold=(p.gold||0)+goldPer});
    log.push('每人 +'+goldPer+' 金币');
    g.monstersDefeated[team].push(c.cellKey);
    g.lastEffect={type:'gold',text:'击败'+monster.name+'！每人+'+goldPer+'金',sub:'🏆胜利'};
    
    // BOSS处理
    if(monster.isDragon){
      g.bossDefeated=true;
      if(g.floor===1){
        g.floor=2;
        g.teamPos={red:{route:null,pos:0},blue:{route:null,pos:0}};
        g.phase='routeselect';
        g.bossDefeated=false;
        Object.values(state.players).forEach(p=>{p.floor=2});
        state.message='🎉 第一层通关！传送到第二层起点，请重新选择路线';
        g.lastEffect={type:'dragon',text:'🐉 第一层龙击败！进入第二层！',sub:'第一层通关'};
      }else{
        state.message='🎉🎉 最终龙BOSS击败！游戏结束！';
        g.lastEffect={type:'dragon',text:'🐉 最终龙BOSS击败！',sub:'游戏胜利'};
        g.combat=null;
        broadcastState();this.renderG6();
        setTimeout(()=>this.g6EndGame(c.team),2000);
        return;
      }
    }else{
      g.phase='moving';
      state.message=(c.team==='red'?'红队':'蓝队')+'击败'+monster.name+'！继续前进';
    }
    g.combat=null;
  }else{
    // 怪物未死，切换到下一个攻击者
    const teamEntries=Object.entries(state.players).filter(([id,p])=>p.team===c.team&&!p.dead);
    const nextIdx=(c.attackerIndex+1)%teamEntries.length;
    c.attackerIndex=nextIdx;
    c.attacker=teamEntries[nextIdx][0];
    c.resolved=false;c.rolling=false;
    log.push('轮到 '+teamEntries[nextIdx][1].name+' 攻击');
    state.message='⚔️ '+monster.name+' 剩余'+c.monsterHp+'血，'+teamEntries[nextIdx][1].name+'投骰';
  }
  
  c.log=log;
  broadcastState();this.renderG6();
};

// 简化版自动战斗（BOSS用）
window.G.g6AutoCombat=function(team,cellKey,isDragon){
  const g=state.game;
  const members=Object.values(state.players).filter(p=>p.team===team&&!p.dead);
  const dmg=isDragon?3:2;
  members.forEach(p=>{
    p.hp=(p.hp||0)-dmg;
    this.g6CheckDeath(p);
  });
  g.monstersDefeated[team].push(cellKey);
  const gold=isDragon?10:3;
  members.forEach(p=>{p.gold=(p.gold||0)+Math.ceil(gold/members.length)});
  g.lastEffect={type:'damage',text:'战斗胜利！每人-'+dmg+'血 +'+Math.ceil(gold/members.length)+'金',sub:isDragon?'🐉龙BOSS击败':'💀怪兽击败'};
  state.message=(team==='red'?'红队':'蓝队')+'击败'+(isDragon?'龙BOSS':'怪兽')+'！每人-'+dmg+'血+'+Math.ceil(gold/members.length)+'金';
  if(isDragon){
    g.bossDefeated=true;
    if(g.floor===1){
      g.floor=2;
      g.teamPos={red:{route:null,pos:0},blue:{route:null,pos:0}};
      g.phase='routeselect';
      g.bossDefeated=false;
      Object.values(state.players).forEach(p=>{p.floor=2});
      state.message+=' | 🎉 第一层通关！传送到第二层起点，请重新选择路线';
      g.lastEffect={type:'dragon',text:'🐉 第一层龙击败！进入第二层！',sub:'第一层通关'};
    }else{
      // 第二层龙击败，游戏结束
      state.message+=' | 🎉🎉 最终龙BOSS击败！游戏结束！';
      g.lastEffect={type:'dragon',text:'🐉 最终龙BOSS击败！',sub:'游戏胜利'};
      broadcastState();this.renderG6();
      setTimeout(()=>this.g6EndGame(team),2000);
      return;
    }
  }
  g.phase=g.phase==='routeselect'?'routeselect':'moving';
  this.g6EndTeamTurn();
};

// 检查死亡（3条生命系统）
window.G.g6CheckDeath=function(p){
  if(p.hp<=0){
    p.life=(p.life||1)-1;
    p.skillSlots=Math.max(1,(p.skillSlots||3)-1); // 损失一条命封印一个技能槽
    if(p.life<=0){
      p.dead=true;
      p.hp=0;p.life=0;
      state.message+=' | '+p.name+'生命耗尽，被淘汰！';
    }else{
      p.hp=9; // 新的一条命满血
      state.message+=' | '+p.name+'失去一条命（剩'+p.life+'命），技能槽-1';
    }
  }
};

// 结束队伍回合，切换到另一队
window.G.g6EndTeamTurn=function(){
  const g=state.game;
  g.currentTeam=g.currentTeam==='red'?'blue':'red';
  if(g.currentTeam==='red')g.round++;
  // 检查是否全队淘汰
  const redAlive=Object.values(state.players).some(p=>p.team==='red'&&!p.dead);
  const blueAlive=Object.values(state.players).some(p=>p.team==='blue'&&!p.dead);
  if(!redAlive){this.g6EndGame('blue');return}
  if(!blueAlive){this.g6EndGame('red');return}
  state.message+=' | '+(g.currentTeam==='red'?'红队':'蓝队')+'回合';
  broadcastState();this.renderG6();
};

window.G.g6EndGame=function(winnerTeam){
  state.phase='ended';
  // 计算总分
  const redMembers=Object.values(state.players).filter(p=>p.team==='red');
  const blueMembers=Object.values(state.players).filter(p=>p.team==='blue');
  const redScore=redMembers.reduce((s,p)=>s+g6HpScore(p)+(p.gold||0),0);
  const blueScore=blueMembers.reduce((s,p)=>s+g6HpScore(p)+(p.gold||0),0);
  const winTeam=redScore>blueScore?'red':blueScore>redScore?'blue':winnerTeam;
  state.winner=winTeam;
  const personalGold={};
  Object.entries(state.players).forEach(([id,p])=>{personalGold[id]=p.team===winTeam?5:2});
  gameOver({
    winner:'🎉 '+(winTeam==='red'?'红队':'蓝队')+'胜利！(红'+redScore+' vs 蓝'+blueScore+')',
    personalGold
  });
};

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded',()=>{
  renderCharPick();
  document.getElementById('teamBlueBtn').classList.add('selected');
  const ri=document.getElementById('joinRoomInput');
  ri.addEventListener('input',()=>{
    const rid=ri.value.trim().toUpperCase();
    if(rid.length===6){const s=loadReconnectCode(rid);if(s){document.getElementById('joinReconnectInput').value=s.code;if(s.charId){selectedChar=s.charId;renderCharPick()}if(s.name)myName=s.name;document.getElementById('joinStatus').textContent='检测到重连码，已自动填入'}}
  });
  document.getElementById('joinRoomInput').addEventListener('keydown',e=>{if(e.key==='Enter')playerJoin()});
  document.getElementById('joinReconnectInput').addEventListener('keydown',e=>{if(e.key==='Enter')playerJoin()});
});
</script>
