<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏰 冒险王之夜 · 桌游合集</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#c9a227;--gold-light:#e8c84a;--gold-dark:#8a6d1a;
  --stone:#2a1d10;--stone-light:#3d2e1a;--stone-dark:#1a0f08;
  --blue:#4a90e2;--red:#e74c3c;--green:#7bc47f;
  --text:#d4c5a9;--text-dim:#8a7050;
}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#0d0704;min-height:100vh;color:var(--text);user-select:none;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:url('https://aka.doubaocdn.com/s/QW9qIjkD9F');background-size:cover;background-position:center;background-attachment:fixed;opacity:.3;z-index:0;pointer-events:none}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,rgba(13,7,4,.2) 0%,rgba(13,7,4,.75) 100%);z-index:0;pointer-events:none}
.container{max-width:1100px;margin:0 auto;padding:14px;position:relative;z-index:1}

/* 按钮 */
.btn{padding:11px 28px;font-size:15px;font-weight:bold;border:none;border-radius:26px;cursor:pointer;transition:all .2s;background:linear-gradient(135deg,var(--gold-light),var(--gold-dark));color:#1a0f08;box-shadow:0 3px 10px rgba(201,162,39,.4);border:1px solid var(--gold)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 16px rgba(201,162,39,.6)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-blue{background:linear-gradient(135deg,#5ba0f0,#1565c0);color:#fff;border-color:#4a90e2;box-shadow:0 3px 10px rgba(21,101,192,.4)}
.btn-red{background:linear-gradient(135deg,#f06060,#c62828);color:#fff;border-color:#e74c3c;box-shadow:0 3px 10px rgba(198,40,40,.4)}
.btn-gray{background:linear-gradient(135deg,#78909c,#455a64);color:#fff;border-color:#607d8b;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.btn-small{padding:6px 16px;font-size:13px}
.hidden{display:none!important}

/* 角色选择 */
.role-screen{text-align:center;padding:30px 16px;position:relative;z-index:1}
.role-screen h1{font-size:36px;color:var(--gold-light);margin-bottom:6px;text-shadow:0 4px 12px rgba(0,0,0,.8);letter-spacing:2px}
.role-screen .sub{font-size:14px;color:var(--text-dim);margin-bottom:28px}
.char-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:0 auto 24px}
.char-pick-card{background:rgba(26,15,8,.7);border:2px solid #4a3520;border-radius:14px;padding:14px 10px;cursor:pointer;transition:all .25s;backdrop-filter:blur(4px)}
.char-pick-card:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 8px 24px rgba(201,162,39,.3)}
.char-pick-card.selected{border-color:var(--gold-light);box-shadow:0 0 16px rgba(232,200,74,.5);background:rgba(201,162,39,.15)}
.char-pick-card img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #4a3520;margin-bottom:8px}
.char-pick-card.selected img{border-color:var(--gold-light)}
.char-pick-card .cname{font-size:14px;color:var(--text);font-weight:bold}
.join-field{max-width:360px;margin:0 auto 14px;text-align:left}
.join-field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:5px}
.join-field input{width:100%;padding:11px 14px;border-radius:10px;border:2px solid #4a3520;background:rgba(26,15,8,.8);color:var(--text);font-size:15px;outline:none}
.join-field input:focus{border-color:var(--gold)}
.team-select{display:flex;gap:10px;max-width:360px;margin:0 auto 18px}
.team-btn{flex:1;padding:14px;border-radius:12px;border:3px solid transparent;cursor:pointer;font-size:15px;font-weight:bold;transition:all .2s;background:rgba(26,15,8,.7);color:#999;backdrop-filter:blur(4px)}
.team-btn.blue{border-color:#1976d2}.team-btn.blue.selected{background:rgba(21,101,192,.4);border-color:#64b5f6;color:#fff;box-shadow:0 0 14px rgba(100,181,246,.4)}
.team-btn.red{border-color:#c62828}.team-btn.red.selected{background:rgba(198,40,40,.4);border-color:#ef9a9a;color:#fff;box-shadow:0 0 14px rgba(239,154,154,.4)}
.team-btn .t-icon{font-size:26px;display:block;margin-bottom:3px}
.join-status{font-size:14px;color:var(--gold-light);margin:12px 0;min-height:20px;text-align:center}

/* 大厅 */
.lobby-screen{padding:18px;position:relative;z-index:1}
.lobby-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.lobby-header h2{font-size:22px;color:var(--gold-light)}
.room-id-box{background:rgba(0,0,0,.5);border:2px dashed var(--gold);border-radius:10px;padding:10px 22px;font-size:26px;font-weight:bold;letter-spacing:6px;color:#fff;cursor:pointer;transition:all .2s;user-select:none;position:relative}
.room-id-box:hover{background:rgba(201,162,39,.2);border-style:solid}
.room-id-box:active{transform:scale(.97)}
.room-id-box .copy-hint{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:0;color:var(--gold);white-space:nowrap}
.room-id-box.copied{border-color:#7bc47f;color:#7bc47f}
.team-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.team-panel{background:rgba(26,15,8,.7);border-radius:14px;padding:14px;border:2px solid transparent;backdrop-filter:blur(4px)}
.team-panel.blue{border-color:#1976d2}.team-panel.red{border-color:#c62828}
.team-panel h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.team-panel.blue h3{color:#64b5f6}.team-panel.red h3{color:#ef9a9a}
.team-panel h3 .count{font-size:13px;color:#aaa}
.player-slot{background:rgba(255,255,255,.06);border-radius:8px;padding:9px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;font-size:14px;flex-wrap:wrap;gap:6px}
.player-slot.empty{color:#666;font-style:italic;justify-content:center}
.player-slot .pinfo{display:flex;align-items:center;gap:6px}
.player-slot .pinfo img{width:28px;height:28px;border-radius:50%;border:1px solid #4a3520}
.player-slot .status{font-size:12px;color:var(--green)}.player-slot .status.offline{color:#ef5350}
.lobby-actions{text-align:center}
.lobby-actions .btn{font-size:17px;padding:13px 44px}
.lobby-actions .tip{font-size:13px;color:var(--text-dim);margin-top:10px}

/* 游戏通用 */
.conn-bar{background:rgba(0,0,0,.5);border-radius:8px;padding:6px 14px;font-size:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;backdrop-filter:blur(4px)}
.conn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:5px;vertical-align:middle}
.conn-dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
.game-topbar{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.4);border-radius:10px;padding:8px 16px;margin-bottom:10px;flex-wrap:wrap;gap:8px;font-size:13px;backdrop-filter:blur(4px)}
.game-topbar .title{font-size:17px;font-weight:bold;color:var(--gold-light)}
.game-topbar .info span{background:rgba(255,255,255,.1);padding:3px 10px;border-radius:14px;margin-left:5px}
.game-topbar .info b{color:var(--gold-light)}
.host-controls{margin-bottom:8px;text-align:center}
#gameArea{min-height:300px}

/* 游戏进度条 */
.game-progress{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.gp-step{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:16px;font-size:11px;background:rgba(26,15,8,.7);border:1px solid #4a3520;color:var(--text-dim);transition:all .3s}
.gp-step.active{background:rgba(201,162,39,.2);border-color:var(--gold);color:var(--gold-light);box-shadow:0 0 8px rgba(201,162,39,.3)}
.gp-step.done{background:rgba(123,196,127,.15);border-color:var(--green);color:var(--green)}
.gp-arrow{color:#4a3520;font-size:10px}

/* 游戏结束总结 */
.summary-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.summary-box{background:linear-gradient(135deg,#2a1810,#1a0f08);border:2px solid var(--gold);border-radius:16px;padding:24px 30px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;text-align:center;box-shadow:0 0 40px rgba(201,162,39,.4)}
.summary-title{font-size:24px;color:var(--gold-light);margin-bottom:16px;font-weight:bold}
.summary-section{text-align:left;margin-bottom:14px}
.summary-section h4{color:var(--gold);font-size:14px;margin-bottom:6px;border-bottom:1px solid #4a3520;padding-bottom:4px}
.summary-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid rgba(74,53,32,.3)}
.summary-row .sr-name{display:flex;align-items:center;gap:6px}
.summary-row .sr-name img{width:22px;height:22px;border-radius:50%}
.summary-row .sr-val{color:var(--gold-light);font-weight:bold}
.summary-total{font-size:16px;color:var(--gold-light);font-weight:bold;margin:12px 0;padding:10px;background:rgba(201,162,39,.1);border-radius:8px}

/* 弹窗 */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:linear-gradient(135deg,#2a1810,#1a0f08);border:2px solid var(--gold);border-radius:14px;padding:20px 24px;max-width:440px;width:100%;max-height:80vh;overflow-y:auto}
.modal-box h3{color:var(--gold-light);margin-bottom:12px;text-align:center}

/* 重连码 */
.reconnect-bar{background:rgba(201,162,39,.12);border:1px solid var(--gold);border-radius:8px;padding:6px 14px;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.reconnect-bar b{color:var(--gold-light);letter-spacing:2px;font-size:15px}
.reconnect-code-box{background:rgba(201,162,39,.15);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13px}
.reconnect-code-box code{color:var(--gold-light);font-weight:bold;letter-spacing:2px}

/* 等待页面 */
.wait-screen{text-align:center;padding:30px 16px;position:relative;z-index:1}
.wait-info{background:rgba(26,15,8,.7);border-radius:12px;padding:18px;max-width:400px;margin:0 auto 18px;font-size:14px;line-height:2;backdrop-filter:blur(4px)}
.wait-info b{color:var(--gold-light)}
.team-badge-display{display:inline-block;padding:3px 14px;border-radius:18px;font-size:13px;font-weight:bold}
.team-badge-display.blue{background:#1976d2;color:#fff}.team-badge-display.red{background:#c62828;color:#fff}

@media(max-width:640px){
  .container{padding:10px}
  .role-screen h1{font-size:26px}
  .char-pick-grid{gap:8px}
  .char-pick-card{padding:10px 6px}
  .char-pick-card img{width:56px;height:56px}
  .team-columns{grid-template-columns:1fr;gap:10px}
  .room-id-box{font-size:20px;padding:8px 14px}
}

/* ===== 小蛇机样式 ===== */
#gameArea .g1-team-coins{display:flex;justify-content:space-between;margin-bottom:10px;gap:10px}
#gameArea .g1-team-coin{flex:1;background:rgba(0,0,0,.3);border-radius:10px;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;border:2px solid transparent}
#gameArea .g1-team-coin.blue{border-color:#1976d2}#gameArea .g1-team-coin.red{border-color:#c62828}
#gameArea .g1-team-coin b{font-size:20px;color:var(--gold-light)}
#gameArea .g1-players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
#gameArea .g1-card{background:rgba(0,0,0,.25);border-radius:12px;padding:10px;border:2px solid transparent;transition:all .3s}
#gameArea .g1-card.active{border-color:var(--gold);box-shadow:0 0 14px rgba(201,162,39,.3)}
#gameArea .g1-card.failed{opacity:.5}
#gameArea .g1-card.me{background:rgba(201,162,39,.05)}
#gameArea .g1-pc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;flex-wrap:wrap;gap:4px}
#gameArea .g1-pc-name{font-weight:bold}
#gameArea .g1-pc-coins{color:var(--gold-light);font-weight:bold;font-size:15px}
#gameArea .g1-mini-badge{font-size:10px;padding:1px 6px;border-radius:8px;margin-left:3px}
#gameArea .g1-mini-badge.title{background:linear-gradient(90deg,#ff6f00,#ffd54f);color:#3e2723}
#gameArea .g1-mini-badge.fail{background:#616161}
#gameArea .g1-snake{display:flex;gap:4px;overflow-x:auto;padding:4px 0}
#gameArea .g1-mcard{flex-shrink:0;width:40px;height:54px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:bold;box-shadow:0 2px 4px rgba(0,0,0,.3)}
#gameArea .g1-mcard .mi{font-size:16px}
#gameArea .g1-mcard .mv{font-size:10px;margin-top:1px}
#gameArea .g1-mcard.tail{background:linear-gradient(135deg,#4caf50,#2e7d32);border:1px solid #81c784}
#gameArea .g1-mcard.body-0{background:linear-gradient(135deg,#66bb6a,#388e3c);border:1px solid #a5d6a7}
#gameArea .g1-mcard.body-1{background:linear-gradient(135deg,#4fc3f7,#0288d1);border:1px solid #81d4fa}
#gameArea .g1-mcard.body-2{background:linear-gradient(135deg,#ba68c8,#7b1fa2);border:1px solid #ce93d8}
#gameArea .g1-mcard.body-3{background:linear-gradient(135deg,#ff8a65,#d84315);border:1px solid #ffab91}
#gameArea .g1-mcard.gold{background:linear-gradient(135deg,#ffd54f,#ff8f00);border:1px solid #fff176;color:#3e2723}
#gameArea .g1-mcard.head{background:linear-gradient(135deg,#ef5350,#b71c1c);border:1px solid #ef9a9a;animation:g1pulse 1s infinite}
@keyframes g1pulse{0%,100%{box-shadow:0 0 4px #ef5350}50%{box-shadow:0 0 10px #ef5350}}
#gameArea .g1-center{background:rgba(0,0,0,.25);border-radius:12px;padding:16px;text-align:center;margin-bottom:10px}
#gameArea .g1-msg{font-size:15px;font-weight:bold;min-height:24px;margin-bottom:12px;color:#fff59d}
#gameArea .g1-msg.warn{color:#ef9a9a}#gameArea .g1-msg.good{color:#a5d6a7}
#gameArea .g1-rollrow{display:flex;align-items:center;justify-content:center;gap:24px}
#gameArea .g1-deck{width:60px;height:80px;border-radius:8px;background:repeating-linear-gradient(45deg,#2e7d32,#2e7d32 6px,#1b5e20 6px,#1b5e20 12px);border:2px solid #81c784;display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(255,255,255,.3)}
#gameArea .g1-dice{width:58px;height:58px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#333;box-shadow:0 3px 10px rgba(0,0,0,.5)}
#gameArea .g1-dice.rolling{animation:g1shake .5s ease infinite}
@keyframes g1shake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-15deg) scale(1.1)}75%{transform:rotate(15deg) scale(.95)}}
#gameArea .g1-reveal{text-align:center;margin-bottom:14px;animation:g1reveal .4s ease}
@keyframes g1reveal{0%{transform:scale(.3) rotateY(180deg);opacity:0}100%{transform:scale(1) rotateY(0);opacity:1}}
#gameArea .g1-rcard{width:120px;height:160px;margin:0 auto;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.5);border:3px solid #fff}
#gameArea .g1-rcard.tail{background:linear-gradient(135deg,#4caf50,#2e7d32)}
#gameArea .g1-rcard.body-0{background:linear-gradient(135deg,#66bb6a,#388e3c)}
#gameArea .g1-rcard.body-1{background:linear-gradient(135deg,#4fc3f7,#0288d1)}
#gameArea .g1-rcard.body-2{background:linear-gradient(135deg,#ba68c8,#7b1fa2)}
#gameArea .g1-rcard.body-3{background:linear-gradient(135deg,#ff8a65,#d84315)}
#gameArea .g1-rcard.gold{background:linear-gradient(135deg,#ffd54f,#ff8f00);color:#3e2723}
#gameArea .g1-rcard.head{background:linear-gradient(135deg,#ef5350,#b71c1c);animation:g1rpulse .6s ease infinite}
@keyframes g1rpulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.5)}50%{box-shadow:0 8px 30px rgba(239,83,80,.8)}}
#gameArea .g1-ricon{font-size:48px;margin-bottom:8px}
#gameArea .g1-rname{font-size:20px;font-weight:bold;color:#fff}
#gameArea .g1-reffect{font-size:14px;color:#fff;opacity:.9;margin-top:4px;background:rgba(0,0,0,.25);padding:3px 12px;border-radius:10px}
#gameArea .g1-rplayer{font-size:14px;color:var(--gold-light);font-weight:bold;margin-top:8px}

/* ===== 拍词酒杯样式 ===== */
#gameArea .g2-cup-area{text-align:center;margin-bottom:14px}
#gameArea .g2-cup-wrap{display:inline-block;position:relative}
#gameArea .g2-cup{width:130px;height:160px;margin:0 auto;position:relative;border:4px solid #ffcc80;border-top:none;border-radius:0 0 50px 50px;background:rgba(0,0,0,.3);overflow:hidden}
#gameArea .g2-liquid{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,#ffb74d,#e65100);transition:height .6s ease,background .6s ease}
#gameArea .g2-liquid::before{content:'';position:absolute;top:-6px;left:0;right:0;height:12px;background:rgba(255,255,255,.2);border-radius:50%}
#gameArea .g2-cup-txt{font-size:26px;font-weight:bold;color:#ffb74d;margin-top:8px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#gameArea .g2-cup-txt .max{font-size:15px;color:#ffcc80}
#gameArea .g2-cup.danger{animation:g2shake .4s ease infinite}
@keyframes g2shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#gameArea .g2-dice-row{display:flex;justify-content:center;gap:16px;margin-bottom:10px}
#gameArea .g2-dice{width:62px;height:62px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#333;box-shadow:0 4px 12px rgba(0,0,0,.5);cursor:pointer;transition:all .2s}
#gameArea .g2-dice.rolling{animation:g2dshake .5s ease infinite}
@keyframes g2dshake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-15deg) scale(1.1)}75%{transform:rotate(15deg) scale(.95)}}
#gameArea .g2-dice.selectable:hover{transform:translateY(-6px) scale(1.1);box-shadow:0 8px 20px rgba(255,183,77,.5)}
#gameArea .g2-dice.selected{border:3px solid #ffb74d;box-shadow:0 0 18px rgba(255,183,77,.6);transform:translateY(-6px)}
#gameArea .g2-dice.disabled{opacity:.5;cursor:not-allowed}
#gameArea .g2-dice-eff{font-size:11px;color:#ffab91;margin-top:4px;min-height:16px;text-align:center}
#gameArea .g2-msg{font-size:15px;font-weight:bold;min-height:24px;margin-bottom:10px;color:#fff59d;text-align:center}
#gameArea .g2-msg.warn{color:#ef9a9a}#gameArea .g2-msg.good{color:#a5d6a7}
#gameArea .g2-teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
#gameArea .g2-team{background:rgba(0,0,0,.25);border-radius:12px;padding:10px;border:2px solid transparent}
#gameArea .g2-team.blue{border-color:#1976d2}#gameArea .g2-team.red{border-color:#c62828}
#gameArea .g2-team h4{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between}
#gameArea .g2-team.blue h4{color:#64b5f6}#gameArea .g2-team.red h4{color:#ef9a9a}
#gameArea .g2-team h4 .coins{color:var(--gold-light);font-size:16px}
#gameArea .g2-chip{display:inline-block;padding:5px 10px;border-radius:16px;font-size:12px;margin:2px;background:rgba(255,255,255,.08);transition:all .2s}
#gameArea .g2-chip.active{background:#ffb74d;color:#3e2723;font-weight:bold;box-shadow:0 0 10px rgba(255,183,77,.5)}
#gameArea .g2-chip.me{border:1px dashed var(--gold)}
#gameArea .g2-chip.offline{opacity:.4;text-decoration:line-through}
#gameArea .g2-center{text-align:center;margin-bottom:10px}

/* ===== 酒馆争夺战样式 ===== */
#gameArea .g3-taverns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}

#gameArea .g3-tv.guardian{border-color:#ffb74d}
#gameArea .g3-tv.attackable{cursor:pointer;border-color:var(--gold);box-shadow:0 0 10px rgba(201,162,39,.4)}
#gameArea .g3-tv.attackable:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(201,162,39,.5)}
#gameArea .g3-tv-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
#gameArea .g3-tv-gold{font-size:11px;color:var(--gold-light);margin-bottom:4px}
#gameArea .g3-tv-gold b{font-size:13px}
#gameArea .g3-hit-row{display:flex;align-items:center;gap:4px;font-size:9px;margin:2px 0}
#gameArea .g3-hit-row .bar{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
#gameArea .g3-hit-row .bar-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .3s}
#gameArea .g3-dice-row{display:flex;justify-content:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}

#gameArea .g3-dice.rolling{animation:g3shake .5s ease infinite}
@keyframes g3shake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-15deg) scale(1.1)}75%{transform:rotate(15deg) scale(.95)}}
#gameArea .g3-counts{display:flex;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
#gameArea .g3-count{font-size:12px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.08)}

#gameArea .g3-msg{font-size:14px;font-weight:bold;min-height:22px;margin-bottom:8px;color:#fff59d;text-align:center}
#gameArea .g3-msg.warn{color:#ef9a9a}#gameArea .g3-msg.good{color:#a5d6a7}
#gameArea .g3-reveal{background:rgba(0,0,0,.3);border-radius:10px;padding:10px;text-align:center;margin-bottom:8px;animation:g3reveal .3s ease}
@keyframes g3reveal{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
#gameArea .g3-reveal .rv-name{font-size:16px;font-weight:bold;color:var(--gold-light)}
#gameArea .g3-reveal .rv-eff{font-size:13px;color:#a5d6a7;margin-top:4px}
#gameArea .g3-reveal .rv-g{font-size:12px;color:#ffb74d;margin-top:3px}
#gameArea .g3-center{text-align:center;margin-bottom:10px}
#gameArea .g3-ind-info{font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:6px}
#gameArea .g3-ind-info b{color:var(--gold-light)}
#gameArea .g3-guardian-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:800;display:flex;align-items:center;justify-content:center;padding:16px}
#gameArea .g3-guardian-box{background:linear-gradient(135deg,#3e2723,#1a0a00);border:2px solid var(--gold);border-radius:14px;padding:20px 24px;max-width:400px;width:100%;text-align:center}
#gameArea .g3-guardian-box h3{color:var(--gold-light);margin-bottom:12px}
#gameArea .g3-guardian-box p{font-size:13px;line-height:1.7;color:#ffcc80;margin-bottom:8px}
@media(max-width:640px){#gameArea .g3-taverns{grid-template-columns:repeat(2,1fr)}#gameArea .g3-dice{width:40px;height:40px;font-size:20px}}

/* ===== 冒险王样式 ===== */
#gameArea .g4-enemy{text-align:center;margin-bottom:12px;background:rgba(0,0,0,.3);border-radius:14px;padding:14px}

#gameArea .g4-hp-fill{height:100%;background:linear-gradient(90deg,#ff6b6b,#ee5a24);transition:width .5s;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff}

#gameArea .g4-tdice.flying{opacity:0;transform:translate(-50%,-200%) scale(.5)}

#gameArea .g4-result .hit{color:#a5d6a7}#gameArea .g4-result .miss{color:#ef9a9a}#gameArea .g4-result .dmg{color:var(--gold-light);font-weight:bold}

#gameArea .g4-pz{position:absolute;top:0;height:100%}
#gameArea .g4-pz.miss{left:0;width:10%;background:linear-gradient(90deg,#c62828,#ef5350)}
#gameArea .g4-pz.hole{left:10%;width:8%;background:linear-gradient(90deg,#424242,#616161)}
#gameArea .g4-pz.r1{left:18%;width:20%;background:linear-gradient(90deg,#1565c0,#1976d2)}
#gameArea .g4-pz.r3{left:38%;width:20%;background:linear-gradient(90deg,#00838f,#0097a7)}

#gameArea .g4-pz.r9{left:89%;width:7%;background:linear-gradient(90deg,#ef6c00,#f57c00)}
#gameArea .g4-pz.r10{left:96%;width:4%;background:linear-gradient(90deg,#ffd700,#fff176)}
#gameArea .g4-pointer{position:absolute;top:-4px;width:4px;height:40px;background:#fff;box-shadow:0 0 8px #fff;z-index:2}
#gameArea .g4-plabels{display:flex;justify-content:space-between;font-size:10px;color:#90e0ef;margin-top:4px;padding:0 2px}

#gameArea .g5-cell.skillpoint{border-color:#9c27b0}#gameArea .g5-cell.rock{border-color:#ff9800}

#gameArea .g5-pdot img{width:100%;height:100%;object-fit:cover}
#gameArea .g5-pdot.blue{border-color:#4a90e2}#gameArea .g5-pdot.red{border-color:#e74c3c}
#gameArea .g5-players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
#gameArea .g5-pcard{background:rgba(0,0,0,.3);border-radius:8px;padding:7px;border:2px solid transparent;font-size:11px}
#gameArea .g5-pcard.active{border-color:var(--gold);box-shadow:0 0 8px rgba(201,162,39,.3)}
#gameArea .g5-pcard.dead{opacity:.4}
#gameArea .g5-pcard-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
#gameArea .g5-pcard-head .blue{color:#64b5f6}#gameArea .g5-pcard-head .red{color:#ef9a9a}
#gameArea .g5-pcard-head img{width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:3px}
#gameArea .g5-pcard-skill{font-size:10px;color:var(--gold-light);margin-top:2px}
#gameArea .g5-pcard-skill span{color:#8a7050;font-size:9px}
#gameArea .g5-action{text-align:center;margin-bottom:8px}
#gameArea .g5-dice-display{font-size:28px;margin:6px 0;color:var(--gold-light)}
#gameArea .g5-msg{font-size:14px;font-weight:bold;min-height:22px;margin-bottom:8px;color:#fff59d;text-align:center}
#gameArea .g5-msg.warn{color:#ef9a9a}#gameArea .g5-msg.good{color:#a5d6a7}
#gameArea .g5-duel-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:850;display:flex;align-items:center;justify-content:center;padding:16px}
#gameArea .g5-duel-box{background:linear-gradient(135deg,#2a1810,#1a0f08);border:2px solid var(--gold);border-radius:14px;padding:20px 28px;max-width:420px;width:100%;text-align:center}
#gameArea .g5-duel-box h3{color:var(--gold-light);margin-bottom:14px}
#gameArea .g5-duel-row{display:flex;justify-content:space-around;align-items:center;margin:16px 0}
#gameArea .g5-duel-player{font-size:16px;font-weight:bold}
#gameArea .g5-duel-player.blue{color:#64b5f6}#gameArea .g5-duel-player.red{color:#ef9a9a}
#gameArea .g5-duel-dice{width:56px;height:56px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#333;margin:8px auto;box-shadow:0 3px 10px rgba(0,0,0,.5)}
#gameArea .g5-duel-dice.stopped{animation:none}
#gameArea .g5-duel-vs{font-size:22px;color:var(--gold)}
#gameArea .g5-duel-result{font-size:16px;margin:10px 0;min-height:24px}
#gameArea .g5-duel-result.win{color:var(--gold-light);font-weight:bold}
#gameArea .g5-summary-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:860;display:flex;align-items:center;justify-content:center;padding:16px}
#gameArea .g5-summary-box{background:linear-gradient(135deg,#2a1810,#1a0f08);border:2px solid var(--gold);border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:80vh;overflow-y:auto}
#gameArea .g5-summary-box h3{color:var(--gold-light);text-align:center;margin-bottom:12px}
#gameArea .g5-sum-player{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid rgba(74,53,32,.3)}
#gameArea .g5-skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
#gameArea .g5-skill-card{background:rgba(201,162,39,.1);border:1px solid var(--gold-dark);border-radius:8px;padding:8px;cursor:pointer;font-size:11px;transition:all .2s}
#gameArea .g5-skill-card:hover{background:rgba(201,162,39,.25);border-color:var(--gold)}
#gameArea .g5-skill-card .sk-name{font-weight:bold;color:var(--gold-light);font-size:12px;margin-bottom:3px}
#gameArea .g5-skill-card .sk-desc{color:var(--text-dim);font-size:10px}
@media(max-width:640px){#gameArea .g5-map{grid-template-columns:repeat(5,1fr);gap:2px}#gameArea .g5-cell{min-height:50px;padding:2px}#gameArea .g5-pdot{width:16px;height:16px}#gameArea .g5-players{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">

<!-- 角色选择/加入页面 -->
<div id="joinScreen" class="role-screen">
  <h1>🏰 冒险王之夜</h1>
  <div class="sub">五合一桌游联机 · 地下城冒险</div>
  <div class="char-pick-grid" id="charPickGrid"></div>
  <div class="join-field"><label>房间号</label><input id="joinRoomInput" maxlength="6" placeholder="6位房间号" style="text-transform:uppercase;letter-spacing:4px;text-align:center"></div>
  <div class="join-field"><label>重连码（断线重连时填写，首次留空）</label><input id="joinReconnectInput" maxlength="6" placeholder="可选" style="text-transform:uppercase;letter-spacing:3px;text-align:center"></div>
  <div class="team-select">
    <div class="team-btn blue" id="teamBlueBtn" onclick="selectTeam('blue')"><span class="t-icon">🔵</span>蓝队</div>
    <div class="team-btn red" id="teamRedBtn" onclick="selectTeam('red')"><span class="t-icon">🔴</span>红队</div>
  </div>
  <div class="join-status" id="joinStatus">选择角色和队伍后点击连接</div>
  <button class="btn" onclick="playerJoin()" style="width:100%;max-width:360px">连接并加入</button>
  <div style="margin-top:20px"><button class="btn btn-small btn-gray" onclick="enterHost()">🎩 我是主持人</button></div>
</div>

<!-- 主持人大厅 -->
<div id="hostLobby" class="lobby-screen hidden">
  <div class="lobby-header">
    <h2>🎩 主持人大厅</h2>
    <div class="room-id-box" id="hostRoomId" onclick="copyRoomId()" title="点击复制房间号">------<span class="copy-hint">📋 点击复制</span></div>
  </div>
  <div class="game-progress" id="lobbyProgress"></div>
  <div class="team-columns">
    <div class="team-panel blue"><h3>🔵 蓝队 <span class="count" id="blueCount">0/3</span></h3><div id="blueList"></div></div>
    <div class="team-panel red"><h3>🔴 红队 <span class="count" id="redCount">0/3</span></h3><div id="redList"></div></div>
  </div>
  <div class="lobby-actions">
    <button class="btn" id="startBtn" onclick="hostStartNextGame()" disabled>开始游戏</button>
    <div class="tip" id="startTip">等待玩家加入（每队至少1人）</div>
  </div>
</div>

<!-- 玩家等待页面 -->
<div id="playerWait" class="wait-screen hidden">
  <h2 style="color:var(--gold-light);margin-bottom:14px">等待主持人开始</h2>
  <div class="wait-info">
    <div>角色：<b id="waitName"></b></div>
    <div>队伍：<span id="waitTeam" class="team-badge-display"></span></div>
    <div>房间号：<b id="waitRoom"></b></div>
    <div>当前进度：<b id="waitProgress">等待开始</b></div>
    <div class="reconnect-code-box">重连码：<code id="waitReconnectCode">------</code><br><span style="font-size:11px">断线后凭此码重新加入</span></div>
  </div>
  <div id="waitPlayers" style="font-size:13px;color:var(--text-dim);max-width:400px;margin:0 auto"></div>
</div>

<!-- 游戏区域 -->
<div id="gameScreen" class="hidden">
  <div class="conn-bar"><div><span class="conn-dot" id="connDot"></span><span id="connText">连接中</span></div><div id="myRoleLabel"></div></div>
  <div id="playerReconnectBar" class="reconnect-bar hidden"><span>🔑 重连码：<b id="playerReconnectCode">------</b></span></div>
  <div class="game-topbar">
    <div class="title" id="gameTitle">游戏</div>
    <div class="info" id="gameInfo"></div>
  </div>
  <div class="game-progress" id="gameProgress"></div>
  <div class="host-controls hidden" id="hostControls"></div>
  <div id="gameArea"></div>
</div>

</div>

<script>
// ==================== 常量 ====================
const CHARACTERS=[
  {id:'adou',name:'阿兜',img:'https://aka.doubaocdn.com/s/Lh6PmLCxMT'},
  {id:'duolin',name:'多琳',img:'https://aka.doubaocdn.com/s/9UahRGVXMU'},
  {id:'lier',name:'莉尔',img:'https://aka.doubaocdn.com/s/HORtTWaL71'},
  {id:'muen',name:'沐恩',img:'https://aka.doubaocdn.com/s/jmuVaUnHIS'},
  {id:'xiupa',name:'休帕',img:'https://aka.doubaocdn.com/s/UsW6A1uMzh'},
  {id:'yuanyuan',name:'圆圆',img:'https://aka.doubaocdn.com/s/m1e9FU01iN'},
];
const GAMES=[
  {id:1,name:'小蛇机',icon:'🐍',teamGold:true},
  {id:2,name:'拍词酒杯',icon:'🍺',teamGold:true},
  {id:3,name:'酒馆争夺战',icon:'⚔️',teamGold:false},
  {id:4,name:'冒险王之投了个骰',icon:'🎯',teamGold:false},
  {id:5,name:'逃生机制',icon:'🏰',teamGold:false},
];
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const STORAGE_KEY='dungeon_night_reconnect';

// ==================== 全局状态 ====================
let peer=null,conn=null,isHost=false,myPeerId=null,myTeam=null,myName=null,myReconnectCode=null,myCharId=null;
let selectedTeam='blue',selectedChar=null;
let state=null;
let hostConns={};

function genCode(){let s='';for(let i=0;i<6;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return s}
function showScreen(id){['joinScreen','hostLobby','playerWait','gameScreen'].forEach(s=>document.getElementById(s).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function setConn(s,t){document.getElementById('connDot').className='conn-dot'+(s==='online'?' online':'');document.getElementById('connText').textContent=t}
function saveReconnectCode(roomId,code,name,charId){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');d[roomId]={code,name,charId};localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}catch(e){}}
function loadReconnectCode(roomId){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')[roomId]||null}catch(e){return null}}
function playerName(id){return state&&state.players[id]?state.players[id].name:'?'}
function charImg(charId){const c=CHARACTERS.find(x=>x.id===charId);return c?c.img:''}
function charName(charId){const c=CHARACTERS.find(x=>x.id===charId);return c?c.name:'?'}

// ==================== 角色选择UI ====================
function renderCharPick(){
  const grid=document.getElementById('charPickGrid');
  grid.innerHTML=CHARACTERS.map(c=>`<div class="char-pick-card ${selectedChar===c.id?'selected':''}" onclick="pickChar('${c.id}')"><img src="${c.img}" alt="${c.name}"><div class="cname">${c.name}</div></div>`).join('');
}
function pickChar(id){selectedChar=id;renderCharPick()}
function selectTeam(t){selectedTeam=t;document.getElementById('teamBlueBtn').classList.toggle('selected',t==='blue');document.getElementById('teamRedBtn').classList.toggle('selected',t==='red')}

// ==================== 主持人 ====================
function enterHost(){
  isHost=true;
  showScreen('hostLobby');
  document.getElementById('hostRoomId').textContent='连接中...';
  const roomId=genCode();
  const iceConfig={config:{iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:stun2.l.google.com:19302'},
    {urls:'stun:stun.cloudflare.com:3478'},
    {urls:'stun:stun.services.mozilla.com:3478'},
    {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
  ]}};
  try{peer=new Peer('dungeon-'+roomId,{debug:1,...iceConfig})}catch(e){alert('连接失败');return}
  peer.on('open',id=>{
    myPeerId=id;
    state={phase:'lobby',roomId,players:{},currentGame:0,game:null,gameSummary:null,turnOrder:[],currentIndex:0,round:1,message:'',messageType:''};
    peer.on('connection',c=>{
      c.on('open',()=>{hostConns[c.peer]=c;setupHostConn(c)});
      c.on('close',()=>{
        if(hostConns[c.peer]){delete hostConns[c.peer];
          if(state&&state.players[c.peer]){
            state.players[c.peer].online=false;
            if(state.phase==='lobby'){renderHostLobby();broadcastState()}
            else{broadcastState();if(window.G&&window.G.render)window.G.render()}
          }
        }
      });
    });
    document.getElementById('hostRoomId').textContent=roomId;
    renderHostLobby();
  });
  peer.on('error',err=>{if(err.type==='unavailable-id'){alert('房间号冲突，请刷新重试')}else alert('连接失败：'+(err.type||err.message))});
}
function setupHostConn(c){
  c.on('data',msg=>handleHostMsg(c.peer,msg));
}
function sendTo(id,m){if(hostConns[id]&&hostConns[id].open)try{hostConns[id].send(m)}catch(e){}}
function broadcast(m){Object.values(hostConns).forEach(c=>{if(c.open)try{c.send(m)}catch(e){}})}
function broadcastState(){broadcast({type:'state',state:state})}

function handleHostMsg(peerId,msg){
  if(!msg||!msg.type)return;
  if(msg.type==='join'){
    // 重连
    if(msg.reconnectCode){
      const ex=Object.entries(state.players).find(([id,p])=>p.reconnectCode===msg.reconnectCode);
      if(ex){
        const[oldId,p]=ex;delete hostConns[oldId];delete state.players[oldId];
        p.online=true;state.players[peerId]=p;
        if(state.turnOrder){const idx=state.turnOrder.indexOf(oldId);if(idx>=0)state.turnOrder[idx]=peerId}
        sendTo(peerId,{type:'joinAccept',yourId:peerId,reconnectCode:msg.reconnectCode,reconnected:true,name:p.name,team:p.team,charId:p.character,state:state});
        if(state.phase==='lobby')renderHostLobby();
        if(state.phase==='playing'&&window.G&&window.G.render)window.G.render();
        broadcastState();return;
      }
    }
    if(state.phase!=='lobby'){sendTo(peerId,{type:'joinReject',reason:'游戏已开始，需重连码'});return}
    if(Object.values(state.players).filter(p=>p.team===msg.team).length>=3){sendTo(peerId,{type:'joinReject',reason:'队伍已满'});return}
    let charId=msg.charId;
    if(charId&&Object.values(state.players).some(p=>p.character===charId)){
      const taken=Object.values(state.players).map(p=>p.character).filter(Boolean);
      const avail=CHARACTERS.find(c=>!taken.includes(c.id));charId=avail?avail.id:null;
    }
    const rc=genCode();
    const cname=charName(charId);
    state.players[peerId]={name:cname,character:charId,team:msg.team,online:true,reconnectCode:rc,gold:0};
    sendTo(peerId,{type:'joinAccept',yourId:peerId,reconnectCode:rc,name:cname,team:msg.team,charId:charId});
    renderHostLobby();broadcastState();
  }
  else if(msg.type==='hostAction'){
    // 主持人操作由游戏模块处理
    if(window.G && window.G.hostAction)window.G.hostAction(peerId,msg.action);
  }
  else if(msg.type==='playerAction'){
    if(window.G && window.G.playerAction)window.G.playerAction(peerId,msg.action);
  }
}

function renderHostLobby(){

    const d=document.createElement('div');d.className='player-slot';

    d.innerHTML=`<span class="pinfo">${p.character?`<img src="${charImg(p.character)}">`:''}${p.name} <span style="font-size:10px;color:var(--gold)">🔑${p.reconnectCode}</span></span>
    <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span class="status ${p.online?'':'offline'}">${p.online?'在线':'离线'}</span>

      <button class="btn btn-small ${bc}" style="padding:2px 8px;font-size:11px" onclick="hostSwitchTeam('${id}')">${tt}</button>

function hostSetGold(id,val){if(!state||state.phase!=='lobby')return;state.players[id].gold=Math.max(0,parseInt(val)||0);broadcastState()}
function hostSwitchTeam(id){
  if(!state||state.phase!=='lobby')return;const p=state.players[id];if(!p)return;
  const nt=p.team==='blue'?'red':'blue';
  if(Object.values(state.players).filter(pl=>pl.team===nt).length>=3){alert('队伍已满');return}

function copyRoomId(){
  const el=document.getElementById('hostRoomId');
  const code=state.roomId||'';
  if(!code)return;
  const done=()=>{el.classList.add('copied');const h=el.querySelector('.copy-hint');if(h)h.textContent='✅ 已复制';setTimeout(()=>{el.classList.remove('copied');if(h)h.textContent='📋 点击复制'},1500)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done).catch(()=>{fallbackCopy(code,done)})}
  else fallbackCopy(code,done);
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');cb&&cb()}catch(e){alert('复制失败，请手动复制：'+text)}
  document.body.removeChild(ta);
}

// 游戏结束（由游戏模块调用）
function gameOver(summary){
  state.phase='gameOver';
  state.gameSummary=summary;
  // 金币结算
  if(summary.teamGold){
    // 队伍金币平分
    ['blue','red'].forEach(team=>{
      const members=Object.entries(state.players).filter(([_,p])=>p.team===team);
      const teamGold=summary.teamGold[team]||0;
      const share=members.length>0?Math.floor(teamGold/members.length):0;
      members.forEach(([id,p])=>{p.gold=(p.gold||0)+share});
    });
  }
  if(summary.personalGold){
    Object.entries(summary.personalGold).forEach(([id,g])=>{if(state.players[id])state.players[id].gold=(state.players[id].gold||0)+g});
  }
  broadcastState();
  renderGameSummary();
}

function renderGameSummary(){

  const gi=GAMES[state.currentGame-1];

  // 队伍金币
  if(s.teamGold){
    html+=`<div class="summary-section"><h4>队伍金币</h4>`;
    ['blue','red'].forEach(t=>{
      const members=Object.entries(state.players).filter(([_,p])=>p.team===t);
      const tg=s.teamGold[t]||0;
      const share=members.length>0?Math.floor(tg/members.length):0;
      html+=`<div class="summary-row"><span>${t==='blue'?'🔵蓝队':'🔴红队'}</span><span class="sr-val">${tg}金币 ÷${members.length} = 每人${share}</span></div>`;
    });
    html+='</div>';
  }
  // 个人金币
  if(s.personalGold){
    html+=`<div class="summary-section"><h4>个人金币</h4>`;
    Object.entries(s.personalGold).forEach(([id,g])=>{
      const p=state.players[id];if(!p)return;
      html+=`<div class="summary-row"><span class="sr-name">${p.character?`<img src="${charImg(p.character)}">`:''}${p.name}</span><span class="sr-val">+${g}金币</span></div>`;
    });
    html+='</div>';
  }
  // 总金币
  html+=`<div class="summary-section"><h4>当前总金币</h4>`;
  Object.values(state.players).forEach(p=>{
    html+=`<div class="summary-row"><span class="sr-name">${p.character?`<img src="${charImg(p.character)}">`:''}${p.name} (${p.team==='blue'?'🔵':'🔴'})</span><span class="sr-val">💰${p.gold}</span></div>`;
  });
  html+='</div>';
  if(isHost){
    if(state.currentGame<5){
      html+=`<button class="btn" onclick="closeSummaryAndNext()" style="width:100%">开始下一局：${GAMES[state.currentGame].icon} ${GAMES[state.currentGame].name}</button>`;
    }else{
      html+=`<div class="summary-total">🎉 全部游戏结束！</div>`;
    }
  }else{
    html+=`<div style="color:var(--text-dim);font-size:13px">等待主持人开始下一局...</div>`;
  }
  html+='</div></div>';
  document.getElementById('gameArea').innerHTML=html;
}

function playerJoin(){
  const roomId=document.getElementById('joinRoomInput').value.trim().toUpperCase();
  const rc=document.getElementById('joinReconnectInput').value.trim().toUpperCase();
  if(roomId.length!==6){document.getElementById('joinStatus').textContent='请输入6位房间号';return}
  if(!selectedChar&&!rc){document.getElementById('joinStatus').textContent='请先选择角色';return}
  myTeam=selectedTeam;myReconnectCode=rc||null;myCharId=selectedChar;
  document.getElementById('joinStatus').textContent='正在连接...';
  const iceConfig={config:{iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:stun2.l.google.com:19302'},
    {urls:'stun:stun.cloudflare.com:3478'},
    {urls:'stun:stun.services.mozilla.com:3478'},
    {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
  ]}};
  try{peer=new Peer({debug:1,...iceConfig})}catch(e){document.getElementById('joinStatus').textContent='连接失败';return}
  peer.on('open',()=>{
    myPeerId=peer.id;
    conn=peer.connect('dungeon-'+roomId,{reliable:true});
    conn.on('open',()=>{
      const m={type:'join',team:myTeam,charId:myCharId};
      if(rc)m.reconnectCode=rc;
      conn.send(m);
      document.getElementById('joinStatus').textContent=rc?'正在重连...':'已连接...';
    });
    conn.on('data',d=>handlePlayerMsg(d));
    conn.on('close',()=>{setConn('offline','已断开')});
    conn.on('error',()=>{document.getElementById('joinStatus').textContent='连接失败'});
  });
  peer.on('error',err=>{document.getElementById('joinStatus').textContent='连接失败：'+(err.type||err.message)});
}

function handlePlayerMsg(msg){
  if(!msg||!msg.type)return;
  if(msg.type==='joinAccept'){
    myPeerId=msg.yourId;myReconnectCode=msg.reconnectCode;
    if(msg.name)myName=msg.name;if(msg.team)myTeam=msg.team;if(msg.charId)myCharId=msg.charId;
    const roomId=document.getElementById('joinRoomInput').value.trim().toUpperCase();
    saveReconnectCode(roomId,msg.reconnectCode,myName,myCharId);
    if(msg.reconnected&&msg.state){state=msg.state;enterGameScreen();if(window.G&&window.G.render)window.G.render();return}
    document.getElementById('waitName').textContent=myName;
    const tb=document.getElementById('waitTeam');tb.textContent=myTeam==='blue'?'🔵 蓝队':'🔴 红队';tb.className='team-badge-display '+myTeam;
    document.getElementById('waitRoom').textContent=roomId;
    document.getElementById('waitReconnectCode').textContent=msg.reconnectCode;
    showScreen('playerWait');
  }
  else if(msg.type==='joinReject'){document.getElementById('joinStatus').textContent='加入失败：'+msg.reason}
  else if(msg.type==='teamChanged'){myTeam=msg.team;const tb=document.getElementById('waitTeam');if(tb){tb.textContent=myTeam==='blue'?'🔵 蓝队':'🔴 红队';tb.className='team-badge-display '+myTeam}}
  else if(msg.type==='state'){
    state=msg.state;
    if(state.phase==='playing'&&document.getElementById('gameScreen').classList.contains('hidden'))enterGameScreen();
    if(state.phase==='gameOver'){
      if(document.getElementById('gameScreen').classList.contains('hidden'))enterGameScreen();
      renderGameSummary();
    }
    if(state.phase==='lobby'&&!document.getElementById('playerWait').classList.contains('hidden'))renderWaitScreen();
    if(state.phase==='playing'&&window.G&&window.G.render)window.G.render();
    if(state.phase==='playing'){
      renderProgress('gameProgress');
      document.getElementById('gameTitle').textContent=GAMES[state.currentGame-1].icon+' '+GAMES[state.currentGame-1].name;
    }
  }
}
function enterGameScreen(){
  showScreen('gameScreen');
  document.getElementById('myRoleLabel').textContent=myName+' ('+(myTeam==='blue'?'🔵蓝队':'🔴红队')+')';
  setConn('online','已连接');
  if(myReconnectCode){document.getElementById('playerReconnectBar').classList.remove('hidden');document.getElementById('playerReconnectCode').textContent=myReconnectCode}
  renderProgress('gameProgress');
}
function renderWaitScreen(){
  const b=Object.values(state.players).filter(p=>p.team==='blue');
  const r=Object.values(state.players).filter(p=>p.team==='red');
  document.getElementById('waitPlayers').innerHTML=`蓝队(${b.length}/3)：${b.map(p=>p.name).join('、')||'—'}<br>红队(${r.length}/3)：${r.map(p=>p.name).join('、')||'—'}`;

// ==================== 游戏1：小蛇机 ====================
const G1_CARDS={
  head:{label:'出局',cls:'head',value:0,icon:'🐍'},
  gold:{label:'金牌',cls:'gold',value:5,icon:'🏆'},
  scarf0:{label:'0围脖',cls:'body-0',value:0,icon:'🐍'},
  scarf1:{label:'1围脖',cls:'body-1',value:1,icon:'🧣'},
  scarf2:{label:'2围脖',cls:'body-2',value:2,icon:'🧣'},
  scarf3:{label:'3围脖',cls:'body-3',value:3,icon:'🧣'},
  tail:{label:'蛇尾',cls:'tail',value:0,icon:'🐍'},
};
const G1_DECK=[{type:'head',count:8},{type:'gold',count:4},{type:'scarf0',count:8},{type:'scarf1',count:8},{type:'scarf2',count:8},{type:'scarf3',count:6}];
const G1_DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];

window.G.initG1=function(){
  this.g1Deck=[];G1_DECK.forEach(c=>{for(let i=0;i<c.count;i++)this.g1Deck.push(c.type)});
  for(let i=this.g1Deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[this.g1Deck[i],this.g1Deck[j]]=[this.g1Deck[j],this.g1Deck[i]]}
  // 初始化玩家
  const blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue').map(([id])=>id);
  const reds=Object.entries(state.players).filter(([_,p])=>p.team==='red').map(([id])=>id);
  const order=[];const mx=Math.max(blues.length,reds.length);
  for(let i=0;i<mx;i++){if(blues[i])order.push(blues[i]);if(reds[i])order.push(reds[i])}
  state.turnOrder=order;state.currentIndex=0;state.round=1;
  state.game={firstHead:false,lastCard:null,deckCount:this.g1Deck.length};
  Object.values(state.players).forEach(p=>{p.snake=['tail'];p.g1coins=0;p.failed=false;p.g1title=false});
  state.message=playerName(order[0])+' 的回合，投掷骰子';state.messageType='';
  document.getElementById('gameInfo').innerHTML='<span>回合 <b id="g1Round">1</b></span><span>牌堆 <b id="g1DeckN">42</b></span><span id="g1Turn"></span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small btn-red" onclick="G.hostActionG1(null,\'skip\')">跳过当前断线玩家</button>';
  this.g1Rolling=false;
};

window.G.renderG1=function(){
  if(!state.game)return;
  const g=state.game;
  document.getElementById('g1Round').textContent=state.round;
  document.getElementById('g1DeckN').textContent=g.deckCount;
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){
    const cp=state.players[curId];
    document.getElementById('g1Turn').innerHTML=`当前：<b style="color:${cp.team==='blue'?'#64b5f6':'#ef9a9a'}">${cp.name}</b>${cp.online?'':'（离线⏸️）'}`;
  }
  let bc=0,rc=0;
  Object.values(state.players).forEach(p=>{if(p.team==='blue')bc+=p.g1coins;else rc+=p.g1coins});
  let html=`<div class="g1-team-coins"><div class="g1-team-coin blue"><span>🔵 蓝队</span><b>${bc}</b></div><div class="g1-team-coin red"><span>🔴 红队</span><b>${rc}</b></div></div>`;
  html+='<div class="g1-players">';
  state.turnOrder.forEach(id=>{
    const p=state.players[id];if(!p)return;
    let badges='';
    if(p.g1title)badges+='<span class="g1-mini-badge title">一发入魂</span>';
    if(p.failed)badges+='<span class="g1-mini-badge fail">出局</span>';
    let snakeHtml='';
    p.snake.forEach(t=>{const c=G1_CARDS[t];let mv=t==='gold'?'5':t.startsWith('scarf')?c.value:t==='head'?'✕':'';snakeHtml+=`<div class="g1-mcard ${c.cls}"><span class="mi">${c.icon}</span><span class="mv">${mv}</span></div>`});
    html+=`<div class="g1-card ${id===curId&&state.phase==='playing'&&!p.failed?'active':''} ${p.failed?'failed':''} ${id===myPeerId?'me':''}">
      <div class="g1-pc-head"><span class="g1-pc-name">${p.team==='blue'?'🔵':'🔴'} ${p.name}${id===myPeerId?' (你)':''}${badges}${p.online?'':' 💤'}</span><span class="g1-pc-coins">${p.g1coins}币</span></div>
      <div class="g1-snake">${snakeHtml}</div></div>`;
  });
  html+='</div>';
  html+=`<div class="g1-center"><div class="g1-msg ${state.messageType||''}" id="g1Msg">${state.message||''}</div><div class="g1-rollrow">
    <div><div class="g1-deck">🃏</div><div style="font-size:11px;color:#a5d6a7;margin-top:4px">牌堆 ${g.deckCount}</div></div>
    <div class="g1-dice" id="g1Dice">🎲</div>
    <button class="btn" id="g1RollBtn" onclick="G.actionG1(myPeerId,'roll')">投掷骰子</button>
  </div></div>`;
  if(g.lastCard){
    const lc=g.lastCard,ct=G1_CARDS[lc.type];
    html+=`<div class="g1-reveal"><div class="g1-rcard ${ct.cls}"><div class="g1-ricon">${ct.icon}</div><div class="g1-rname">${ct.label}</div><div class="g1-reffect">${lc.effect}</div></div><div class="g1-rplayer">${lc.playerName} 抽到</div></div>`;
  }
  document.getElementById('gameArea').innerHTML=html;
  // 按钮状态
  const btn=document.getElementById('g1RollBtn');
  if(state.phase==='playing'){
    if(isHost){btn.disabled=true;btn.textContent='观战中'}
    else if(!curId||!state.players[curId].online){btn.disabled=true;btn.textContent='等待重连...'}
    else{const myTurn=curId===myPeerId&&!state.players[myPeerId].failed;btn.disabled=!myTurn||this.g1Rolling;btn.textContent=myTurn?(this.g1Rolling?'投掷中...':'🎲 投掷骰子'):'等待对手...'}
  }else{btn.disabled=true;btn.textContent='游戏已结束'}
};

window.G.actionG1=function(peerId,action){
  if(action.type!=='roll')return;
  if(state.phase!=='playing'||this.g1Rolling)return;
  if(state.turnOrder[state.currentIndex]!==peerId)return;
  if(!state.players[peerId].online||state.players[peerId].failed)return;
  this.g1Rolling=true;this.renderG1();
  this.g1AnimateDice();
  setTimeout(()=>{this.g1DrawCard()},850);
};

window.G.hostActionG1=function(peerId,action){
  if(action.type==='skip'&&state.phase==='playing'){
    const curId=state.turnOrder[state.currentIndex];
    state.message='主持人跳过了 '+state.players[curId].name+' 的回合';state.messageType='warn';
    this.g1NextTurn();broadcastState();this.renderG1();
  }
};

window.G.g1AnimateDice=function(){
  const el=document.getElementById('g1Dice');if(!el)return;
  el.classList.add('rolling');let t=0;
  const iv=setInterval(()=>{el.textContent=G1_DICE[Math.floor(Math.random()*6)];t++;if(t>=10){clearInterval(iv);el.classList.remove('rolling');el.textContent=G1_DICE[Math.floor(Math.random()*6)]}},80);
};

window.G.g1DrawCard=function(){
  if(!this.g1Deck||this.g1Deck.length===0){this.g1EndGame();return}
  const idx=Math.floor(Math.random()*this.g1Deck.length);
  const cardType=this.g1Deck.splice(idx,1)[0];
  const curId=state.turnOrder[state.currentIndex];
  const p=state.players[curId];const card=G1_CARDS[cardType];
  if(cardType==='head'){
    if(state.round<=3){
      this.g1Deck.push('head');
      for(let i=this.g1Deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[this.g1Deck[i],this.g1Deck[j]]=[this.g1Deck[j],this.g1Deck[i]]}
      state.message=`🐍 ${p.name} 翻出蛇头！第${state.round}回合保底期，无效放回。继续投掷！`;state.messageType='warn';
      state.game.lastCard={type:'head',playerName:p.name,effect:'保底无效，放回牌堆'};
    }else{
      p.snake.push('head');p.failed=true;
      let m=`💀 ${p.name} 翻出蛇头，出局！`;let eff='失败出局';
      if(!state.game.firstHead){state.game.firstHead=true;p.g1title=true;p.g1coins+=5;m+=' 一发入魂+5金币！';eff='出局 · 一发入魂+5币'}
      state.message=m;state.messageType='warn';
      state.game.lastCard={type:'head',playerName:p.name,effect:eff};
    }
  }else{
    p.snake.push(cardType);p.g1coins+=card.value;
    state.message=`${p.name} 抓到【${card.label}】，${card.value>0?'+'+card.value+'金币':'无金币'}`;state.messageType='good';
    state.game.lastCard={type:cardType,playerName:p.name,effect:card.value>0?'+'+card.value+'金币':'无金币'};
  }
  state.game.deckCount=this.g1Deck.length;
  this.g1Rolling=false;
  broadcastState();this.renderG1();
  if(this.g1CheckEnd())setTimeout(()=>this.g1EndGame(),1500);
  else setTimeout(()=>{this.g1NextTurn();broadcastState();this.renderG1()},1200);
};

window.G.g1NextTurn=function(){
  const len=state.turnOrder.length;if(len===0)return;
  let nextIdx=(state.currentIndex+1)%len;
  if(nextIdx<=state.currentIndex)state.round++;
  state.currentIndex=nextIdx;
  let guard=0;
  while(state.players[state.turnOrder[state.currentIndex]].failed&&guard<len){
    state.currentIndex=(state.currentIndex+1)%len;
    if(state.currentIndex===0)state.round++;guard++;
  }
  const np=state.players[state.turnOrder[state.currentIndex]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else{state.message=np.name+' 的回合（第'+state.round+'回合），投掷骰子';state.messageType=''}
};

window.G.g1CheckEnd=function(){
  if(state.round>8)return true;
  const alive=state.turnOrder.filter(id=>!state.players[id].failed);
  if(alive.length===0)return true;
  if(!this.g1Deck||this.g1Deck.length===0)return true;
  return false;
};

window.G.g1EndGame=function(){
  let bc=0,rc=0;
  Object.values(state.players).forEach(p=>{if(p.team==='blue')bc+=p.g1coins;else rc+=p.g1coins});
  const winner=bc>rc?'🔵 蓝队获胜！':rc>bc?'🔴 红队获胜！':'🤝 平局！';
  gameOver({winner,teamGold:{blue:bc,red:rc}});
};

// ==================== 游戏2：拍词酒杯 ====================
const G2_DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const G2_EFF={1:'+1酒',2:'+2酒',3:'+3酒',4:'-4酒',5:'跳过',6:'反转'};
const G2_CUP_INIT=15,G2_CUP_MAX=31;

window.G.initG2=function(){
  const blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue').map(([id])=>id);
  const reds=Object.entries(state.players).filter(([_,p])=>p.team==='red').map(([id])=>id);
  const order=[];const mx=Math.max(blues.length,reds.length);
  for(let i=0;i<mx;i++){if(blues[i])order.push(blues[i]);if(reds[i])order.push(reds[i])}
  state.turnOrder=order;state.currentIndex=0;state.round=1;
  state.game={cup:G2_CUP_INIT,direction:1,dice:[null,null,null],diceRolled:false,winner:null};
  Object.values(state.players).forEach(p=>{p.g2coins=0});
  state.message=playerName(order[0])+' 的回合，投掷骰子';state.messageType='';
  document.getElementById('gameInfo').innerHTML='<span>第 <b id="g2Round">1</b> 轮</span><span id="g2Turn"></span><span id="g2Dir">➡️</span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small btn-red" onclick="G.hostActionG2(null,\'skip\')">跳过当前断线玩家</button>';
};

window.G.renderG2=function(){
  if(!state.game)return;const g=state.game;
  document.getElementById('g2Round').textContent=state.round;
  document.getElementById('g2Dir').textContent=g.direction===1?'➡️':'⬅️';
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){const cp=state.players[curId];document.getElementById('g2Turn').innerHTML=`当前：<b style="color:${cp.team==='blue'?'#64b5f6':'#ef9a9a'}">${cp.name}</b>${cp.online?'':'（离线⏸️）'}`}
  const pct=Math.min(100,(g.cup/G2_CUP_MAX)*100);
  let html=`<div class="g2-cup-area"><div class="g2-cup-wrap"><div class="g2-cup ${g.cup>=27?'danger':''}"><div class="g2-liquid" style="height:${pct}%;background:${g.cup>=27?'linear-gradient(180deg,#ff5252,#b71c1c)':g.cup>=20?'linear-gradient(180deg,#ff8a65,#d84315)':'linear-gradient(180deg,#ffb74d,#e65100)'}"></div></div><div class="g2-cup-txt">${g.cup}<span class="max">/${G2_CUP_MAX}</span></div></div></div>`;
  html+='<div class="g2-center"><div class="g2-dice-row">';
  for(let i=0;i<3;i++){
    const val=g.dice[i];
    const canSelect=!isHost&&curId===myPeerId&&g.diceRolled&&state.phase==='playing'&&state.players[curId]&&state.players[curId].online;
    html+=`<div class="g2-dice ${g.diceRolled&&val!=null?(canSelect?'selectable':''):'disabled'}" id="g2d${i}" ${canSelect?`onclick="G.actionG2(myPeerId,{type:'select',index:${i}})"`:''}>${g.diceRolled&&val!=null?G2_DICE[val-1]:'🎲'}</div>`;
  }
  html+='</div><div class="g2-dice-eff">'+(g.diceRolled?g.dice.map((v,i)=>`骰${i+1}:${G2_EFF[v]}`).join(' | '):'')+'</div>';
  html+=`<div class="g2-msg ${state.messageType||''}">${state.message||''}</div>`;
  const canRoll=!isHost&&curId===myPeerId&&!g.diceRolled&&state.phase==='playing'&&state.players[curId]&&state.players[curId].online;
  html+=`<button class="btn" id="g2RollBtn" onclick="G.actionG2(myPeerId,{type:'roll'})" ${canRoll?'':'disabled'}>${g.diceRolled?'请选择一颗骰子':(curId===myPeerId?'🎲 投掷骰子':'等待对手...')}</button></div>`;
  // 队伍
  html+='<div class="g2-teams">';
  ['blue','red'].forEach(t=>{
    let tc=0;state.turnOrder.forEach(id=>{const p=state.players[id];if(p&&p.team===t)tc+=p.g2coins});
    html+=`<div class="g2-team ${t}"><h4>${t==='blue'?'🔵 蓝队':'🔴 红队'}<span class="coins">${tc}币</span></h4>`;
    state.turnOrder.forEach(id=>{const p=state.players[id];if(!p||p.team!==t)return;html+=`<span class="g2-chip ${id===curId?'active':''} ${id===myPeerId?'me':''} ${p.online?'':'offline'}">${p.name}${p.online?'':'💤'}${id===curId?(g.direction===1?'➡️':'⬅️'):''}</span>`});
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('gameArea').innerHTML=html;
};

window.G.actionG2=function(peerId,action){
  if(state.phase!=='playing')return;
  if(state.turnOrder[state.currentIndex]!==peerId)return;
  if(!state.players[peerId].online)return;
  if(action.type==='roll'&&!state.game.diceRolled){
    state.game.dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];
    state.game.diceRolled=true;
    state.message=state.players[peerId].name+' 投出骰子，请选择一颗';state.messageType='';
    broadcastState();this.renderG2();
  }else if(action.type==='select'&&state.game.diceRolled){
    this.g2DoSelect(action.index);
  }
};

window.G.hostActionG2=function(peerId,action){
  if(action.type==='skip'&&state.phase==='playing'){
    state.message='主持人跳过了 '+state.players[state.turnOrder[state.currentIndex]].name+' 的回合';state.messageType='warn';
    state.game.diceRolled=false;state.game.dice=[null,null,null];
    this.g2NextTurn();broadcastState();this.renderG2();
  }
};

window.G.g2DoSelect=function(idx){
  const val=state.game.dice[idx];const curId=state.turnOrder[state.currentIndex];const p=state.players[curId];
  if(val<=3){state.game.cup+=val;state.message=`${p.name} 选择+${val}酒，酒杯 ${state.game.cup-val}→${state.game.cup}`}
  else if(val===4){state.game.cup=Math.max(0,state.game.cup-4);state.message=`${p.name} 选择-4酒，酒杯降至 ${state.game.cup}`}
  else if(val===5){state.message=`${p.name} 选择跳过回合`}
  else if(val===6){state.game.direction*=-1;state.message=`${p.name} 选择反转！方向${state.game.direction===1?'恢复正向':'变为逆向'}`}
  state.messageType=(val<=3&&state.game.cup>=27)?'warn':'good';
  if(state.game.cup>=G2_CUP_MAX){
    state.game.winner=p.team==='blue'?'red':'blue';
    state.message+=` — 酒杯溢出！${p.team==='blue'?'蓝队':'红队'}输了！`;state.messageType='warn';
    const winTeam=state.game.winner;
    Object.values(state.players).forEach(pl=>{pl.g2coins=pl.team===winTeam?10:6});
    let wc=0,lc=0;Object.values(state.players).forEach(pl=>{if(pl.team===winTeam)wc+=10;else lc+=6});
    const winner=winTeam==='blue'?'🔵 蓝队获胜！':'🔴 红队获胜！';
    gameOver({winner,teamGold:{blue:winTeam==='blue'?wc:lc,red:winTeam==='red'?wc:lc}});
    return;
  }
  state.game.diceRolled=false;state.game.dice=[null,null,null];
  this.g2NextTurn();broadcastState();this.renderG2();
};

window.G.g2NextTurn=function(){
  const len=state.turnOrder.length;if(len===0)return;
  const nextIdx=(state.currentIndex+state.game.direction+len)%len;
  if(state.game.direction===1&&nextIdx<=state.currentIndex)state.round++;
  if(state.game.direction===-1&&nextIdx>=state.currentIndex&&nextIdx!==state.currentIndex)state.round++;
  state.currentIndex=nextIdx;
  const np=state.players[state.turnOrder[nextIdx]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else{state.message=np.name+' 的回合（第'+state.round+'轮），投掷骰子';state.messageType=''}
};

// ==================== 游戏3：酒馆争夺战 ====================
const G3_DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const G3_TAVERNS=[
  {id:1,topGold:5,bottomGold:2,guardian:'猞猁'},{id:2,topGold:7,bottomGold:3,guardian:'乌鸦'},
  {id:3,topGold:9,bottomGold:4,guardian:'老虎'},{id:4,topGold:12,bottomGold:5,guardian:null},
  {id:5,topGold:15,bottomGold:6,guardian:null},{id:6,topGold:20,bottomGold:8,guardian:null},
];
const G3_INIT_IND=8;

window.G.initG3=function(){
  const blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue').map(([id])=>id);
  const reds=Object.entries(state.players).filter(([_,p])=>p.team==='red').map(([id])=>id);
  state._blues=blues;state._reds=reds;
  state.game={taverns:G3_TAVERNS.map(t=>({...t,hits:{}})),dice:[],diceRolled:false,coinflip:null,guardianGame:null,lastAction:null};
  state.turnOrder=[];state.currentIndex=0;state.round=1;
  Object.values(state.players).forEach(p=>{p.g3coins=0;p.indicators=G3_INIT_IND});
  state.phase='coinflip';
  state.message='开局比大小：两队各投一颗骰子，点数大的先行动';state.messageType='';
  document.getElementById('gameInfo').innerHTML='<span>第 <b id="g3Round">1</b> 轮</span><span id="g3Turn"></span><span id="g3IndInfo" class="g3-ind-info"></span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small" id="g3CoinflipBtn" onclick="G.hostActionG3(null,{type:\'coinflip\'})">投骰比大小</button> <button class="btn btn-small btn-red" onclick="G.hostActionG3(null,\'skip\')">跳过断线玩家</button>';
};

window.G.renderG3=function(){
  if(!state.game)return;const g=state.game;
  document.getElementById('g3Round').textContent=state.round;
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){const cp=state.players[curId];document.getElementById('g3Turn').innerHTML=`当前：<b style="color:${cp.team==='blue'?'#64b5f6':'#ef9a9a'}">${cp.name}</b>${cp.online?'':'（离线⏸️）'}`}
  if(!isHost&&state.players[myPeerId])document.getElementById('g3IndInfo').innerHTML='我的指示物：<b>'+state.players[myPeerId].indicators+'</b>';
  else if(isHost&&curId)document.getElementById('g3IndInfo').innerHTML=playerName(curId)+' 指示物：<b>'+state.players[curId].indicators+'</b>';

  let html='';
  // 比大小阶段
  if(state.phase==='coinflip'){
    const cf=g.coinflip||{};
    html+='<div class="g3-center"><div class="g3-dice-row">';
    if(cf.done){
      html+=`<div class="g3-dice" style="border:3px solid #1976d2">${G3_DICE[cf.blue-1]}</div><div style="font-size:22px;align-self:center">VS</div><div class="g3-dice" style="border:3px solid #c62828">${G3_DICE[cf.red-1]}</div>`;
    }else html+='<div style="font-size:14px;color:#ffcc80;align-self:center">等待主持人投骰...</div>';
    html+='</div>';
    if(cf.done)html+=`<div style="font-size:13px;margin:8px 0">🔵蓝队 ${cf.blue} 点 · 🔴红队 ${cf.red} 点</div>`;
    if(isHost)html+=`<button class="btn" onclick="G.hostActionG3(null,{type:'coinflip'})">${cf.done&&cf.winner==='tie'?'平局！再投一次':'投骰比大小'}</button>`;
    else html+='<button class="btn" disabled>等待主持人...</button>';
    html+='</div>';
    html+=`<div class="g3-msg ${state.messageType||''}">${state.message||''}</div>`;
    document.getElementById('gameArea').innerHTML=html;return;
  }

  // 酒馆网格
  html+='<div class="g3-taverns">';
  const isMyTurn=!isHost&&curId===myPeerId&&g.diceRolled&&state.phase==='playing'&&state.players[curId]&&state.players[curId].online;
  g.taverns.forEach(tv=>{
    const maxHit=Math.max(1,...Object.values(tv.hits));
    let hitsHtml='';
    state.turnOrder.forEach(id=>{const p=state.players[id];if(!p)return;const h=tv.hits[id]||0;hitsHtml+=`<div class="g3-hit-row"><span>${p.team==='blue'?'🔵':'🔴'}${p.name}</span><span class="bar"><span class="bar-fill" style="width:${(h/maxHit)*100}%"></span></span><span>${h}</span></div>`});
    html+=`<div class="g3-tv ${tv.guardian?'guardian':''} ${isMyTurn?'attackable':''}" ${isMyTurn?`onclick="G.actionG3(myPeerId,{type:'attack',tavernId:${tv.id}})"`:''}>
      <div class="g3-tv-head"><span>🍺 ${tv.id}号</span>${tv.guardian?'🛡️':''}</div>
      <div class="g3-tv-gold">上<b>${tv.topGold}</b>/下<b>${tv.bottomGold}</b></div>${hitsHtml}</div>`;
  });
  html+='</div>';
  // 骰子
  html+='<div class="g3-dice-row">';
  if(g.diceRolled&&g.dice.length)g.dice.forEach(v=>html+=`<div class="g3-dice">${G3_DICE[v-1]}</div>`);
  html+='</div>';
  if(g.diceRolled){
    html+='<div class="g3-counts">';
    for(let n=1;n<=6;n++){const cnt=g.dice.filter(d=>d===n).length;html+=`<span class="g3-count">${G3_DICE[n-1]}×<b>${cnt}</b></span>`}
    html+='</div>';
  }
  // 操作展示
  if(g.lastAction){
    const la=g.lastAction;
    html+=`<div class="g3-reveal"><div class="rv-name">${la.playerName} → ${la.tavernId}号酒馆</div><div class="rv-eff">${la.effect}</div>${la.guardianEffect?`<div class="rv-g">🛡️ ${la.guardianEffect}</div>`:''}</div>`;
  }
  html+=`<div class="g3-msg ${state.messageType||''}">${state.message||''}</div>`;
  html+='<div class="g3-center">';
  if(state.phase==='playing'){
    if(g.guardianGame)html+='<button class="btn" disabled>守护者小游戏中...</button>';
    else if(isHost)html+='<button class="btn" disabled>观战中</button>';
    else if(!curId||!state.players[curId].online)html+='<button class="btn" disabled>等待重连...</button>';
    else{
      const myTurn=curId===myPeerId;const myInd=state.players[myPeerId]?state.players[myPeerId].indicators:0;
      if(!g.diceRolled)html+=`<button class="btn" onclick="G.actionG3(myPeerId,{type:'roll'})" ${!myTurn||myInd<=0?'disabled':''}>${myTurn?(myInd<=0?'已用完':'🎲 投掷骰子'):'等待对手...'}</button>`;
      else html+=`<button class="btn" ${!myTurn?'disabled':''}>${myTurn?'点击酒馆攻击 ↑':'等待对手...'}</button>`;
    }
  }else html+='<button class="btn" disabled>游戏已结束</button>';
  html+='</div>';
  document.getElementById('gameArea').innerHTML=html;
  // 守护者弹窗
  if(g.guardianGame)this.g3ShowGuardian(g.guardianGame);
};

window.G.actionG3=function(peerId,action){
  if(action.type==='roll'){
    if(state.phase!=='playing'||state.game.diceRolled)return;
    if(state.turnOrder[state.currentIndex]!==peerId||!state.players[peerId].online)return;
    const count=state.players[peerId].indicators;
    state.game.dice=[];for(let i=0;i<count;i++)state.game.dice.push(1+Math.floor(Math.random()*6));
    state.game.diceRolled=true;
    state.message=state.players[peerId].name+' 投出 '+count+' 颗骰子，请选择攻击的酒馆';state.messageType='';
    broadcastState();this.renderG3();
  }else if(action.type==='attack'){
    if(state.phase!=='playing'||!state.game.diceRolled)return;
    if(state.turnOrder[state.currentIndex]!==peerId)return;
    this.g3DoAttack(action.tavernId);
  }else if(action.type==='guardianAction'){
    if(!state.game.guardianGame||state.game.guardianGame.playerId!==peerId)return;
    this.g3GuardianAction(action.action);
  }else if(action.type==='guardianDone'){
    if(!state.game.guardianGame||state.game.guardianGame.playerId!==peerId)return;
    this.g3FinishGuardian();
  }
};

window.G.hostActionG3=function(peerId,action){
  if(action.type==='coinflip'&&state.phase==='coinflip'){
    const b=1+Math.floor(Math.random()*6),r=1+Math.floor(Math.random()*6);
    state.game.coinflip={blue:b,red:r,done:true};
    if(b>r)state.game.coinflip.winner='blue';else if(r>b)state.game.coinflip.winner='red';else state.game.coinflip.winner='tie';
    if(state.game.coinflip.winner!=='tie'){
      const first=state.game.coinflip.winner==='blue'?state._blues:state._reds;
      const second=state.game.coinflip.winner==='blue'?state._reds:state._blues;
      const order=[];const mx=Math.max(first.length,second.length);
      for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
      state.turnOrder=order;state.currentIndex=0;state.phase='playing';
      state.message=(state.game.coinflip.winner==='blue'?'🔵蓝队':'🔴红队')+' 获胜先行动！'+playerName(order[0])+' 的回合';state.messageType='good';
    }else state.message='平局！再投一次';state.messageType='warn';
    broadcastState();this.renderG3();
  }else if(action==='skip'&&state.phase==='playing'){
    state.message='主持人跳过了 '+state.players[state.turnOrder[state.currentIndex]].name;state.messageType='warn';
    state.game.diceRolled=false;state.game.dice=[];state.game.guardianGame=null;
    this.g3NextTurn();broadcastState();this.renderG3();
  }
};

window.G.g3DoAttack=function(tavernId){
  const curId=state.turnOrder[state.currentIndex];const p=state.players[curId];const tv=state.game.taverns[tavernId-1];
  const baseHits=state.game.dice.filter(d=>d===tavernId).length;
  if(baseHits===0){
    state.message=p.name+' 选了'+tavernId+'号酒馆，但该数字未出现，跳过';state.messageType='warn';
    state.game.lastAction={tavernId,playerName:p.name,effect:'跳过回合'};
    state.game.diceRolled=false;state.game.dice=[];this.g3AfterAttack();return;
  }
  tv.hits[curId]=(tv.hits[curId]||0)+baseHits;
  const cost=Math.min(p.indicators,baseHits);p.indicators-=cost;
  state.message=`${p.name} 攻击${tavernId}号酒馆，打破${baseHits}个酒桶（剩余${p.indicators}指示物）`;state.messageType='good';
  state.game.lastAction={tavernId,playerName:p.name,effect:'打破'+baseHits+'个酒桶',guardian:tv.guardian};
  state.game.diceRolled=false;state.game.dice=[];
  if(tv.guardian){
    const gg={active:true,tavernId,playerId:curId,type:tv.guardian,step:'choose'};
    if(tv.guardian==='猞猁')gg.actualHand=Math.random()<0.5?'left':'right';
    else if(tv.guardian==='乌鸦')gg.guardianGuess=1+Math.floor(Math.random()*3);
    else if(tv.guardian==='老虎'){gg.rounds=[];gg.wins=0}
    state.game.guardianGame=gg;broadcastState();this.renderG3();return;
  }
  this.g3AfterAttack();
};

window.G.g3GuardianAction=function(action){
  const gg=state.game.guardianGame;if(!gg)return;
  if(gg.type==='猞猁'){gg.guess=action.guess;gg.step='result'}
  else if(gg.type==='乌鸦'){gg.playerNum=action.playerNum;gg.step='result'}
  else if(gg.type==='老虎'){
    const pr=1+Math.floor(Math.random()*6),gr=1+Math.floor(Math.random()*6);
    if(pr>gr)gg.wins++;gg.rounds.push({player:pr,guardian:gr,win:pr>gr});
    if(gg.rounds.length>=3)gg.step='result';
  }
  broadcastState();this.renderG3();
};

window.G.g3FinishGuardian=function(){
  const gg=state.game.guardianGame;if(!gg)return;const p=state.players[gg.playerId];let eff='';
  if(gg.type==='猞猁'){if(gg.guess===gg.actualHand){p.g3coins+=2;eff='猜对！+2金币'}else eff='猜错，无事发生'}
  else if(gg.type==='乌鸦'){if(gg.playerNum!==gg.guardianGuess){p.indicators+=1;eff='守护者猜错！返还1指示物'}else{p.g3coins+=gg.playerNum;eff='守护者猜对！+'+gg.playerNum+'金币'}}
  else if(gg.type==='老虎'){p.g3coins+=gg.wins;eff='赢'+gg.wins+'局，+'+gg.wins+'金币'}
  state.message+=' | 🛡️'+gg.type+'：'+eff;
  if(state.game.lastAction)state.game.lastAction.guardianEffect=eff;
  state.game.guardianGame=null;this.g3AfterAttack();
};

window.G.g3AfterAttack=function(){
  broadcastState();this.renderG3();
  const allDone=state.turnOrder.every(id=>state.players[id].indicators<=0);
  if(allDone){setTimeout(()=>this.g3EndGame(),1500);return}
  setTimeout(()=>{this.g3NextTurn();broadcastState();this.renderG3()},1500);
};

window.G.g3NextTurn=function(){
  const len=state.turnOrder.length;if(len===0)return;
  let nextIdx=(state.currentIndex+1)%len;if(nextIdx<=state.currentIndex)state.round++;
  let guard=0;
  while(state.players[state.turnOrder[nextIdx]].indicators<=0&&guard<len){nextIdx=(nextIdx+1)%len;if(nextIdx===0)state.round++;guard++}
  state.currentIndex=nextIdx;
  const np=state.players[state.turnOrder[nextIdx]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else state.message=np.name+' 的回合（第'+state.round+'轮），投掷骰子';state.messageType='';
};

window.G.g3SettleTavern=function(tv){
  const groups={};
  Object.entries(tv.hits).forEach(([id,c])=>{if(c>0){if(!groups[c])groups[c]=[];groups[c].push(id)}});
  const invalid=new Set();Object.values(groups).forEach(ids=>{if(ids.length>=2)ids.forEach(id=>invalid.add(id))});
  const valid=Object.entries(tv.hits).filter(([id,c])=>c>0&&!invalid.has(id)).sort((a,b)=>b[1]-a[1]);
  return{first:valid[0]?valid[0][0]:null,second:valid[1]?valid[1][0]:null};
};

window.G.g3EndGame=function(){
  state.phase='ended';
  let m=document.getElementById('g3GuardianModal');if(m)m.remove();
  Object.values(state.players).forEach(p=>p.g3coins=0);
  state.game.taverns.forEach(tv=>{const r=this.g3SettleTavern(tv);if(r.first)state.players[r.first].g3coins+=tv.topGold;if(r.second)state.players[r.second].g3coins+=tv.bottomGold});
  const personalGold={};Object.entries(state.players).forEach(([id,p])=>personalGold[id]=p.g3coins);
  let bc=0,rc=0;Object.values(state.players).forEach(p=>{if(p.team==='blue')bc+=p.g3coins;else rc+=p.g3coins});
  const winner=bc>rc?'🔵 蓝队获胜！':rc>bc?'🔴 红队获胜！':'🤝 平局！';
  gameOver({winner,personalGold});
};

window.G.g3ShowGuardian=function(gg){

  let title='',content='';

      <div style="display:flex;gap:12px;justify-content:center;margin:14px 0">

      <div style="display:flex;gap:10px;justify-content:center;margin:14px 0">
      <button class="btn" ${isPlayer?'':'disabled'} onclick="G.actionG3(myPeerId,{type:'guardianAction',action:{playerNum:1}})">1个</button>
      <button class="btn" ${isPlayer?'':'disabled'} onclick="G.actionG3(myPeerId,{type:'guardianAction',action:{playerNum:2}})">2个</button>
      <button class="btn" ${isPlayer?'':'disabled'} onclick="G.actionG3(myPeerId,{type:'guardianAction',action:{playerNum:3}})">3个</button></div>`;
    else{const wrong=gg.playerNum!==gg.guardianGuess;content=`<div style="font-size:36px;margin:10px">${wrong?'🎉':'😅'}</div><p>${pname}放了<b>${gg.playerNum}</b>个，守护者猜<b>${gg.guardianGuess}</b></p><p style="color:${wrong?'#a5d6a7':'#ef9a9a'};font-weight:bold">${wrong?'猜错！返1指示物':'猜对！+'+gg.playerNum+'金币'}</p>${isPlayer?'<button class="btn" onclick="G.actionG3(myPeerId,{type:\'guardianDone\'})">继续</button>':'<p style="color:#888">等待...</p>'}`}
  }else if(gg.type==='老虎'){
    title='🛡️ 老虎守护者';
    let rh='';gg.rounds.forEach((r,i)=>rh+=`<div style="font-size:13px;padding:3px 0">第${i+1}局：${pname} ${G3_DICE[r.player-1]}(${r.player}) vs 守护者 ${G3_DICE[r.guardian-1]}(${r.guardian}) → ${r.win?'赢':'输/平'}</div>`);
    if(gg.step==='choose')content=`<p>3局赌大小，赢几局得几金币。</p><div style="margin:10px 0">${rh}</div>${isPlayer?`<button class="btn" onclick="G.actionG3(myPeerId,{type:'guardianAction',action:{roll:true}})">投第${gg.rounds.length+1}局</button>`:'<p style="color:#888">等待'+pname+'...</p>'}`;
    else content=`<p>3局赌大小，赢几局得几金币。</p><div style="margin:10px 0">${rh}</div><div style="color:var(--gold-light);font-weight:bold">共赢${gg.wins}局，+${gg.wins}金币！</div>${isPlayer?'<button class="btn" style="margin-top:10px" onclick="G.actionG3(myPeerId,{type:\'guardianDone\'})">继续</button>':'<p style="color:#888">等待...</p>'}`}
  // 渲染弹窗
