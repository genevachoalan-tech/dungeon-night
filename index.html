  // 装备槽
  html+='<div class="g6-panel-equips">';
  (p.equipSlots||charData.equip).forEach((slotName,i)=>{
    if(slotName==='道具'){
      // 道具槽可以显示多个道具
      const items=p.equipment?.filter(e=>e.slot==='道具')||[];
      if(items.length===0){
        html+='<div class="g6-panel-slot empty"><div class="slot-name">道具</div></div>';
      }else{
        items.forEach((item,ii)=>{
          const canUse=p.id===myPeerId&&!p.dead&&item.effect!=='reflectHalf';
          html+='<div class="g6-panel-slot'+(canUse?' usable':'')+'"'+(canUse?' onclick="G.g6PromptUseItem(\''+p.id+'\',\''+item.id+'\')"':'')+'><div class="slot-name">道具'+(items.length>1?(ii+1):'')+'</div><div class="item-name">'+(item.icon||'')+' '+item.name+'</div>'+(item.desc?'<div class="item-desc">'+item.desc+'</div>':'')+(canUse?'<div class="use-hint">点击使用</div>':'')+'</div>';
        });
      }
    }else if(slotName==='宝物'){
      // 宝物槽：从p.treasures查找
      const treasure=p.treasures?.[0];
      html+='<div class="g6-panel-slot'+(treasure?'':' empty')+'"><div class="slot-name">宝物</div>'+(treasure?'<div class="item-name">'+(treasure.icon||'💎')+' '+treasure.name+'</div><div class="item-desc">'+treasure.desc+'</div>':'')+'</div>';
    }else{
      const item=p.equipment?.find(e=>e.slot===slotName);
      html+='<div class="g6-panel-slot'+(item?'':' empty')+(item?.exclusive?' exclusive':'')+'"><div class="slot-name">'+slotName+'</div>'+(item?'<div class="item-name">'+(item.icon||'')+' '+item.name+(item.bonus?' <span style="color:#ffd700">+'+item.bonus+'</span>':'')+'</div>'+(item.desc?'<div class="item-desc">'+item.desc+'</div>':''):'')+'</div>';
    }
  });
  html+='</div>';
  // 技能槽（2自带+最多2购买=4）
  html+='<div class="g6-panel-skills">';
  for(let i=0;i<4;i++){
    const skill=p.skills?.[i];
    if(skill){
      const skillColorHex={red:'#ff4444',blue:'#4488ff',green:'#44cc44'}[skill.color]||skill.color;
      const colorLabel={red:'红',blue:'蓝',green:'绿'}[skill.color]||'';
      html+='<div class="g6-panel-skill'+(skill.sealed?' sealed':'')+'" style="border-color:'+skillColorHex+'">';
      html+='<div class="skill-name" style="color:'+skillColorHex+'">'+(colorLabel?'<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+skillColorHex+';margin-right:4px"></span>':'')+skill.name+(skill.sealed?' 🔒':'')+'</div>';
      html+='<div class="skill-desc">'+skill.desc+'</div>';
      html+='</div>';
    }else{
      html+='<div class="g6-panel-skill empty">技能槽'+(i+1)+'</div>';
    }
  }
  html+='</div>';
  // 背包
  html+='<div class="g6-panel-backpack"><div class="bp-title">🎒 背包（最多2件装备/技能）</div><div class="bp-slots">';
  for(let i=0;i<2;i++){
    const item=p.backpack?.[i];
    if(item){
      const canEquip=p.id===myPeerId&&!p.dead&&item.slot&&item.slot!=='宝物';
      html+='<div class="bp-slot'+(canEquip?' usable':'')+'"'+(canEquip?' onclick="G.g6EquipFromBackpack(\''+p.id+'\','+i+')"':'')+' style="cursor:'+(canEquip?'pointer':'default')+'" title="'+(item.desc||'')+'">'+(item.icon||'')+' '+item.name+(item.desc?'<div style="font-size:9px;color:#aaa;margin-top:2px">'+item.desc.substring(0,20)+(item.desc.length>20?'...':'')+'</div>':'')+(canEquip?'<div style="font-size:9px;color:#ffd700">点击装备</div>':'')+'</div>';
    }else{
      html+='<div class="bp-slot">空</div>';
    }
  }
  html+='</div></div>';
  // 宝物栏
  html+='<div class="g6-panel-treasures"><div class="bp-title">💎 宝物（被动效果）</div><div class="treasure-slots">';
  if(p.treasures&&p.treasures.length>0){
    p.treasures.forEach(t=>{
      html+='<div class="treasure-slot" title="'+t.desc+'"><img src="'+t.img+'" style="width:32px;height:32px;border-radius:4px"><span class="treasure-name">'+t.name+'</span></div>';
    });
  }else{
    html+='<div style="color:var(--text-dim);font-size:12px">暂无宝物</div>';
  }
  html+='</div></div>';
  html+='</div></div></div>';
  return html;
};

// 切换人物面板
function g6SwitchPanel(playerId){
  const p=state.players[playerId];
  if(!p)return;
  // 权限检查：只能看同队伍或主持人
  if(!isHost){
    const myP=state.players[myPeerId];
    if(!myP||p.team!==myP.team)return;
  }
  document.querySelectorAll('.g6-panel-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panelTab-'+playerId)?.classList.add('active');
  const panel=document.getElementById('g6CharPanel');
  if(panel)panel.outerHTML=G.g6RenderCharPanel(p);
}

window.G.g6RenderButtons=function(){
  const g=state.game;const btns=document.getElementById('g6Buttons');
  if(!btns)return;
  const myP=state.players[myPeerId];
  if(!myP||myP.dead){btns.innerHTML='';return}
  if(g.phase==='positionselect'||g.phase==='routeselect'){btns.innerHTML='';return}
  const curPlayer=G.g6GetCurrentPlayer();
  const curName=curPlayer?curPlayer.player.name:'';
  if(g.phase==='moving'){
    if(curPlayer&&curPlayer.peerId===myPeerId){
      btns.innerHTML='<button class="btn" onclick="sendAction({type:\'g6move\'})">🚶 全队前进1格</button>';
    }else{
      btns.innerHTML='<span style="color:var(--text-dim)">等待 '+curName+' 移动...</span>';
    }
  }else if(g.phase==='combat'){
    const c=g.combat;
    if(c.attacker===myPeerId&&!c.resolved){
      if(c.rolling){
        btns.innerHTML='<button class="btn btn-red" onclick="G.g6Lock()">🎯 锁定！</button>';
      }else if(c.locked){
        // 锁定后：显示可用技能（匹配骰子颜色+双数）和确认结算按钮
        let skillBtns='';
        const attacker=state.players[myPeerId];
        if(attacker.skills&&!c.skillUsed){
          attacker.skills.forEach((s,idx)=>{
            if(s.used||s.sealed)return;
            if(s.color!==c.diceColor)return;
            if(!c.isEven)return;
            if(c.ring===0&&!s.evenMiss)return;
            // 魅魔禁用红色技能
            if(c.monster&&c.monster.effect==='noRedSkill'&&s.color==='red')return;
            const colorHex={red:'#ff4444',blue:'#4488ff',green:'#44cc44'}[s.color]||'#ffd700';
            skillBtns+='<button class="btn" style="border-color:'+colorHex+';color:'+colorHex+';margin:2px" onclick="sendAction({type:\'g6skill\',skillIndex:'+idx+'})">✨ '+s.name+'</button>';
          });
        }
        btns.innerHTML=skillBtns+'<button class="btn btn-gold" style="margin:2px" onclick="sendAction({type:\'g6confirm\'})">✅ 确认结算</button>';
      }else{
        // 投骰前：选择骰子颜色（只显示有对应颜色技能的颜色）
        const attacker=state.players[myPeerId];
        const colors=['red','blue','green'];
        const colorHex={red:'#ff4444',blue:'#4488ff',green:'#44cc44'};
        const colorName={red:'红骰',blue:'蓝骰',green:'绿骰'};
        let diceBtns='';
        colors.forEach(col=>{
          const hasSkill=attacker.skills&&attacker.skills.some(s=>s.color===col&&!s.sealed);
          if(hasSkill){
            diceBtns+='<button class="btn" style="border-color:'+colorHex[col]+';color:'+colorHex[col]+';margin:2px" onclick="G.g6StartRoll(\''+col+'\')">🎲 '+colorName[col]+'</button>';
          }
        });
        btns.innerHTML=diceBtns;
      }
    }else if(c.resolved){
      btns.innerHTML='<span style="color:var(--gold)">结算中...</span>';
    }else{
      const attacker=state.players[c.attacker];
      btns.innerHTML='<span style="color:var(--text-dim)">等待'+(attacker?attacker.name:'')+(c.locked?'确认结算':'投骰')+'...</span>';
    }
  }else if(g.phase==='shop'||g.phase==='chest'||g.phase==='clover'||g.phase==='itemDrop'){
    btns.innerHTML='';
  }else{
    btns.innerHTML='';
  }
};

// 玩家选择号位
window.G.g6SelectPosition=function(peerId,position){
  const g=state.game;
  if(g.phase!=='positionselect')return;
  const p=state.players[peerId];
  if(!p||p.dead)return;
  if(p.position)return; // 已选择
  // 检查号位是否被同队其他玩家占用
  const teamMembers=Object.values(state.players).filter(pl=>pl.team===p.team&&!pl.dead);
  if(teamMembers.some(pl=>pl.position===position)){
    state.message=p.name+'选择的'+position+'号位已被占用';
    broadcastState();this.renderG6();
    return;
  }
  p.position=position;
  state.message=p.name+' 选择了 '+position+' 号位';
  broadcastState();this.renderG6();
};

// 主持人确认号位选择完成
window.G.g6PositionDone=function(peerId){
  const g=state.game;
  if(g.phase!=='positionselect')return;
  if(!isHost&&peerId!==state.hostId)return;
  // 检查所有在线存活玩家是否都选择了号位（排除主持人）
  const allSelected=Object.values(state.players).filter(p=>!p.dead&&p.online&&p.id!==state.hostId).every(p=>p.position);
  if(!allSelected){
    state.message='还有在线玩家未选择号位';
    broadcastState();this.renderG6();
    return;
  }
  g.phase='routeselect';
  state.message='✅ 号位选择完成！进入路线选择';
  broadcastState();this.renderG6();
};

// 选择路线
window.G.g6SelectRoute=function(peerId,route){
  const p=state.players[peerId];const g=state.game;
  if(g.phase!=='routeselect')return;
  if(g.teamPos[p.team].route)return; // 已选择
  // 路线选择优先级：优先队伍先选，选完后另一个队伍才能选
  const pickTeam=g.floor===1?g.firstPickTeam:g.secondPickTeam;
  if(pickTeam&&pickTeam!==p.team&&!g.teamPos[pickTeam]?.route){
    state.message=(pickTeam==='red'?'红队':'蓝队')+'优先选择路线，请等待';
    broadcastState();this.renderG6();
    return;
  }
  // 路线互斥：另一队已选的路线不能再选
  const otherTeam=p.team==='red'?'blue':'red';
  if(g.teamPos[otherTeam]?.route===route){
    state.message='⚠️ '+(route==='top'?'上路':'下路')+'已被'+(otherTeam==='red'?'红队':'蓝队')+'选择，请选择另一条路线';
    broadcastState();this.renderG6();
    return;
  }
  g.teamPos[p.team].route=route;
  state.message=(p.team==='red'?'红队':'蓝队')+'选择了'+(route==='top'?'上路':'下路');
  // 检查两队是否都选好了
  if(g.teamPos.red.route&&g.teamPos.blue.route){
    // 两队都选好路线后，先在雕像区（起点）购买装备
    g.phase='shop';
    g.shop={cellKey:'start', team:g.firstPickTeam||'red', bought:{}, done:{}, isStart:true};
    state.message+=' | 两队路线已确定，在雕像区购买装备（'+(g.firstPickTeam==='red'?'红队':'蓝队')+'先）';
  }
  broadcastState();this.renderG6();
};

// 获取当前turnIndex对应的队伍和号位
window.G.g6GetTurnInfo=function(){
  const g=state.game;
  const idx=g.turnIndex||0;
  const team=idx%2===0?'red':'blue';
  const position=Math.floor(idx/2)+1;
  return {team,position,idx};
};

window.G.g6GetCurrentPlayer=function(){
  const g=state.game;
  const info=this.g6GetTurnInfo();
  const entries=Object.entries(state.players).filter(([pid,p])=>p.team===info.team&&!p.dead&&pid!==state.hostId);
  let entry=entries.find(([pid,p])=>p.position===info.position);
  if(!entry&&entries.length>0)entry=entries[0];
  return entry?{peerId:entry[0],player:entry[1]}:null;
};

window.G.g6NextTurn=function(){
  const g=state.game;
  g.turnIndex=(g.turnIndex||0)+1;
  if(g.turnIndex>=6){
    g.turnIndex=0;
    g.round=(g.round||1)+1;
  }
  const info=this.g6GetTurnInfo();
  g.currentTeam=info.team;
  if(g.turnIndex===0)this.g6EndRound();
  this.g6CheckTurnAction();
  broadcastState();this.renderG6();
};

window.G.g6CheckTurnAction=function(){
  const g=state.game;
  if(g.phase==='shop'||g.phase==='chest'||g.phase==='clover'||g.phase==='itemDrop'||g.itemDrop||g.cloverEvent||g.chestSelect)return;
  const current=this.g6GetCurrentPlayer();
  if(!current){this.g6NextTurn();return;}
  const team=current.player.team;
  const tp=g.teamPos[team];
  if(!tp||!tp.route)return;
  const floorData=g.floor===1?G6_FLOOR1:G6_FLOOR2;
  const routeData=tp.route==='top'?floorData.top:floorData.bottom;
  const cell=routeData[tp.pos];
  if(cell&&cell.type==='monster'){
    const cellKey=tp.route+'-'+tp.pos;
    if(!g.monstersDefeated[team]?.includes(cellKey)){
      let monster=g.cellMonsters?.[team]?.[cellKey];
      if(monster&&monster.hp>0){
        g.phase='combat';
        g.combat={monster,monsterHp:monster.hp,cellKey,team,attacker:current.peerId,attackerIndex:0,rolling:false,resolved:false,ring:0,dice:0,pointer:0,crit:false,round:g.round||1,log:[],locked:false,skillUsed:false};
        state.message='⚔️ '+current.player.name+'（'+current.player.position+'号位）攻击'+monster.name+'（剩余'+monster.hp+'血）';
        return;
      }
    }
  }
  if(tp.pos>=routeData.length){
    // BOSS战：使用公共血量
    if(g.bossHp===null||g.bossHp===undefined){
      this.g6TriggerBoss(team);
      return;
    }
    if(g.bossHp>0){
      g.phase='combat';
      g.combat={monster:g.bossMonster,monsterHp:g.bossHp,cellKey:'boss-'+g.floor,team,attacker:current.peerId,attackerIndex:0,rolling:false,resolved:false,ring:0,dice:0,pointer:0,crit:false,round:g.round||1,log:[],locked:false,isBoss:true,skillUsed:false};
      state.message='⚔️ '+current.player.name+' 攻击'+g.bossMonster.name+'（'+g.bossHp+'/'+g.bossMaxHp+'血）';
      return;
    }
  }
  g.phase='moving';
  state.message='🎲 '+current.player.name+'（'+current.player.position+'号位）的回合，点击前进';
};

// 队伍移动
window.G.g6Move=function(peerId){
  const p=state.players[peerId];const g=state.game;
  const current=this.g6GetCurrentPlayer();
  if(!current||current.peerId!==peerId||g.phase!=='moving')return;
  if(!g._moveCooldown)g._moveCooldown={};
  if(g._moveCooldown[peerId]&&Date.now()-g._moveCooldown[peerId]<1000)return;
  g._moveCooldown[peerId]=Date.now();
  const team=p.team;
  const tp=g.teamPos[team];
  if(!tp.route)return;
  const floorData=g.floor===1?G6_FLOOR1:G6_FLOOR2;
  const routeData=floorData[tp.route];
  let newPos=tp.pos+1;
  // 到达BOSS/出口
  if(newPos>=routeData.length){
    // 触发BOSS/出口
    this.g6TriggerBoss(team);
    return;
  }
  tp.pos=newPos;
  const cell=routeData[newPos];
  const cellType=G6_CELL_TYPES[cell.type];
  state.message=(team==='red'?'红队':'蓝队')+'前进到'+(tp.route==='top'?'上路':'下路')+newPos+'格（'+cellType.icon+cellType.name+'）';
  this.g6TriggerCell(team,tp.route,newPos,cell);
};

// 触发格子效果
window.G.g6TriggerCell=function(team,route,pos,cell){
  const g=state.game;
  const members=Object.values(state.players).filter(p=>p.team===team&&!p.dead&&p.id!==state.hostId);
  const cellKey=route+'-'+pos;
  // 如果没有传入cell，自动获取
  if(!cell){
    const floorData=g.floor===1?G6_FLOOR1:G6_FLOOR2;
    const routeData=route==='top'?floorData.top:floorData.bottom;
    cell=routeData[pos];
  }
  switch(cell.type){
    case 'start':
      // 雕像格=商店
      g.shop={cellKey, team, bought:{}, done:{}};
      state.message+=' | 🏛️ 雕像商店！购买装备/技能/血量';
      broadcastState();this.renderG6();
      break;
    case 'spring':
      members.forEach(p=>{p.hp=Math.min(9,(p.hp||0)+(g.floor===1?2:3))});
      g.lastEffect={type:'heal',text:(team==='red'?'红队':'蓝队')+'每人+'+(g.floor===1?2:3)+'血',sub:'💧泉水'};
      state.message+=' | 泉水回复'+(g.floor===1?2:3)+'血';
      this.g6NextTurn();
      break;
    case 'chest':
      // 宝箱：每人获得一件装备，玩家任选一件（必须是面板上能装备的）
      g.chestSelect={cellKey, team, chosen:{}};
      g.phase='chest';
      state.message+=' | 📦 宝箱！请每人选择一件装备';
      // 检查是否所有存活玩家都已选择
      this.g6CheckChestDone();
      break;
    case 'clover':
      if(!g.cloverUsed.includes(g.floor+'-'+cellKey)){
        g.cloverUsed.push(g.floor+'-'+cellKey);
        // 随机选择小队中一个存活玩家的角色事件（小队三人一起触发）
        const aliveMembers=Object.entries(state.players).filter(([pid,p])=>p.team===team&&!p.dead&&G6_CLOVER_EVENTS[p.character]);
        if(aliveMembers.length>0){
          const randomEntry=aliveMembers[Math.floor(Math.random()*aliveMembers.length)];
          const randomPlayerId=randomEntry[0];
          const randomPlayer=randomEntry[1];
          const event=G6_CLOVER_EVENTS[randomPlayer.character];
          g.cloverEvent={...event,playerId:randomPlayerId,cellKey,team,resolved:false,teamEvent:true};
          g.phase='clover';
          state.message+=' | 🍀 三叶草事件！'+(team==='red'?'红队':'蓝队')+'三人一起表演，等待主持人判定';
          g.lastEffect={type:'clover',text:(team==='red'?'红队':'蓝队')+'触发三叶草事件！',sub:'🍀'+event.name};
          broadcastState();this.renderG6();
          return;
        }
      }else{
        state.message+=' | 三叶草事件已触发过';
      }
      this.g6NextTurn();
      break;
    case 'monster':
      if(g.monstersDefeated[team].includes(cellKey)){
        state.message+=' | 怪兽已被击败，可通过';
        this.g6NextTurn();
      }else{
        g.phase='combat';
        // 随机选择怪物
        const monsterKeys=Object.keys(G6_MONSTERS).filter(k=>!G6_MONSTERS[k].isDragon);
        const monsterKey=monsterKeys[Math.floor(Math.random()*monsterKeys.length)];
        const monster={...G6_MONSTERS[monsterKey]};
        // 映射ruleType到effect（战斗代码检查effect字段）
        const ruleTypeMap={noRedSkill:'noRedSkill',noCounter:'noCounter',missGold:'loseGold',ring1Miss:'ring1Miss',missHeal:'monsterHeal',missTeamDmg:'teamCounter'};
        if(monster.ruleType&&ruleTypeMap[monster.ruleType])monster.effect=ruleTypeMap[monster.ruleType];
        // 存储怪物到格子，供大回合结束主动攻击使用
        if(!g.cellMonsters)g.cellMonsters={};
        if(!g.cellMonsters[team])g.cellMonsters[team]={};
        g.cellMonsters[team][cellKey]=monster;
        // 当前回合玩家作为攻击者
        const current=this.g6GetCurrentPlayer();
        const attackerId=current?current.peerId:null;
        const attacker=current?current.player:null;
        g.combat={
          monster:monster,
          monsterHp:monster.hp,
          cellKey:cellKey,
          team:team,
          attacker:attackerId||null,
          attackerIndex:0,
          rolling:false,
          resolved:false,
          ring:0,
          dice:0,
          pointer:0,
          crit:false,
          round:1,
          log:[],
          locked:false,
          skillUsed:false
        };
        state.message+=' | ⚔️ 遭遇'+monster.name+'！'+(attacker?attacker.name+'（'+(attacker.position||'?')+'号位）':'')+'投骰攻击';
        g.lastEffect={type:'combat',text:'遭遇'+monster.name+'！',sub:'💀怪兽格'};
        broadcastState();this.renderG6();
      }
      break;
    default:
      this.g6NextTurn();
  }
  broadcastState();this.renderG6();
};

// 触发BOSS/出口
window.G.g6TriggerBoss=function(team){
  const g=state.game;
  const floorData=g.floor===1?G6_FLOOR1:G6_FLOOR2;
  if(floorData.boss.type==='exit'){
    this.g6EndGame(team);return;
  }
  const bossKey=g.floor===1?'dragonEgg':'redDragon';
  const cellKey='boss-'+g.floor;
  // 初始化全局共享BOSS血量
  if(g.bossHp===undefined||g.bossHp===null){
    g.bossHp=G6_MONSTERS[bossKey].hp;
    g.bossMaxHp=G6_MONSTERS[bossKey].hp;
    g.bossMonster={...G6_MONSTERS[bossKey],isBoss:true};
    if(g.bossMonster.ruleType){
      const ruleTypeMap={noRedSkill:'noRedSkill',noCounter:'noCounter',missGold:'loseGold',ring1Miss:'ring1Miss',missHeal:'monsterHeal',missTeamDmg:'teamCounter'};
      if(ruleTypeMap[g.bossMonster.ruleType])g.bossMonster.effect=ruleTypeMap[g.bossMonster.ruleType];
    }
  }
  // BOSS已被击杀
  if(g.bossHp<=0){
    if(g.floor===1){
      if(!g.firstFloorDone){g.firstFloorDone=team;g.secondPickTeam=team;}
      g.floor=2;
      g.teamPos={red:{route:null,pos:0},blue:{route:null,pos:0}};
      g.bossHp=null;g.bossMaxHp=null;g.bossMonster=null;
      g.cellMonsters={};g.monstersDefeated={red:[],blue:[]};
      Object.values(state.players).forEach(p=>{p.floor=2});
      g.phase='shop';
      g.shop={cellKey:'start2',team:g.secondPickTeam||'red',bought:{},done:{},isStart:true};
      state.message='🎉 第一层龙被击败！所有怪物消失，传送到二楼雕像商店！';
      g.lastEffect={type:'dragon',text:'🐉 第一层通关！传送二楼',sub:'二楼商店开启'};
      broadcastState();this.renderG6();
      return;
    }else{
      g.combat=null;
      state.message='🎉🎉 最终龙BOSS击败！游戏结束！';
      g.lastEffect={type:'dragon',text:'🐉 最终龙BOSS击败！',sub:'游戏胜利'};
      broadcastState();this.renderG6();
      setTimeout(()=>this.g6EndGame(team),2000);
      return;
    }
  }
  // 挑战BOSS
  g.phase='combat';
  const curPlayer=G.g6GetCurrentPlayer();
  let attackerId=curPlayer&&curPlayer.player.team===team?curPlayer.peerId:null;
  if(!attackerId){
    const teamEntries=Object.entries(state.players).filter(([pid,p])=>p.team===team&&!p.dead&&pid!==state.hostId);
    attackerId=teamEntries.length>0?teamEntries[0][0]:null;
  }
  g.combat={
    monster:g.bossMonster,monsterHp:g.bossHp,cellKey,team,
    attacker:attackerId,attackerIndex:0,rolling:false,resolved:false,
    ring:0,dice:0,pointer:0,crit:false,round:1,log:[],locked:false,isBoss:true,skillUsed:false
  };
  state.message=(team==='red'?'红队':'蓝队')+'挑战🐉'+g.bossMonster.name+'（剩余'+g.bossHp+'/'+g.bossMaxHp+'血）！';
  g.lastEffect={type:'dragon',text:'🐉 '+g.bossMonster.name+'（'+g.bossHp+'/'+g.bossMaxHp+'）',sub:g.floor===1?'第一层守关BOSS':'最终BOSS'};
  broadcastState();this.renderG6();
};

// 战斗结算（玩家确认后）
window.G.g6ResolveCombat=function(peerId,action){
  const g=state.game;const c=g.combat;
  if(!c||c.resolved)return;
  const attacker=state.players[peerId];
  if(!attacker||c.attacker!==peerId)return;
  if(!c.locked){state.message='请先投骰锁定';broadcastState();this.renderG6();return}
  
  c.resolved=true;
  const isEven=c.dice%2===0;
  const monster=c.monster;
  
  let log=[];
  const dcName={red:'红',blue:'蓝',green:'绿'}[c.diceColor]||'';
  log.push(attacker.name+' 投出'+dcName+'骰'+c.dice+'点 '+(isEven?'(双数)':'(单数)'));
  
  // 处理损人道具debuff
  let debuffNoWeapon=false,debuffNoWeaponBonus=false,debuffRingReduce=0;
  if(attacker.debuffs&&attacker.debuffs.length>0){
    attacker.debuffs.forEach(d=>{
      if(d.effect==='ringReduce'){debuffRingReduce=Math.max(debuffRingReduce,d.value||2);log.push('💀 黑胡椒炸弹：命中环数-'+(d.value||2))}
      if(d.effect==='noWeapon'){debuffNoWeapon=true;log.push('💀 传说中的酒：无法使用武器')}
      if(d.effect==='noWeaponBonus'){debuffNoWeaponBonus=true;log.push('💀 友情催化药水：无法使用武器加成')}
    });
    attacker.debuffs=[]; // 消耗debuff
  }
  if(debuffRingReduce>0&&c.ring>0){
    c.ring=Math.max(0,c.ring-debuffRingReduce);
    log.push('环数降低为'+c.ring+'环');
  }
  
  // 计算伤害
  let damage=0;
  // 幼龙效果：1环视为攻击失败（脱靶）
  if(monster.effect==='ring1Miss'&&c.ring===1){
    c.ring=0;
    log.push('🐲 幼龙效果：1环区域视为攻击失败！');
  }
  if(c.ring>0){
    // 技能效果：弱点标记（3环→4环，4环→5环）
    if(c.ringUpgrade){
      if(c.ring===3){c.ring=4;log.push('弱点标记：3环→4环')}
      else if(c.ring===4){c.ring=5;log.push('弱点标记：4环→5环')}
      // 检查暴击
      if(c.ring===5&&isEven&&!monster.isDragon){c.crit=true;log.push('弱点标记触发暴击！')}
    }
    // 武器加成：从装备中获取主武器加成
    const mainWeapon=debuffNoWeapon?null:attacker.equipment?.find(e=>e.slot==='主武器');
    const weaponBonus=(debuffNoWeapon||debuffNoWeaponBonus)?0:(mainWeapon?.bonus||0);
    // 副武器加成
    const secondaryWeapon=debuffNoWeapon?null:attacker.equipment?.find(e=>e.slot==='副武器');
    const secondaryBonus=(debuffNoWeapon||debuffNoWeaponBonus)?0:(secondaryWeapon?.bonus||0);
    // 专属武器加成
    const exclusiveWeapon=debuffNoWeapon?null:attacker.equipment?.find(e=>e.slot==='专属武器');
    const exclusiveBonus=(debuffNoWeapon||debuffNoWeaponBonus)?0:(exclusiveWeapon?.bonus||0);
    // 空酒瓶宝物：进攻前额外造成1点伤害
    const hasEmptyBottle=attacker.treasures?.some(t=>t.effect==='extraDamage');
    const bottleBonus=hasEmptyBottle?1:0;
    // 技能效果：自然之力（伤害+2）
    const allyBonus=c.allyDamageUp||0;
    // 技能效果：战斗诗歌（伤害加成）
    const songBonus=c.damageBoost||0;
    damage=c.ring+weaponBonus+secondaryBonus+exclusiveBonus+bottleBonus+allyBonus+songBonus;
    log.push('命中 '+c.ring+'环'+(weaponBonus>0?'，主武器+'+weaponBonus:'')+(secondaryBonus>0?'，副武器+'+secondaryBonus:'')+(exclusiveBonus>0?'，专属武器+'+exclusiveBonus:'')+(bottleBonus>0?'，空酒瓶+'+bottleBonus:'')+(allyBonus>0?'，自然之力+'+allyBonus:'')+(songBonus>0?'，战斗诗歌+'+songBonus:'')+'，伤害='+damage);
    
    // 暴击：5环+双数=一击毙命（非龙族）
    if(c.crit){
      damage=999;
      log.push('💥 暴击！一击毙命！');
      g.lastEffect={type:'crit',text:attacker.name+' 暴击一击毙命！',sub:'💥暴击'};
    }
    
    // 技能效果：魔法药水（放弃上靶伤害）
    if(c.giveUpDamage){
      damage=0;
      log.push('魔法药水：放弃上靶伤害，换取道具');
    }
    
    // 技能效果：虚弱（怪物受伤+1）
    if(c.monsterDefDown&&damage>0){
      damage+=1;
      log.push('虚弱：怪物受伤+1');
    }
    
    c.monsterHp=Math.max(0,c.monsterHp-damage);
    log.push(monster.name+' 剩余 '+c.monsterHp+' 血');
    
    // 角色技能：群体治疗（上靶伤害转为全体回血）
    if(c.groupHealPending&&damage>0){
      const healAmount=Math.min(damage,2);
      const teamMembers=Object.values(state.players).filter(p=>p.team===attacker.team&&!p.dead&&p.id!==state.hostId);
      teamMembers.forEach(p=>{p.hp=Math.min(9,(p.hp||0)+healAmount)});
      log.push('💚 群体治疗：全体友方回复'+healAmount+'血');
      g.lastEffect={type:'heal',text:'群体治疗！全体+'+healAmount+'血',sub:'💚群体治疗'};
      c.groupHealPending=false;
    }
    
    // 角色技能：惩戒（造成伤害后自回2血）
    if(c.smitePending&&damage>0){
      attacker.hp=Math.min(9,(attacker.hp||0)+2);
      log.push('⚡ 惩戒：'+attacker.name+'回复2血');
      g.lastEffect={type:'heal',text:attacker.name+' 惩戒回复2血',sub:'⚡惩戒'};
      c.smitePending=false;
    }
    
    // 角色技能：植物精华（放弃伤害，回友方3血）
    if(c.plantHealPending){
      const teamMembers=Object.values(state.players).filter(p=>p.team===attacker.team&&!p.dead&&p.id!==state.hostId);
      // 选择血量最低的友方回复
      const target=teamMembers.sort((a,b)=>(a.hp||0)-(b.hp||0))[0];
      if(target){
        target.hp=Math.min(9,(target.hp||0)+3);
        log.push('🌱 植物精华：'+target.name+'回复3血');
        g.lastEffect={type:'heal',text:target.name+' 植物精华回复3血',sub:'🌱植物精华'};
      }
      c.plantHealPending=false;
    }
    
    // 技能效果：祈祷（上靶后额外2伤害+1金币）
    if(c.prayerBonus&&damage>0){
      c.monsterHp=Math.max(0,c.monsterHp-2);
      attacker.gold=(attacker.gold||0)+1;
      log.push('祈祷：额外2伤害+1金币，'+monster.name+'剩余'+c.monsterHp+'血');
    }
  }else{
    log.push('脱靶！未命中');
    // 怪物特殊效果：龙蛋脱靶无反击
    if(monster.effect==='noCounter'){
      log.push(monster.name+'效果：脱靶不反击！');
      g.lastEffect={type:'info',text:attacker.name+' 脱靶，'+monster.name+'不反击',sub:'🥚龙蛋'};
    }else if(c.skipMonsterAction){
      // 技能效果：催眠曲（跳过怪物反击）
      log.push('催眠曲：怪物反击被跳过！');
      g.lastEffect={type:'info',text:attacker.name+' 脱靶，催眠曲跳过反击',sub:'🎵催眠曲'};
      c.skipMonsterAction=false;
    }else{
      // 未上靶受怪物反击
      let counterDmg=monster.atk;
      // 护盾效果
      const shield=attacker.equipment?.find(e=>e.slot==='护盾');
      let shieldLog=[];
      if(shield){
        if(shield.effect==='reduceCounterDmg'){ // 钢背心：反击伤害-2
          counterDmg=Math.max(1,counterDmg-shield.value);
          shieldLog.push(shield.name+'-'+shield.value);
        }
        if(shield.effect==='reduceAllDmg'){ // 锁子甲：所有伤害-1（最低1）
          counterDmg=Math.max(1,counterDmg-shield.value);
          shieldLog.push(shield.name+'-'+shield.value);
        }
        if(shield.effect==='reduceMonsterDmg'){ // 硬皮甲：怪物攻击伤害-1
          counterDmg=Math.max(1,counterDmg-shield.value);
          shieldLog.push(shield.name+'-'+shield.value);
        }
      }
      attacker.hp=(attacker.hp||0)-counterDmg;
      log.push(monster.name+' 反击！'+attacker.name+' -'+counterDmg+'血'+(shieldLog.length>0?'（'+shieldLog.join('+')+'）':''));
      // 荆棘甲：受到伤害后对怪物造成1点反伤
      if(shield&&shield.effect==='reflectDmg'&&counterDmg>0){
        c.monsterHp=Math.max(0,c.monsterHp-shield.value);
        log.push('🌵 '+shield.name+'反伤！'+monster.name+' -'+shield.value+'血');
      }
      this.g6CheckDeath(attacker);
      g.lastEffect={type:'damage',text:attacker.name+' 脱靶被反击 -'+counterDmg+'血'+(shieldLog.length>0?'（护盾减伤）':''),sub:'❌脱靶'};
      
      // 怪物特殊效果：火爆犀牛王脱靶全队反击
      if(monster.effect==='teamCounter'){
        const teamMembers=Object.entries(state.players).filter(([pid,p])=>p.team===attacker.team&&!p.dead&&pid!==c.attacker).map(([pid,p])=>p);
        teamMembers.forEach(p=>{
          let teamDmg=monster.atk;
          const teamShield=p.equipment?.find(e=>e.slot==='护盾');
          if(teamShield&&(teamShield.effect==='reduceCounterDmg'||teamShield.effect==='reduceAllDmg'||teamShield.effect==='reduceMonsterDmg')){
            teamDmg=Math.max(1,teamDmg-teamShield.value);
          }
          p.hp=(p.hp||0)-teamDmg;
          log.push(monster.name+' 全队反击！'+p.name+' -'+teamDmg+'血');
          this.g6CheckDeath(p);
        });
        g.lastEffect={type:'damage',text:monster.name+' 全队反击！',sub:'🦏火爆犀牛王'};
      }
    }
    
    // 怪物特殊效果：贪财哥布林脱靶扣金币
    if(monster.effect==='loseGold'){
      if((attacker.gold||0)>=1){
        attacker.gold--;
        log.push(monster.name+'效果：损失1金币');
      }else{
        attacker.hp=(attacker.hp||0)-1;
        log.push(monster.name+'效果：没金币，额外-1血');
        this.g6CheckDeath(attacker);
      }
    }
    
    // 怪物特殊效果：火焰核心脱靶怪物回血
    if(monster.effect==='monsterHeal'){
      c.monsterHp=Math.min(monster.hp,c.monsterHp+1);
      log.push(monster.name+'效果：回复1点血量');
    }
  }
  
  c.log=log;
  
  // 技能效果：顺势斩（上靶后二次攻击）
  if(c.secondAttack&&c.ring>0&&c.monsterHp>0&&!c.secondAttackUsed){
    c.secondAttackUsed=true;
    c.resolved=false;
    c.rolling=false;
    c.ring=0;
    c.dice=0;
    c.pointer=0;
    c.crit=false;
    c.skillUsed=false; // 二次攻击可再用技能
    log.push('⚔️ 顺势斩：可进行二次攻击！');
    c.log=log;
    state.message=attacker.name+' 顺势斩！二次攻击';
    broadcastState();this.renderG6();
    return;
  }
  
  // 技能效果：无赖（脱靶后重投）
  if(c.rerollAvailable&&c.ring===0&&!c.rerollUsed){
    c.rerollUsed=true;
    c.resolved=false;
    c.rolling=false;
    c.ring=0;
    c.dice=0;
    c.pointer=0;
    c.crit=false;
    c.skillUsed=false; // 重投可再用技能
    log.push('🎲 无赖：可重投一次！');
    c.log=log;
    state.message=attacker.name+' 无赖！重投骰子';
    broadcastState();this.renderG6();
    return;
  }
  
  // 检查怪物是否死亡
  if(c.monsterHp<=0){
    log.push('🎉 '+monster.name+' 被击败！');
    // 给金币
    const team=c.team;
    const members=Object.values(state.players).filter(p=>p.team===team&&!p.dead&&p.id!==state.hostId);
    const goldPer=Math.ceil(monster.gold/members.length);
    members.forEach(p=>{p.gold=(p.gold||0)+goldPer});
    log.push('每人 +'+goldPer+' 金币');
    g.monstersDefeated[team].push(c.cellKey);
    g.lastEffect={type:'gold',text:'击败'+monster.name+'！每人+'+goldPer+'金',sub:'🏆胜利'};
    
    // 角色技能：驯服（击杀后获得一次性伤害道具）
    if(c.tamePending&&!monster.isDragon){
      const tameItem={name:'驯服的'+monster.name,icon:monster.icon,slot:'道具',type:'self',desc:'一次性伤害道具，造成'+monster.atk+'点伤害',effect:'directDamage',value:monster.atk,id:'tame_'+Date.now()};
      if(!attacker.equipment)attacker.equipment=[];
      const hasItemSlot=attacker.equipment.some(e=>e.slot==='道具');
      if(!hasItemSlot){
        attacker.equipment.push(tameItem);
        log.push('🐾 驯服：获得'+tameItem.name+'（伤害'+monster.atk+'）');
        g.lastEffect={type:'item',text:attacker.name+' 驯服了'+monster.name+'！',sub:'🐾驯服'};
      }else{
        log.push('🐾 驯服：道具槽已满，无法获得');
      }
      c.tamePending=false;
    }
    
    // BOSS处理：更新公共血量
    if(c.isBoss||monster.isDragon){
      g.bossHp=c.monsterHp;
      if(g.bossHp<=0){
        // BOSS被击杀，触发g6TriggerBoss处理传送
        g.combat=null;
        broadcastState();this.renderG6();
        this.g6TriggerBoss(c.team);
        return;
      }else{
        // BOSS未死，当前玩家行动结束
        state.message='🐉 '+monster.name+' 剩余'+g.bossHp+'/'+g.bossMaxHp+'血';
        g.combat=null;
        this.g6NextTurn();
      }
      c.log=log;
      broadcastState();this.renderG6();
      return;
    }else{
      g.phase='moving';
      state.message=(c.team==='red'?'红队':'蓝队')+'击败'+monster.name+'！继续前进';
      g.itemDrop={team:c.team,chooseType:true,assigned:null};
      g.phase='itemDrop';
      state.message+=' | 🎁 怪物掉落道具！请选择【利己】或【损人】道具';
      log.push('道具掉落：可选择利己或损人道具');
    }
    g.combat=null;
    this.g6NextTurn();
  }else{
    // 怪物未死，保存剩余血量供队友继续战斗
    if(!c.isBoss&&g.cellMonsters&&g.cellMonsters[c.team]&&g.cellMonsters[c.team][c.cellKey]){
      g.cellMonsters[c.team][c.cellKey].hp=c.monsterHp;
    }
    g.combat=null;
    this.g6NextTurn();
  }
  
  c.log=log;
  broadcastState();this.renderG6();
};

// 简化版自动战斗（BOSS用）
window.G.g6AutoCombat=function(team,cellKey,isDragon){
  const g=state.game;
  const members=Object.values(state.players).filter(p=>p.team===team&&!p.dead&&p.id!==state.hostId);
  const dmg=isDragon?3:2;
  members.forEach(p=>{
    p.hp=(p.hp||0)-dmg;
    this.g6CheckDeath(p);
  });
  g.monstersDefeated[team].push(cellKey);
  const gold=isDragon?10:3;
  members.forEach(p=>{p.gold=(p.gold||0)+Math.ceil(gold/members.length)});
  g.lastEffect={type:'damage',text:'战斗胜利！每人-'+dmg+'血 +'+Math.ceil(gold/members.length)+'金',sub:isDragon?'🐉龙BOSS击败':'💀怪兽击败'};
  state.message=(team==='red'?'红队':'蓝队')+'击败'+(isDragon?'龙BOSS':'怪兽')+'！每人-'+dmg+'血+'+Math.ceil(gold/members.length)+'金';
  if(isDragon){
    g.bossDefeated=true;
    if(g.floor===1){
      g.floor=2;
      g.teamPos={red:{route:null,pos:0},blue:{route:null,pos:0}};
      g.phase='routeselect';
      g.bossDefeated=false;
      Object.values(state.players).forEach(p=>{p.floor=2});
      state.message+=' | 🎉 第一层通关！传送到第二层起点，请重新选择路线';
      g.lastEffect={type:'dragon',text:'🐉 第一层龙击败！进入第二层！',sub:'第一层通关'};
    }else{
      // 第二层龙击败，游戏结束
      state.message+=' | 🎉🎉 最终龙BOSS击败！游戏结束！';
      g.lastEffect={type:'dragon',text:'🐉 最终龙BOSS击败！',sub:'游戏胜利'};
      broadcastState();this.renderG6();
      setTimeout(()=>this.g6EndGame(team),2000);
      return;
    }
  }
  g.phase=g.phase==='routeselect'?'routeselect':'moving';
  this.g6NextTurn();
};

// 商店购买
window.G.g6ShopBuy=function(peerId,buyType,itemId){
  const g=state.game;
  if(!g.shop)return;
  const player=state.players[peerId];
  if(!player||player.dead)return;
  if(g.shop.done[peerId])return; // 已完成购买
  const boughtCount=g.shop.bought[peerId]||0;
  // 检查装备总数（最多5件，不含宝物）
  const equipCount=player.equipment?.length||0;
  
  if(buyType==='hp'){
    // 购买血量：1金币回1血，不可超上限
    if(player.gold<1){state.message=player.name+'金币不足';broadcastState();this.renderG6();return;}
    if(player.hp>=9){state.message=player.name+'血量已满';broadcastState();this.renderG6();return;}
    player.gold-=1;
    player.hp=Math.min(9,player.hp+1);
    state.message=player.name+' 购买血量 +1';
  }else if(buyType==='skill'){
    // 购买技能：4金币，每人最多另购2个
    if(player.gold<4){state.message=player.name+'金币不足';broadcastState();this.renderG6();return;}
    const extraSkills=(player.skills?.length||0)-2; // 自带2个
    if(extraSkills>=2){state.message=player.name+'技能已满（最多另购2个）';broadcastState();this.renderG6();return;}
    player.gold-=4;
    if(!player.skills)player.skills=[];
    // 从G6商店技能池中获取对应角色的未拥有技能
    const charShopSkills=G6_SHOP_SKILLS[player.character]||[];
    const ownedSkillIds=player.skills.map(s=>s.id.replace(/^bought_/,'').replace(/_\d+$/,''));
    const availableSkills=charShopSkills.filter(s=>!ownedSkillIds.includes(s.id));
    if(availableSkills.length>0){
      const newSkill=availableSkills[Math.floor(Math.random()*availableSkills.length)];
      player.skills.push({...newSkill,id:'bought_'+newSkill.id+'_'+Date.now(),used:false,isShopSkill:true});
      state.message=player.name+' 购买技能：'+newSkill.name;
    }else{
      state.message=player.name+'已拥有所有商店技能';
      player.gold+=4; // 退款
    }
  }else{
    // 购买装备：3金币/件，每人每雕像格最多3件
    if(boughtCount>=3){state.message=player.name+'本雕像格已购3件装备';broadcastState();this.renderG6();return;}
    if(player.gold<3){state.message=player.name+'金币不足';broadcastState();this.renderG6();return;}
    if(equipCount>=5){state.message=player.name+'装备已满（5件）';broadcastState();this.renderG6();return;}
    // 获取装备数据
    let item=null;
    let isDiscarded=false;
    let discardedIdx=-1;
    if(buyType==='mainWeapon')item={...G6_MAIN_WEAPONS[itemId],id:itemId};
    else if(buyType==='secondaryWeapon')item={...G6_SECONDARY_WEAPONS[itemId],id:itemId};
    else if(buyType==='shield')item={...G6_SHIELDS[itemId],id:itemId};
    else if(buyType==='treasure')item={...G6_TREASURES[itemId],id:itemId};
    else if(buyType==='item'){
      item=G6_ITEMS_SELF[itemId]?{...G6_ITEMS_SELF[itemId],id:itemId}:G6_ITEMS_ENEMY[itemId]?{...G6_ITEMS_ENEMY[itemId],id:itemId}:null;
    }
    // 检查是否是弃置堆中的装备
    if(itemId&&itemId.startsWith('discarded_')){
      const idx=parseInt(itemId.replace('discarded_',''));
      if(g.discardedEquip&&g.discardedEquip[idx]){
        item={...g.discardedEquip[idx]};
        isDiscarded=true;
        discardedIdx=idx;
      }
    }
    if(!item)return;
    // 检查是否有对应槽位
    const charConfig=G6_CHAR_SKILLS[player.character];
    if(!charConfig?.equip?.includes(item.slot)){state.message=player.name+'没有'+item.slot+'槽位';broadcastState();this.renderG6();return;}
    // 宝物槽位检查（最多3件）
    if(item.slot==='宝物'&&(player.treasures?.length||0)>=3){state.message=player.name+'宝物已满';broadcastState();this.renderG6();return;}
    // 道具最多1个
    if(item.slot==='道具'&&(player.equipment?.filter(e=>e.slot==='道具').length||0)>=1){state.message=player.name+'已有道具，商店最多购买1个';broadcastState();this.renderG6();return;}
    // 购买
    player.gold-=3;
    if(!player.equipment)player.equipment=[];
    if(!player.backpack)player.backpack=[];
    let oldEquip=null;
    let toBackpack=false;
    if(item.slot==='宝物'){
      if(!player.treasures)player.treasures=[];
      player.treasures.push(item);
    }else if(item.slot==='道具'){
      // 商店道具最多1个，直接装备
      player.equipment.push(item);
    }else{
      // 武器/副武器/护盾只能装备一件，旧装备放入背包
      oldEquip=player.equipment.find(e=>e.slot===item.slot);
      if(oldEquip&&!oldEquip.exclusive){
        if(player.backpack.length<2){
          player.backpack.push({...oldEquip});
          toBackpack=true;
        }else{
          if(!g.discardedEquip)g.discardedEquip=[];
          g.discardedEquip.push({...oldEquip,type:buyType});
        }
      }
      player.equipment=player.equipment.filter(e=>e.slot!==item.slot);
      player.equipment.push(item);
    }
    // 如果是弃置堆中的装备，从弃置堆中移除
    if(isDiscarded&&discardedIdx>=0){
      g.discardedEquip.splice(discardedIdx,1);
    }
    g.shop.bought[peerId]=boughtCount+1;
    state.message=player.name+' 购买 '+item.name+(oldEquip?'（替换'+oldEquip.name+(toBackpack?'，旧装备放入背包':'，旧装备被回收')+'）':'');
  }
  broadcastState();this.renderG6();
};

// 商店完成
window.G.g6ShopDone=function(peerId){
  const g=state.game;
  if(!g.shop)return;
  g.shop.done[peerId]=true;
  // 检查是否当前队伍所有存活玩家都完成
  const members=Object.entries(state.players).filter(([pid,p])=>p.team===g.shop.team&&!p.dead&&pid!==state.hostId);
  const allDone=members.every(([pid])=>g.shop.done[pid]);
  if(allDone){
    // 雕像区起点商店：第一队买完后切换到第二队
    if(g.shop.isStart){
      const firstTeam=g.shop.cellKey==='start2'?(g.secondPickTeam||'red'):(g.firstPickTeam||'red');
      const secondTeam=firstTeam==='red'?'blue':'red';
      if(g.shop.team===firstTeam){
        // 切换到第二队
        g.shop={cellKey:g.shop.cellKey, team:secondTeam, bought:{}, done:{}, isStart:true};
        state.message=(secondTeam==='red'?'红队':'蓝队')+'在雕像区购买装备';
        broadcastState();this.renderG6();
        return;
      }
      // 第二队也买完了
      const isFloor2Shop=g.shop.cellKey==='start2';
      g.shop=null;
      if(isFloor2Shop||g.floor===2){
        // 二楼商店完成后进入路线选择
        g.phase='routeselect';
        g.teamPos={red:{route:null,pos:0},blue:{route:null,pos:0}};
        state.message='二楼雕像区购买完成，请选择路线（'+(g.secondPickTeam==='red'?'红队':'蓝队')+'优先）';
      }else{
        // 一楼商店完成后开始移动
        g.turnIndex=0;
        g.currentTeam=firstTeam;
        g.round=1;
        g.phase='moving';
        G.g6CheckTurnAction();
        state.message='雕像区购买完成，开始探索！'+(firstTeam==='red'?'红队':'蓝队')+'先手';
      }
      g.lastEffect={type:'gold',text:'雕像区商店',sub:'🏛️购买完成'};
      broadcastState();this.renderG6();
      return;
    }
    g.lastEffect={type:'gold',text:(g.shop.team==='red'?'红队':'蓝队')+'商店购买完成',sub:'🏛️商店'};
    g.shop=null;
    this.g6NextTurn();
  }else{
    state.message=state.players[peerId].name+' 完成购买，等待其他玩家';
    broadcastState();this.renderG6();
  }
};

// 选择掉落道具类型（利己/损人）
window.G.g6ChooseItemType=function(peerId,itemType){
  const g=state.game;
  if(!g.itemDrop||!g.itemDrop.chooseType)return;
  const player=state.players[peerId];
  if(!player||player.team!==g.itemDrop.team)return;
  // 随机选择一个该类型的道具
  const pool=itemType==='self'?G6_ITEMS_SELF:G6_ITEMS_ENEMY;
  const keys=Object.keys(pool);
  const itemKey=keys[Math.floor(Math.random()*keys.length)];
  const item={...pool[itemKey],id:itemKey};
  g.itemDrop={item,team:g.itemDrop.team,assigned:null};
  g.phase='itemDrop';
  state.message=(g.itemDrop.team==='red'?'红队':'蓝队')+'选择了'+(itemType==='self'?'【利己】':'【损人】')+'道具：'+item.name+'（请分配给队员）';
  broadcastState();this.renderG6();
};

// 道具分配给队员
window.G.g6AssignItem=function(peerId,targetId){
  const g=state.game;
  if(!g.itemDrop)return;
  const target=state.players[targetId];
  if(!target||target.dead||target.team!==g.itemDrop.team)return;
  if(!target.equipment)target.equipment=[];
  if(!target.backpack)target.backpack=[];
  const item=g.itemDrop.item;
  // 如果已有道具，新道具放入背包
  const existingItem=target.equipment.find(e=>e.slot==='道具');
  if(existingItem){
    if(target.backpack.length<2){
      target.backpack.push({...item});
      state.message=target.name+' 获得道具：'+item.name+'（背包）';
    }else{
      // 背包满了，直接装备（替换旧道具，旧道具进弃置堆）
      if(!g.discardedEquip)g.discardedEquip=[];
      g.discardedEquip.push({...existingItem});
      target.equipment=target.equipment.filter(e=>e.slot!=='道具');
      target.equipment.push({...item});
      state.message=target.name+' 获得道具：'+item.name+'（背包已满，旧道具回收）';
    }
  }else{
    target.equipment.push({...item});
    state.message=target.name+' 获得道具：'+item.name;
  }
  g.itemDrop.assigned=targetId;
  g.lastEffect={type:'item',text:target.name+'获得'+item.name,sub:'🎁道具'};
  g.itemDrop=null;
  g.phase='moving';
  broadcastState();this.renderG6();
  this.g6NextTurn();
};

// 道具使用提示（选择目标）
// 从背包装备物品
window.G.g6EquipFromBackpack=function(playerId,backpackIndex){
  if(!isHost){sendAction({type:'g6equipbackpack',playerId:playerId,backpackIndex:backpackIndex});return;}
  const g=state.game;
  const player=state.players[playerId];
  if(!player||player.dead||!player.backpack||!player.backpack[backpackIndex])return;
  const item=player.backpack[backpackIndex];
  const charConfig=G6_CHAR_SKILLS[player.character];
  if(item.slot==='宝物'){
    // 宝物：替换当前宝物
    if(!player.treasures)player.treasures=[];
    const oldTreasure=player.treasures[0];
    player.treasures[0]={...item};
    if(oldTreasure){player.backpack[backpackIndex]={...oldTreasure};}
    else{player.backpack.splice(backpackIndex,1);}
    state.message=player.name+' 从背包装备了 '+item.name;
  }else if(item.slot==='道具'){
    // 道具：替换当前道具
    if(!player.equipment)player.equipment=[];
    const oldItem=player.equipment.find(e=>e.slot==='道具');
    if(oldItem){player.backpack[backpackIndex]={...oldItem};}
    else{player.backpack.splice(backpackIndex,1);}
    player.equipment=player.equipment.filter(e=>e.slot!=='道具');
    player.equipment.push({...item});
    state.message=player.name+' 从背包装备了 '+item.name;
  }else{
    if(!charConfig?.equip?.includes(item.slot)){state.message=player.name+'没有'+item.slot+'槽位';broadcastState();this.renderG6();return;}
    const oldEquip=player.equipment.find(e=>e.slot===item.slot);
    if(oldEquip&&!oldEquip.exclusive){
      player.backpack[backpackIndex]={...oldEquip};
    }else{
      player.backpack.splice(backpackIndex,1);
    }
    player.equipment=player.equipment.filter(e=>e.slot!==item.slot);
    player.equipment.push({...item});
    state.message=player.name+' 从背包装备了 '+item.name;
  }
  broadcastState();this.renderG6();
};

window.G.g6PromptUseItem=function(playerId,itemId){
  const player=state.players[playerId];
  if(!player||player.dead)return;
  let item=null;
  if(itemId){
    item=player.equipment?.find(e=>e.id===itemId&&e.slot==='道具');
  }else{
    item=player.equipment?.find(e=>e.slot==='道具');
  }
  if(!item)return;
  
  // 判断是否需要目标
  const needTarget=['healAlly','healBoth','noWeaponBonus','noWeapon','silence','ringReduce'].includes(item.effect);
  
  if(!needTarget){
    // 不需要目标，直接使用
    this.g6UseItem(playerId,null);
  }else{
    // 需要目标，显示选择界面
    state.game.itemTargetSelect={playerId,item,needAlly:['healAlly','healBoth'].includes(item.effect)};
    state.message='请选择'+item.name+'的目标';
    broadcastState();this.renderG6();
  }
};

window.G.g6CancelItemTarget=function(){

  state.message='已取消使用道具';
  broadcastState();this.renderG6();
};

// 主持人判定三叶草事件完成
window.G.g6CloverResolve=function(success){
  const g=state.game;
  if(!g.cloverEvent)return;
  const ce=g.cloverEvent;
  const teamMembers=Object.values(state.players).filter(p=>p.team===ce.team&&!p.dead&&p.id!==state.hostId);
  if(success){
    teamMembers.forEach(p=>{
      if(ce.reward==='gold2'){p.gold=(p.gold||0)+2}
      else if(ce.reward==='gold3'){p.gold=(p.gold||0)+3}
      else if(ce.reward==='heal2'){p.hp=Math.min(9,(p.hp||0)+2)}
    });
    state.message=(ce.team==='red'?'红队':'蓝队')+'三叶草事件完成！全队每人'+(ce.reward==='gold2'?'+2金币':ce.reward==='gold3'?'+3金币':'+2血');
    g.lastEffect={type:'clover',text:(ce.team==='red'?'红队':'蓝队')+'三叶草表演成功！',sub:'🍀成功'};
  }else{
    state.message=(ce.team==='red'?'红队':'蓝队')+'三叶草事件未通过';
    g.lastEffect={type:'info',text:(ce.team==='red'?'红队':'蓝队')+'三叶草表演未通过',sub:'🍀失败'};
  }
  g.cloverEvent=null;
  g.phase='moving';
  this.g6NextTurn();
};

// 使用技能
window.G.g6UseSkill=function(peerId,skillIndex){
  const g=state.game;
  const c=g.combat;
  if(!c||c.resolved)return;
  const player=state.players[peerId];
  if(!player||c.attacker!==peerId)return;
  if(c.skillUsed){
    state.message='本次投掷已使用过技能';
    broadcastState();this.renderG6();return;
  }
  const skill=player.skills?.[skillIndex];
  if(!skill||skill.used||skill.sealed)return;
  
  // 技能发动条件：必须已锁定（有环数和骰子结果）
  if(c.ring===undefined||c.dice===undefined||!c.locked){
    state.message='请先投骰锁定后再使用技能';
    broadcastState();this.renderG6();
    return;
  }
  
  // 检查骰子双数
  const isEven=c.dice%2===0;
  if(!isEven){
    state.message='骰子为单数，无法发动技能';
    broadcastState();this.renderG6();
    return;
  }
  
  // 检查技能颜色是否匹配骰子颜色
  if(skill.color!==c.diceColor){
    const colorName={red:'红',blue:'蓝',green:'绿'};
    state.message='技能颜色不匹配：需要'+(colorName[skill.color]||'')+'色骰子，当前是'+(colorName[c.diceColor]||'')+'色骰子';
    broadcastState();this.renderG6();
    return;
  }
  
  // 检查上靶（evenMiss技能除外）
  if(!skill.evenMiss&&c.ring<=0){
    state.message='未上靶，无法发动'+skill.name+'（需要上靶+双数）';
    broadcastState();this.renderG6();
    return;
  }
  
  // 魅魔禁用红色技能
  if(c.monster.effect==='noRedSkill'&&skill.color==='red'){
    state.message='😈 魅魔效果：红色技能被禁用！';
    broadcastState();this.renderG6();
    return;
  }
  // 沉默卷轴debuff
  if(player.debuffs&&player.debuffs.some(d=>d.effect==='silence')){
    state.message='🤫 你被沉默卷轴影响，本次战斗无法使用技能！';
    broadcastState();this.renderG6();
    return;
  }
  
  const monster=c.monster;
  let log=[];
  
  switch(skill.effect){
    case 'goldDamage': // 战斗诗歌：每消耗2金币+1伤害，上限3
      const goldBonus=Math.min(3,Math.floor((player.gold||0)/2));
      if(goldBonus>0){
        const cost=goldBonus*2;
        player.gold-=cost;
        c.damageBoost=(c.damageBoost||0)+goldBonus;
        log.push(player.name+' 使用 '+skill.name+'，消耗'+cost+'金币，伤害+'+goldBonus);
        skill.used=true;
      }else{
        state.message='金币不足，无法使用'+skill.name;
        return;
      }
      break;
    case 'skipMonster': // 催眠曲：跳过怪物下一次行动
      c.skipMonsterAction=true;
      log.push(player.name+' 使用 '+skill.name+'，怪物下一次行动被跳过');
      skill.used=true;
      break;
    case 'monsterAtkDown': // 怜悯：怪物伤害-1
      monster.atk=Math.max(0,monster.atk-1);
      c.monsterAtkDown=true;
      log.push(player.name+' 使用 '+skill.name+'，'+monster.name+'攻击-1');
      skill.used=true;
      break;
    case 'extraDamageGold': // 祈祷：上靶后额外2伤害+1金币
      c.prayerBonus=true;
      log.push(player.name+' 使用 '+skill.name+'，上靶后额外2伤害+1金币');
      skill.used=true;
      break;
    case 'fixedDamage3': // 气味捕捉：固定3点伤害（即使未上靶）
      c.monsterHp=Math.max(0,c.monsterHp-3);
      log.push(player.name+' 使用 '+skill.name+'，造成3点固定伤害');
      skill.used=true;
      if(c.monsterHp<=0){
        this.g6ResolveCombat(peerId,{ring:0,dice:1,crit:false,monsterDead:true,skillKill:true});
        return;
      }
      break;
    case 'ringUpgrade': // 弱点标记：3环变4环，4环变5环
      c.ringUpgrade=true;
      log.push(player.name+' 使用 '+skill.name+'，3环→4环，4环→5环');
      skill.used=true;
      break;
    case 'secondAttack': // 顺势斩：上靶后二次攻击
      c.secondAttack=true;
      log.push(player.name+' 使用 '+skill.name+'，上靶后可二次攻击');
      skill.used=true;
      break;
    case 'reroll': // 无赖：重投骰子
      c.rerollAvailable=true;
      log.push(player.name+' 使用 '+skill.name+'，可重投一次');
      skill.used=true;
      break;
    case 'monsterDefDown': // 虚弱：怪物受伤+1
      c.monsterDefDown=true;
      log.push(player.name+' 使用 '+skill.name+'，'+monster.name+'受到伤害+1');
      skill.used=true;
      break;
    case 'allyDamageUp': // 自然之力：友方伤害+2
      c.allyDamageUp=2;
      log.push(player.name+' 使用 '+skill.name+'，本次战斗伤害+2');
      skill.used=true;
      break;
    case 'burn': // 火球术：持续灼烧，每大回合-2血
      c.monsterBurn=2;
      // 存储灼烧效果到格子怪物
      if(g.cellMonsters&&g.cellMonsters[c.team]&&g.cellMonsters[c.team][c.cellKey]){
        g.cellMonsters[c.team][c.cellKey].burn=2;
      }
      log.push(player.name+' 使用 '+skill.name+'，'+monster.name+'每大回合-2血');
      skill.used=true;
      break;
    case 'getItem': // 魔法药水：放弃上靶伤害，获得道具
      c.giveUpDamage=true;
      // 随机获得一个道具
      const itemPool=Math.random()<0.5?G6_ITEMS_SELF:G6_ITEMS_ENEMY;
      const itemKeys=Object.keys(itemPool);
      const randomItem=itemPool[itemKeys[Math.floor(Math.random()*itemKeys.length)]];
      if(!player.equipment)player.equipment=[];
      const hasItemSlot=player.equipment.some(e=>e.slot==='道具');
      if(!hasItemSlot){
        player.equipment.push({...randomItem,id:'item_'+Date.now()});
        log.push(player.name+' 使用 '+skill.name+'，获得道具：'+randomItem.name);
      }else{
        log.push(player.name+' 使用 '+skill.name+'，但道具槽已满');
      }
      skill.used=true;
      break;
    // ===== 角色自带技能效果 =====
    case 'eraseMonsterSkill': // 迷魂曲：消耗1金币，抹除怪物技能（非龙族）
      if(monster.isDragon){
        state.message='龙族怪物无法被迷魂曲影响';
        return;
      }
      if((player.gold||0)<1){
        state.message='金币不足，无法使用迷魂曲';
        return;
      }
      player.gold-=1;
      monster.skill='（已被抹除）';
      monster.skillErased=true;
      log.push(player.name+' 使用迷魂曲，消耗1金币，抹除'+monster.name+'的技能');
      skill.used=true;
      break;
    case 'stealGold': // 盗窃：盗取怪物额外2金币
      player.gold=(player.gold||0)+2;
      log.push(player.name+' 使用盗窃，从'+monster.name+'盗取2金币');
      skill.used=true;
      break;
    case 'tameMonster': // 驯服：标记击杀后可驯服
      c.tamePending=true;
      log.push(player.name+' 使用驯服，若击杀此怪物可获得伤害道具');
      skill.used=true;
      break;
    case 'plantHeal': // 植物精华：放弃上靶伤害，回友方3血
      c.giveUpDamage=true;
      c.plantHealPending=true;
      log.push(player.name+' 使用植物精华，放弃伤害，将回复友方3血');
      skill.used=true;
      break;
    case 'magicMissile': // 法术飞弹：固定2伤害
      c.monsterHp=Math.max(0,c.monsterHp-2);
      log.push(player.name+' 使用法术飞弹，造成2点固定伤害');
      skill.used=true;
      if(c.monsterHp<=0){
        this.g6ResolveCombat(peerId,{ring:0,dice:1,crit:false,monsterDead:true,skillKill:true});
        return;
      }
      break;
    case 'timeRewind': // 时间回溯：重置本次投掷
      c.locked=false;
      c.ring=undefined;
      c.dice=undefined;
      c.isEven=undefined;
      c.skillUsed=false; // 重置投掷后可再次使用技能
      // 重置客户端投掷状态
      this.g6Rolling=false;
      this.g6Locked=false;
      if(this.g6Timer){clearInterval(this.g6Timer);this.g6Timer=null;}
      log.push(player.name+' 使用时间回溯，重置本次投掷');
      skill.used=true;
      break;
    case 'hoofStomp': // 牛蹄践踏：1/2环变3环
      if(c.ring===1||c.ring===2){
        const oldRing=c.ring;
        c.ring=3;
        log.push(player.name+' 使用牛蹄践踏，'+oldRing+'环提升为3环');
      }else{
        log.push(player.name+' 使用牛蹄践踏（当前'+c.ring+'环，无需提升）');
      }
      skill.used=true;
      break;
    case 'upDownStrike': // 指上打下：固定3伤害
      c.monsterHp=Math.max(0,c.monsterHp-3);
      log.push(player.name+' 使用指上打下，造成3点固定伤害');
      skill.used=true;
      if(c.monsterHp<=0){
        this.g6ResolveCombat(peerId,{ring:0,dice:1,crit:false,monsterDead:true,skillKill:true});
        return;
      }
      break;
    case 'stealth': // 隐秘身形：抵消下次怪物攻击
      player.stealthActive=true;
      log.push(player.name+' 使用隐秘身形，将抵消下一次怪物攻击');
      skill.used=true;
      break;
    case 'counterAttack': // 反击：怪物回合额外攻击
      player.counterAttackPending=true;
      log.push(player.name+' 使用反击，怪物主动攻击回合将额外进攻一次');
      skill.used=true;
      break;
    case 'groupHeal': // 群体治疗：上靶伤害转全体回血
      c.groupHealPending=true;
      log.push(player.name+' 使用群体治疗，上靶伤害将转为全体回血');
      skill.used=true;
      break;
    case 'smite': // 惩戒：上靶后自回2血
      c.smitePending=true;
      log.push(player.name+' 使用惩戒，造成伤害后回复自身2血');
      skill.used=true;
      break;
    default:
      // 未知技能
      log.push(player.name+' 使用 '+skill.name);
      skill.used=true;
      break;
  }
  
  if(log.length>0){
    c.log=(c.log||[]).concat(log);
    state.message=log.join(' | ');
    // 技能专属特效
    const skillFx={
      goldDamage:{icon:'🎵',text:player.name+' 战斗诗歌！',sub:'消耗金币增加伤害'},
      skipMonster:{icon:'😴',text:player.name+' 催眠曲！',sub:'怪物陷入沉睡'},
      monsterAtkDown:{icon:'🛡️',text:player.name+' 怜悯！',sub:'怪物攻击力下降'},
      extraDamageGold:{icon:'🙏',text:player.name+' 祈祷！',sub:'神圣祝福降临'},
      fixedDamage3:{icon:'👃',text:player.name+' 气味捕捉！',sub:'造成3点伤害'},
      ringUpgrade:{icon:'🎯',text:player.name+' 弱点标记！',sub:'命中环数提升'},
      secondAttack:{icon:'⚔️',text:player.name+' 顺势斩！',sub:'可进行二次攻击'},
      reroll:{icon:'🎲',text:player.name+' 无赖！',sub:'可重投一次'},
      monsterDefDown:{icon:'💀',text:player.name+' 虚弱！',sub:'怪物防御力下降'},
      allyDamageUp:{icon:'🌿',text:player.name+' 自然之力！',sub:'队伍伤害提升'},
      burn:{icon:'🔥',text:player.name+' 火球术！',sub:'怪物持续灼烧'},
      getItem:{icon:'🧪',text:player.name+' 魔法药水！',sub:'获得随机道具'},
      // 角色自带技能特效
      eraseMonsterSkill:{icon:'🎵',text:player.name+' 迷魂曲！',sub:'抹除怪物技能'},
      stealGold:{icon:'💰',text:player.name+' 盗窃！',sub:'盗取2金币'},
      tameMonster:{icon:'🐾',text:player.name+' 驯服！',sub:'击杀后可驯服'},
      plantHeal:{icon:'🌱',text:player.name+' 植物精华！',sub:'放弃伤害回复友方'},
      magicMissile:{icon:'✨',text:player.name+' 法术飞弹！',sub:'造成2点伤害'},
      timeRewind:{icon:'⏳',text:player.name+' 时间回溯！',sub:'重置本次投掷'},
      hoofStomp:{icon:'🐂',text:player.name+' 牛蹄践踏！',sub:'1/2环变3环'},
      upDownStrike:{icon:'👊',text:player.name+' 指上打下！',sub:'造成3点伤害'},
      stealth:{icon:'👤',text:player.name+' 隐秘身形！',sub:'抵消下次攻击'},
      counterAttack:{icon:'↩️',text:player.name+' 反击！',sub:'怪物回合额外攻击'},
      groupHeal:{icon:'💚',text:player.name+' 群体治疗！',sub:'伤害转为全体回血'},
      smite:{icon:'⚡',text:player.name+' 惩戒！',sub:'造成伤害后回血'}
    };

    }

  if(skill.effect!=='timeRewind')c.skillUsed=true;

};

// 使用道具
window.G.g6UseItem=function(peerId,targetId,itemId){
  const g=state.game;
  const player=state.players[peerId];
  if(!player||player.dead)return;
  // 从目标选择状态中获取道具
  let item=null;
  if(g.itemTargetSelect&&g.itemTargetSelect.playerId===peerId){
    item=g.itemTargetSelect.item;
  }else if(itemId){
    item=player.equipment?.find(e=>e.id===itemId&&e.slot==='道具');
  }else{
    item=player.equipment?.find(e=>e.slot==='道具');
  }
  if(!item)return;
  
  // 根据道具效果处理
  switch(item.effect){
    case 'healSelf': // 强效治疗药水：回复自身3血
      player.hp=Math.min(9,(player.hp||0)+item.value);
      state.message=player.name+' 使用 '+item.name+'，回复'+item.value+'血';
      g.lastEffect={type:'heal',text:player.name+'回复'+item.value+'血',sub:'🧪'+item.name};
      break;
    case 'healAlly': // 急救包：指定队友回2血
      if(targetId&&state.players[targetId]&&!state.players[targetId].dead&&state.players[targetId].team===player.team){
        const target=state.players[targetId];
        target.hp=Math.min(9,(target.hp||0)+item.value);
        state.message=player.name+' 使用 '+item.name+'，'+target.name+'回复'+item.value+'血';
        g.lastEffect={type:'heal',text:target.name+'回复'+item.value+'血',sub:'🩹'+item.name};
      }else{
        state.message='请选择一名队友';
        return;
      }
      break;
    case 'healBoth': // 友谊啤酒杯：自己+指定队友各回2血
      if(targetId&&state.players[targetId]&&!state.players[targetId].dead&&state.players[targetId].team===player.team){
        const target=state.players[targetId];
        player.hp=Math.min(9,(player.hp||0)+item.value);
        target.hp=Math.min(9,(target.hp||0)+item.value);
        state.message=player.name+' 使用 '+item.name+'，与'+target.name+'各回复'+item.value+'血';
        g.lastEffect={type:'heal',text:player.name+'&'+target.name+'各回复'+item.value+'血',sub:'🍺'+item.name};
      }else{
        state.message='请选择一名队友';
        return;
      }
      break;
    case 'directDamage': // 威士忌炸弹：对当前怪物造成1点伤害
      if(g.phase==='combat'&&g.combat){
        g.combat.monsterHp=Math.max(0,g.combat.monsterHp-item.value);
        state.message=player.name+' 使用 '+item.name+'，对'+g.combat.monster.name+'造成'+item.value+'点伤害';
        g.lastEffect={type:'damage',text:g.combat.monster.name+'-'+item.value+'血',sub:'🥃'+item.name};
        if(g.combat.monsterHp<=0){
          // 怪物被击败
          this.g6ResolveCombat(peerId,{ring:0,dice:1,crit:false,monsterDead:true});
        }
      }else{
        state.message='只能在战斗中使用';
        return;
      }
      break;
    case 'damageBoost': // 酒馆的特调：本次战斗伤害+2
      if(g.phase==='combat'&&g.combat){
        g.combat.damageBoost=(g.combat.damageBoost||0)+item.value;
        state.message=player.name+' 使用 '+item.name+'，本次战斗伤害+'+item.value;
        g.lastEffect={type:'buff',text:'伤害+'+item.value,sub:'🍹'+item.name};
      }else{
        state.message='只能在战斗中使用';
        return;
      }
      break;
    case 'noWeaponBonus': // 友情催化药水：指定玩家下次战斗无法使用武器加成
    case 'noWeapon': // 传说中的酒：指定玩家无法使用武器
    case 'silence': // 沉默卷轴：指定玩家下次战斗不可使用技能
    case 'ringReduce': // 黑胡椒炸弹：指定玩家下次战斗命中环数-2
      if(targetId&&state.players[targetId]&&!state.players[targetId].dead){
        const target=state.players[targetId];
        if(!target.debuffs)target.debuffs=[];
        target.debuffs.push({effect:item.effect,value:item.value,duration:1});
        state.message=player.name+' 使用 '+item.name+'，'+target.name+'受到影响';
        g.lastEffect={type:'debuff',text:target.name+'受到'+item.name+'影响',sub:'💀'+item.name};
      }else{
        state.message='请选择一名目标玩家';
        return;
      }
      break;
    case 'monsterHpBoost': // 玩笑护盾：非龙族怪物+4血
      if(g.phase==='combat'&&g.combat&&!g.combat.monster.isDragon){
        g.combat.monsterHp+=item.value;
        g.combat.monster.hp+=item.value;
        state.message=player.name+' 使用 '+item.name+'，'+g.combat.monster.name+'+'+item.value+'血';
        g.lastEffect={type:'buff',text:g.combat.monster.name+'+'+item.value+'血',sub:'🛡️'+item.name};
      }else{
        state.message='只能在战斗中对非龙族怪物使用';
        return;
      }
      break;
    case 'monsterAtkBoost': // 红色莱恩石：指定怪物伤害+1
      if(g.phase==='combat'&&g.combat){
        g.combat.monster.atk+=item.value;
        state.message=player.name+' 使用 '+item.name+'，'+g.combat.monster.name+'攻击+'+item.value;
        g.lastEffect={type:'buff',text:g.combat.monster.name+'攻击+'+item.value,sub:'🔴'+item.name};
      }else{
        state.message='只能在战斗中使用';
        return;
      }
      break;
    case 'reflectHalf': // 诅咒的娃娃：受到伤害时反击一半（被动，暂不主动使用）
      state.message=item.name+'是被动道具，受到伤害时自动触发';
      return;
    default:
      state.message='道具效果未实现';
      return;
  }
  
  // 消耗道具
  player.equipment=player.equipment.filter(e=>e!==item);
  g.itemTargetSelect=null;
  broadcastState();this.renderG6();
};

// 检查死亡（3条生命系统）
window.G.g6CheckDeath=function(p){
  if(p.hp<=0){
    p.life=(p.life||1)-1;
    p.skillSlots=Math.max(0,(p.skillSlots||4)-1);
    if(p.life<=0){
      p.dead=true;
      p.hp=0;p.life=0;
      state.message+=' | '+p.name+'生命耗尽，被淘汰！';
    }else{
      p.hp=9;
      // 需要封印一个技能：让玩家自己选择
      if(p.skills&&p.skills.filter(s=>!s.sealed).length>p.skillSlots){
        state.game.pendingSeal=p.id;
        state.message+=' | '+p.name+'失去一条命（剩'+p.life+'命），请选择要封印的技能';
      }else{
        state.message+=' | '+p.name+'失去一条命（剩'+p.life+'命）';
      }
    }
  }
};

// 玩家选择封印技能
window.G.g6SealSkill=function(peerId,skillIndex){
  const g=state.game;
  if(g.pendingSeal!==peerId)return;
  const p=state.players[peerId];
  if(!p||!p.skills||!p.skills[skillIndex])return;
  if(p.skills[skillIndex].sealed)return;
  p.skills[skillIndex].sealed=true;
  g.pendingSeal=null;
  state.message=p.name+' 封印了技能【'+p.skills[skillIndex].name+'】';
  broadcastState();this.renderG6();
};

// 获取玩家可装备的装备列表（根据角色槽位）
window.G.g6GetAvailableItems=function(player){
  const g=state.game;
  const charConfig=G6_CHAR_SKILLS[player.character];
  if(!charConfig)return [];
  const slots=charConfig.equip||[];
  const items=[];
  // 主武器
  if(slots.includes('主武器')){
    Object.entries(G6_MAIN_WEAPONS).forEach(([id,w])=>items.push({...w,type:'mainWeapon',id:id}));
  }
  // 副武器
  if(slots.includes('副武器')){
    Object.entries(G6_SECONDARY_WEAPONS).forEach(([id,w])=>items.push({...w,type:'secondaryWeapon',id:id}));
  }
  // 护盾
  if(slots.includes('护盾')){
    Object.entries(G6_SHIELDS).forEach(([id,s])=>items.push({...s,type:'shield',id:id}));
  }
  // 宝物
  if(slots.includes('宝物')){
    Object.entries(G6_TREASURES).forEach(([id,t])=>items.push({...t,type:'treasure',id:id}));
  }
  // 道具（利己+损人）
  if(slots.includes('道具')){
    Object.entries(G6_ITEMS_SELF).forEach(([id,it])=>items.push({...it,type:'item',id:id}));
    Object.entries(G6_ITEMS_ENEMY).forEach(([id,it])=>items.push({...it,type:'item',id:id}));
  }
  // 弃置堆中的装备（刷回商店）
  if(g.discardedEquip&&g.discardedEquip.length>0){
    g.discardedEquip.forEach((item,idx)=>{
      if(slots.includes(item.slot)){
        items.push({...item,id:'discarded_'+idx,discarded:true,name:item.name+'（二手）'});
      }
    });
  }
  return items;
};

// 玩家选择宝箱装备
window.G.g6SelectChestItem=function(peerId,itemType,itemId){
  const g=state.game;
  if(!g.chestSelect)return;
  const player=state.players[peerId];
  if(!player||player.dead)return;
  if(g.chestSelect.chosen[peerId])return; // 已选择
  // 获取装备数据
  let item=null;
  if(itemType==='mainWeapon')item={...G6_MAIN_WEAPONS[itemId],id:itemId};
  else if(itemType==='secondaryWeapon')item={...G6_SECONDARY_WEAPONS[itemId],id:itemId};
  else if(itemType==='shield')item={...G6_SHIELDS[itemId],id:itemId};
  else if(itemType==='treasure')item={...G6_TREASURES[itemId],id:itemId};
  if(!item)return;
  // 装备到对应槽位，旧装备进入弃置堆
  if(!player.equipment)player.equipment=[];
  let oldEquip=null;
  if(itemType==='treasure'){
    if(!player.treasures)player.treasures=[];
    player.treasures.push(item);
  }else{
    // 旧装备进入弃置堆
    oldEquip=player.equipment.find(e=>e.slot===item.slot);
    if(oldEquip){
      if(!g.discardedEquip)g.discardedEquip=[];
      g.discardedEquip.push({...oldEquip,type:itemType});
    }
    player.equipment=player.equipment.filter(e=>e.slot!==item.slot);
    player.equipment.push(item);
  }
  g.chestSelect.chosen[peerId]=item.name;
  state.message=player.name+' 选择了 '+item.name+(oldEquip?'（替换'+oldEquip.name+'）':'');
  this.g6CheckChestDone();
};

// 检查宝箱选择是否完成
window.G.g6CheckChestDone=function(){
  const g=state.game;
  if(!g.chestSelect)return;
  const members=Object.entries(state.players).filter(([pid,p])=>p.team===g.chestSelect.team&&!p.dead&&pid!==state.hostId);
  const allDone=members.every(([pid])=>g.chestSelect.chosen[pid]);
  if(allDone){
    const chosenList=Object.entries(g.chestSelect.chosen).map(([id,name])=>state.players[id]?.name+':'+name);
    g.lastEffect={type:'treasure',text:(g.chestSelect.team==='red'?'红队':'蓝队')+'宝箱选择完成！',sub:'📦 '+chosenList.join('、')};
    g.chestSelect=null;
    g.phase='moving';
    this.g6NextTurn();
  }else{
    broadcastState();this.renderG6();
  }
};

// 大回合结束：宝物效果、灼烧、怪物主动攻击
window.G.g6EndRound=function(){
  const g=state.game;
  // 回合结束宝物效果：绷带回复血量最低的队友1点血量（两队都处理）
  const treasureEffects=[];
  ['red','blue'].forEach(team=>{
    const teamMembers=Object.entries(state.players).filter(([pid,p])=>p.team===team&&!p.dead&&pid!==state.hostId);
    teamMembers.forEach(([pid,p])=>{
      if(!p.treasures)return;
      p.treasures.forEach(t=>{
        if(t.effect==='healAlly'){
          const allies=teamMembers.filter(([aid,a])=>aid!==pid&&a.hp<9).map(([aid,a])=>a);
          if(allies.length>0){
            allies.sort((a,b)=>a.hp-b.hp);
            const target=allies[0];
            target.hp=Math.min(9,target.hp+1);
            treasureEffects.push(p.name+'绷带回复'+target.name+'1血');
          }
        }
      });
    });
  });
  // 大回合结束效果
  {
    // 大回合结束：火球术灼烧伤害
    const burnEffects=[];
    ['red','blue'].forEach(team=>{
      const tp=g.teamPos[team];
      if(!tp)return;
      const floorData=g.floor===1?G6_FLOOR1:G6_FLOOR2;
      const routeCells=tp.route==='top'?floorData.top:floorData.bottom;
      const cell=routeCells[tp.pos];
      if(!cell||cell.type!=='monster')return;
      const cellKey=tp.route+'-'+tp.pos;
      if(g.monstersDefeated[team]?.includes(cellKey))return;
      const monster=g.cellMonsters?.[team]?.[cellKey];
      if(monster&&monster.burn&&monster.burn>0){
        monster.hp=Math.max(0,monster.hp-monster.burn);
        burnEffects.push(monster.name+'灼烧-'+monster.burn+'血');
        if(monster.hp<=0){
          // 灼烧击杀怪物
          g.monstersDefeated[team].push(cellKey);
          burnEffects.push(monster.name+'被灼烧击败！');
        }
      }
    });
    if(burnEffects.length>0){
      g.lastEffect={type:'damage',text:'🔥 火球术灼烧',sub:'🔥 '+burnEffects.join('、')};
    }
    // 大回合结束：未击败的怪物主动攻击小队所有成员
    const monsterAttackEffects=[];
    ['red','blue'].forEach(team=>{
      const tp=g.teamPos[team];
      if(!tp)return;
      const floorData=g.floor===1?G6_FLOOR1:G6_FLOOR2;
      const routeCells=tp.route==='top'?floorData.top:floorData.bottom;
      const cell=routeCells[tp.pos];
      if(!cell||cell.type!=='monster')return;
      // 检查是否已击败
      const cellKey=tp.route+'-'+tp.pos;
      if(g.monstersDefeated[team]?.includes(cellKey))return;
      // 获取怪物
      let monster=g.cellMonsters?.[team]?.[cellKey];
      if(!monster){
        // 随机选择一个非龙族怪物
        const normalMonsters=Object.values(G6_MONSTERS).filter(m=>!m.isDragon);
        monster=normalMonsters[Math.floor(Math.random()*normalMonsters.length)];
      }
      // 映射ruleType到effect
      if(monster.ruleType&&!monster.effect){
        const ruleTypeMap={noRedSkill:'noRedSkill',noCounter:'noCounter',missGold:'loseGold',ring1Miss:'ring1Miss',missHeal:'monsterHeal',missTeamDmg:'teamCounter'};
        if(ruleTypeMap[monster.ruleType])monster.effect=ruleTypeMap[monster.ruleType];
      }
      const teamMembers=Object.values(state.players).filter(p=>p.team===team&&!p.dead&&p.id!==state.hostId);
      teamMembers.forEach(p=>{
        // 角色技能：隐秘身形（抵消下一次怪物攻击）
        if(p.stealthActive){
          p.stealthActive=false;
          monsterAttackEffects.push(p.name+'隐秘身形抵消攻击');
          g.lastEffect={type:'info',text:p.name+' 隐秘身形抵消攻击！',sub:'👤隐秘身形'};
          return;
        }
        let dmg=monster.atk;
        // 护盾减伤
        const shield=p.equipment?.find(e=>e.slot==='护盾');
        if(shield){
          if(shield.effect==='reduceMonsterDmg'||shield.effect==='reduceAllDmg')dmg=Math.max(1,dmg-(shield.value||1));
          if(shield.effect==='reduceCounterDmg'&&false){/* 仅反击减伤，主动攻击不减 */}
        }
        if(dmg>0){
          p.hp=(p.hp||0)-dmg;
          monsterAttackEffects.push(p.name+'-'+dmg+'血');
          // 荆棘甲反伤
          if(shield&&shield.effect==='reflectDmg'){
            monster.hp=Math.max(0,(monster.hp||10)-(shield.value||1));
            monsterAttackEffects.push('🌵荆棘甲反伤'+(shield.value||1));
          }
          this.g6CheckDeath(p);
        }
        // 角色技能：反击（怪物主动攻击回合额外进攻一次，造成2点伤害）
        if(p.counterAttackPending&&!p.dead){
          p.counterAttackPending=false;
          const counterDmg=2;
          monster.hp=Math.max(0,monster.hp-counterDmg);
          monsterAttackEffects.push(p.name+'反击'+monster.name+'-'+counterDmg+'血');
          g.lastEffect={type:'damage',text:p.name+' 反击！'+monster.name+'-'+counterDmg+'血',sub:'↩️反击'};
        }
      });
      if(monsterAttackEffects.length>0){
        g.lastEffect={type:'damage',text:monster.name+'主动攻击'+(team==='red'?'红队':'蓝队'),sub:'👹 '+monsterAttackEffects.join('、')};
      }
    });
  }
  // 回合开始宝物效果
  // 回合开始宝物效果（两队都处理）
  ['red','blue'].forEach(team=>{
    const teamMembers=Object.values(state.players).filter(p=>p.team===team&&!p.dead&&p.id!==state.hostId);
    teamMembers.forEach(p=>{
      if(!p.treasures)return;
      p.treasures.forEach(t=>{
        if(t.effect==='autoHeal'){
          if(p.hp<9){p.hp=Math.min(9,p.hp+1);treasureEffects.push(p.name+'治疗药剂+1血')}
        }
        if(t.effect==='goldDice'){
          const roll=Math.floor(Math.random()*6)+1;
          if(roll>=4){p.gold=(p.gold||0)+1;treasureEffects.push(p.name+'金币钱袋投出'+roll+'，+1金币')}
        }
      });
    });
  });
  if(treasureEffects.length>0){
    g.lastEffect={type:'heal',text:'宝物效果触发',sub:'✨ '+treasureEffects.join('、')};
  }
  // 检查是否全队淘汰
  const redAlive=Object.values(state.players).some(p=>p.team==='red'&&!p.dead);
  const blueAlive=Object.values(state.players).some(p=>p.team==='blue'&&!p.dead);
  if(!redAlive){this.g6EndGame('blue');return}
  if(!blueAlive){this.g6EndGame('red');return}
  state.message='第'+g.round+'大回合开始，'+(g.currentTeam==='red'?'红队':'蓝队')+'先行动';
  if(treasureEffects.length>0)state.message+=' | '+treasureEffects.join('、');
  broadcastState();this.renderG6();
};

window.G.g6EndGame=function(winnerTeam){
  state.phase='ended';
  // 计算总分
  const redMembers=Object.values(state.players).filter(p=>p.team==='red');
  const blueMembers=Object.values(state.players).filter(p=>p.team==='blue');
  const redScore=redMembers.reduce((s,p)=>s+g6HpScore(p)+(p.gold||0),0);
  const blueScore=blueMembers.reduce((s,p)=>s+g6HpScore(p)+(p.gold||0),0);
  const winTeam=redScore>blueScore?'red':blueScore>redScore?'blue':'red';
  state.winner=winTeam;
  // G6地下城风格胜利/失败大特效
  const isWin=state.players[myPeerId]?state.players[myPeerId].team===winTeam:false;
  this.g6ShowEndEffect(winTeam,isWin,redScore,blueScore);
  setTimeout(()=>{
    const personalGold={};
    Object.entries(state.players).forEach(([id,p])=>{personalGold[id]=p.team===winTeam?5:2});
    gameOver({
      winner:'🎉 '+(winTeam==='red'?'红队':'蓝队')+'胜利！(红'+redScore+' vs 蓝'+blueScore+')',
      personalGold
    });
  },4000);
};

// G6地下城风格结束特效
window.G.g6ShowEndEffect=function(winTeam,isWin,redScore,blueScore){
  const effectDiv=document.createElement('div');
  effectDiv.id='g6EndEffect';
  effectDiv.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:g6FadeIn .5s ease-out';
  const title=isWin?'🏆 胜 利 🏆':'💀 失 败 💀';
  const titleColor=isWin?'#ffd700':'#ff4444';
  const teamName=winTeam==='red'?'🔴 红 队':'🔵 蓝 队';
  const particles=isWin?
    Array(30).fill(0).map((_,i)=>`<div class="g6-particle" style="left:${Math.random()*100}%;animation-delay:${Math.random()*2}s;background:${['#ffd700','#ff6b6b','#4ecdc4','#45b7d1'][i%4]}"></div>`).join(''):
    Array(20).fill(0).map((_,i)=>`<div class="g6-skull" style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s">💀</div>`).join('');
  effectDiv.innerHTML=`
    ${particles}
    <div class="g6-end-title" style="color:${titleColor};animation:g6TitlePulse 1s ease-in-out infinite">${title}</div>
    <div class="g6-end-team" style="color:${winTeam==='red'?'#ef9a9a':'#64b5f6'}">${teamName} 征服了地下城！</div>
    <div class="g6-end-score">🔴 红队 ${redScore} 分 VS 🔵 蓝队 ${blueScore} 分</div>
    <div class="g6-end-sub" style="color:${isWin?'#4ecdc4':'#888'}">${isWin?'你们的勇气将被永远铭记...':'地下城吞噬了你们的灵魂...'}</div>
    <div class="g6-end-loading">即将进入结算...</div>
  `;
  document.body.appendChild(effectDiv);
  setTimeout(()=>{if(document.getElementById('g6EndEffect'))document.getElementById('g6EndEffect').remove()},4000);
};

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded',()=>{
  renderCharPick();
  document.getElementById('teamBlueBtn').classList.add('selected');
  const ri=document.getElementById('joinRoomInput');
  ri.addEventListener('input',()=>{
    const rid=ri.value.trim().toUpperCase();
    if(rid.length===6){const s=loadReconnectCode(rid);if(s){document.getElementById('joinReconnectInput').value=s.code;if(s.charId){selectedChar=s.charId;renderCharPick()}if(s.name)myName=s.name;document.getElementById('joinStatus').textContent='检测到重连码，已自动填入'}}
  });
  document.getElementById('joinRoomInput').addEventListener('keydown',e=>{if(e.key==='Enter')playerJoin()});
  document.getElementById('joinReconnectInput').addEventListener('keydown',e=>{if(e.key==='Enter')playerJoin()});
});
</script>
