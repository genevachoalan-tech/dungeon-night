// ==================== 游戏1：小蛇机 ====================
const G1_CARDS={
  head:{label:'出局',cls:'head',value:0,icon:'🐍'},
  gold:{label:'金牌',cls:'gold',value:5,icon:'🏆'},
  scarf0:{label:'0围脖',cls:'body-0',value:0,icon:'🐍'},
  scarf1:{label:'1围脖',cls:'body-1',value:1,icon:'🧣'},
  scarf2:{label:'2围脖',cls:'body-2',value:2,icon:'🧣'},
  scarf3:{label:'3围脖',cls:'body-3',value:3,icon:'🧣'},
  tail:{label:'蛇尾',cls:'tail',value:0,icon:'🐍'},
};
const G1_DECK=[{type:'head',count:8},{type:'gold',count:4},{type:'scarf0',count:8},{type:'scarf1',count:8},{type:'scarf2',count:8},{type:'scarf3',count:6}];
const G1_DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];

window.G.initG1=function(){
  this.g1Deck=[];G1_DECK.forEach(c=>{for(let i=0;i<c.count;i++)this.g1Deck.push(c.type)});
  for(let i=this.g1Deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[this.g1Deck[i],this.g1Deck[j]]=[this.g1Deck[j],this.g1Deck[i]]}
  // 初始化玩家
  const order=buildTurnOrder();
  state.turnOrder=order;state.currentIndex=0;state.round=1;
  state.game={firstHead:false,lastCard:null,deckCount:this.g1Deck.length};
  Object.values(state.players).forEach(p=>{p.snake=['tail'];p.g1coins=0;p.failed=false;p.g1title=false});
  state.message=playerName(order[0])+' 的回合，投掷骰子';state.messageType='';
  document.getElementById('gameInfo').innerHTML='<span>回合 <b id="g1Round">1</b></span><span>牌堆 <b id="g1DeckN">42</b></span><span id="g1Turn"></span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small btn-red" onclick="G.hostActionG1(null,\'skip\')">跳过当前断线玩家</button>';
  this.g1Rolling=false;
};

window.G.renderG1=function(){
  if(!state.game)return;
  const g=state.game;
  document.getElementById('g1Round').textContent=state.round;
  document.getElementById('g1DeckN').textContent=g.deckCount;
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){
    const cp=state.players[curId];
    document.getElementById('g1Turn').innerHTML=`当前：<b style="color:${cp.team==='blue'?'#64b5f6':'#ef9a9a'}">${cp.name}</b>${cp.online?'':'（离线⏸️）'}`;
  }
  let bc=0,rc=0;
  Object.values(state.players).forEach(p=>{if(p.team==='blue')bc+=p.g1coins;else rc+=p.g1coins});
  let html=`<div class="g1-team-coins"><div class="g1-team-coin blue"><span>🔵 蓝队</span><b>${bc}</b></div><div class="g1-team-coin red"><span>🔴 红队</span><b>${rc}</b></div></div>`;
  html+='<div class="g1-players">';
  state.turnOrder.forEach(id=>{
    const p=state.players[id];if(!p)return;
    let badges='';
    if(p.g1title)badges+='<span class="g1-mini-badge title">一发入魂</span>';
    if(p.failed)badges+='<span class="g1-mini-badge fail">出局</span>';
    let snakeHtml='';
    p.snake.forEach(t=>{const c=G1_CARDS[t];let mv=t==='gold'?'5':t.startsWith('scarf')?c.value:t==='head'?'✕':'';snakeHtml+=`<div class="g1-mcard ${c.cls}"><span class="mi">${c.icon}</span><span class="mv">${mv}</span></div>`});
    html+=`<div class="g1-card ${id===curId&&state.phase==='playing'&&!p.failed?'active':''} ${p.failed?'failed':''} ${id===myPeerId?'me':''}">
      <div class="g1-pc-head"><span class="g1-pc-name">${p.team==='blue'?'🔵':'🔴'} ${p.name}${id===myPeerId?' (你)':''}${badges}${p.online?'':' 💤'}</span><span class="g1-pc-coins">${p.g1coins}币</span></div>
      <div class="g1-snake">${snakeHtml}</div></div>`;
  });
  html+='</div>';
  html+=`<div class="g1-center"><div class="g1-msg ${state.messageType||''}" id="g1Msg">${state.message||''}</div><div class="g1-rollrow">
    <div><div class="g1-deck">🃏</div><div style="font-size:11px;color:#a5d6a7;margin-top:4px">牌堆 ${g.deckCount}</div></div>
    <div class="g1-dice" id="g1Dice">🎲</div>
    <button class="btn" id="g1RollBtn" onclick="sendAction({type:'roll'})">投掷骰子</button>
  </div></div>`;
  if(g.lastCard){
    const lc=g.lastCard,ct=G1_CARDS[lc.type];
    html+=`<div class="g1-reveal"><div class="g1-rcard ${ct.cls}"><div class="g1-ricon">${ct.icon}</div><div class="g1-rname">${ct.label}</div><div class="g1-reffect">${lc.effect}</div></div><div class="g1-rplayer">${lc.playerName} 抽到</div></div>`;
  }
  document.getElementById('gameArea').innerHTML=html;
  // 按钮状态
  const btn=document.getElementById('g1RollBtn');
  if(state.phase==='playing'){
    if(isHost){btn.disabled=true;btn.textContent='观战中'}
    else if(!curId||!state.players[curId].online){btn.disabled=true;btn.textContent='等待重连...'}
    else{const myTurn=curId===myPeerId&&!state.players[myPeerId].failed;btn.disabled=!myTurn||this.g1Rolling;btn.textContent=myTurn?(this.g1Rolling?'投掷中...':'🎲 投掷骰子'):'等待对手...'}
  }else{btn.disabled=true;btn.textContent='游戏已结束'}
};

window.G.actionG1=function(peerId,action){
  if(action.type!=='roll')return;
  if(state.phase!=='playing'||this.g1Rolling)return;
  if(state.turnOrder[state.currentIndex]!==peerId)return;
  if(!state.players[peerId].online||state.players[peerId].failed)return;
  this.g1Rolling=true;this.renderG1();
  this.g1AnimateDice();
  setTimeout(()=>{this.g1DrawCard()},850);
};

window.G.hostActionG1=function(peerId,action){

    const curId=state.turnOrder[state.currentIndex];
    state.message='主持人跳过了 '+state.players[curId].name+' 的回合';state.messageType='warn';

  }

window.G.g1AnimateDice=function(){
  const el=document.getElementById('g1Dice');if(!el)return;
  el.classList.add('rolling');let t=0;
  const iv=setInterval(()=>{el.textContent=G1_DICE[Math.floor(Math.random()*6)];t++;if(t>=10){clearInterval(iv);el.classList.remove('rolling');el.textContent=G1_DICE[Math.floor(Math.random()*6)]}},80);
};

window.G.g1DrawCard=function(){
  if(!this.g1Deck||this.g1Deck.length===0){this.g1EndGame();return}
  const idx=Math.floor(Math.random()*this.g1Deck.length);
  const cardType=this.g1Deck.splice(idx,1)[0];
  const curId=state.turnOrder[state.currentIndex];
  const p=state.players[curId];const card=G1_CARDS[cardType];
  if(cardType==='head'){
    if(state.round<=3){
      this.g1Deck.push('head');
      for(let i=this.g1Deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[this.g1Deck[i],this.g1Deck[j]]=[this.g1Deck[j],this.g1Deck[i]]}
      state.message=`🐍 ${p.name} 翻出蛇头！第${state.round}回合保底期，无效放回。继续投掷！`;state.messageType='warn';
      state.game.lastCard={type:'head',playerName:p.name,effect:'保底无效，放回牌堆'};
    }else{
      p.snake.push('head');p.failed=true;
      let m=`💀 ${p.name} 翻出蛇头，出局！`;let eff='失败出局';
      if(!state.game.firstHead){state.game.firstHead=true;p.g1title=true;p.g1coins+=5;m+=' 一发入魂+5金币！';eff='出局 · 一发入魂+5币'}
      state.message=m;state.messageType='warn';
      state.game.lastCard={type:'head',playerName:p.name,effect:eff};
    }
  }else{
    p.snake.push(cardType);p.g1coins+=card.value;
    state.message=`${p.name} 抓到【${card.label}】，${card.value>0?'+'+card.value+'金币':'无金币'}`;state.messageType='good';
    state.game.lastCard={type:cardType,playerName:p.name,effect:card.value>0?'+'+card.value+'金币':'无金币'};
  }
  state.game.deckCount=this.g1Deck.length;
  this.g1Rolling=false;
  broadcastState();this.renderG1();
  if(this.g1CheckEnd())setTimeout(()=>this.g1EndGame(),1500);
  else setTimeout(()=>{this.g1NextTurn();broadcastState();this.renderG1()},1200);
};

window.G.g1NextTurn=function(){
  const len=state.turnOrder.length;if(len===0)return;
  let nextIdx=(state.currentIndex+1)%len;
  if(nextIdx<=state.currentIndex)state.round++;
  state.currentIndex=nextIdx;
  let guard=0;
  while(state.players[state.turnOrder[state.currentIndex]].failed&&guard<len){
    state.currentIndex=(state.currentIndex+1)%len;
    if(state.currentIndex===0)state.round++;guard++;
  }
  const np=state.players[state.turnOrder[state.currentIndex]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else{state.message=np.name+' 的回合（第'+state.round+'回合），投掷骰子';state.messageType=''}
};

window.G.g1CheckEnd=function(){
  if(state.round>8)return true;
  const alive=state.turnOrder.filter(id=>!state.players[id].failed);
  if(alive.length===0)return true;
  if(!this.g1Deck||this.g1Deck.length===0)return true;
  return false;
};

window.G.g1EndGame=function(){
  let bc=0,rc=0;
  Object.values(state.players).forEach(p=>{if(p.team==='blue')bc+=p.g1coins;else rc+=p.g1coins});
  const winner=bc>rc?'🔵 蓝队获胜！':rc>bc?'🔴 红队获胜！':'🤝 平局！';
  gameOver({winner,teamGold:{blue:bc,red:rc}});
};

    html+=`<div class="g2-dice ${g.diceRolled&&val!=null?(canSelect?'selectable':''):'disabled'}" id="g2d${i}" ${canSelect?`onclick="sendAction({type:'select',index:${i}})"`:''}>${g.diceRolled&&val!=null?G2_DICE[val-1]:'🎲'}</div>`;
  }
  html+='</div><div class="g2-dice-eff">'+(g.diceRolled?g.dice.map((v,i)=>`骰${i+1}:${G2_EFF[v]}`).join(' | '):'')+'</div>';
  html+=`<div class="g2-msg ${state.messageType||''}">${state.message||''}</div>`;
  const canRoll=!isHost&&curId===myPeerId&&!g.diceRolled&&state.phase==='playing'&&state.players[curId]&&state.players[curId].online;
  html+=`<button class="btn" id="g2RollBtn" onclick="sendAction({type:'roll'})" ${canRoll?'':'disabled'}>${g.diceRolled?'请选择一颗骰子':(curId===myPeerId?'🎲 投掷骰子':'等待对手...')}</button></div>`;
  // 队伍
  html+='<div class="g2-teams">';
  ['blue','red'].forEach(t=>{
    let tc=0;state.turnOrder.forEach(id=>{const p=state.players[id];if(p&&p.team===t)tc+=p.g2coins});
    html+=`<div class="g2-team ${t}"><h4>${t==='blue'?'🔵 蓝队':'🔴 红队'}<span class="coins">${tc}币</span></h4>`;
    state.turnOrder.forEach(id=>{const p=state.players[id];if(!p||p.team!==t)return;html+=`<span class="g2-chip ${id===curId?'active':''} ${id===myPeerId?'me':''} ${p.online?'':'offline'}">${p.name}${p.online?'':'💤'}${id===curId?(g.direction===1?'➡️':'⬅️'):''}</span>`});
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('gameArea').innerHTML=html;
};

window.G.actionG2=function(peerId,action){
  if(state.phase!=='playing')return;
  if(state.turnOrder[state.currentIndex]!==peerId)return;
  if(!state.players[peerId].online)return;
  if(action.type==='roll'&&!state.game.diceRolled){
    state.game.dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];
    state.game.diceRolled=true;
    state.message=state.players[peerId].name+' 投出骰子，请选择一颗';state.messageType='';
    broadcastState();this.renderG2();
  }else if(action.type==='select'&&state.game.diceRolled){
    this.g2DoSelect(action.index);
  }
};

window.G.hostActionG2=function(peerId,action){
  if(action.type==='skip'&&state.phase==='playing'){
    state.message='主持人跳过了 '+state.players[state.turnOrder[state.currentIndex]].name+' 的回合';state.messageType='warn';
    state.game.diceRolled=false;state.game.dice=[null,null,null];
    this.g2NextTurn();broadcastState();this.renderG2();
  }
};

window.G.g2DoSelect=function(idx){
  const val=state.game.dice[idx];const curId=state.turnOrder[state.currentIndex];const p=state.players[curId];
  if(val<=3){state.game.cup+=val;state.message=`${p.name} 选择+${val}酒，酒杯 ${state.game.cup-val}→${state.game.cup}`}
  else if(val===4){state.game.cup=Math.max(0,state.game.cup-4);state.message=`${p.name} 选择-4酒，酒杯降至 ${state.game.cup}`}
  else if(val===5){state.message=`${p.name} 选择跳过回合`}
  else if(val===6){state.game.direction*=-1;state.message=`${p.name} 选择反转！方向${state.game.direction===1?'恢复正向':'变为逆向'}`}
  state.messageType=(val<=3&&state.game.cup>=27)?'warn':'good';
  if(state.game.cup>=G2_CUP_MAX){
    state.game.winner=p.team==='blue'?'red':'blue';
    state.message+=` — 酒杯溢出！${p.team==='blue'?'蓝队':'红队'}输了！`;state.messageType='warn';
    const winTeam=state.game.winner;
    const personalGold={};
    Object.entries(state.players).forEach(([id,pl])=>{pl.g2coins=pl.team===winTeam?10:6;personalGold[id]=pl.team===winTeam?10:6});
    const winner=winTeam==='blue'?'🔵 蓝队获胜！':'🔴 红队获胜！';
    gameOver({winner,personalGold});
    return;
  }
  state.game.diceRolled=false;state.game.dice=[null,null,null];
  this.g2NextTurn();broadcastState();this.renderG2();
};

window.G.g2NextTurn=function(){
  const len=state.turnOrder.length;if(len===0)return;
  const nextIdx=(state.currentIndex+state.game.direction+len)%len;
  if(state.game.direction===1&&nextIdx<=state.currentIndex)state.round++;
  if(state.game.direction===-1&&nextIdx>=state.currentIndex&&nextIdx!==state.currentIndex)state.round++;
  state.currentIndex=nextIdx;
  const np=state.players[state.turnOrder[nextIdx]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else{state.message=np.name+' 的回合（第'+state.round+'轮），投掷骰子';state.messageType=''}
};

// ==================== 游戏3：酒馆争夺战 ====================
const G3_DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const G3_TAVERNS=[
  {id:1,topGold:5,bottomGold:2,guardian:'猞猁'},{id:2,topGold:7,bottomGold:3,guardian:'乌鸦'},
  {id:3,topGold:9,bottomGold:4,guardian:'老虎'},{id:4,topGold:12,bottomGold:5,guardian:null},
  {id:5,topGold:15,bottomGold:6,guardian:null},{id:6,topGold:20,bottomGold:8,guardian:null},
];
const G3_INIT_IND=8;

window.G.initG3=function(){
  const blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue').map(([id])=>id);
  const reds=Object.entries(state.players).filter(([_,p])=>p.team==='red').map(([id])=>id);
  state._blues=blues;state._reds=reds;
  state.game={taverns:G3_TAVERNS.map(t=>({...t,hits:{}})),dice:[],diceRolled:false,coinflip:null,guardianGame:null,lastAction:null};
  // 使用preGame猜大小的结果，不再内部比大小
  const firstTeam=state.firstTeam||'blue';
  const first=firstTeam==='blue'?blues:reds;
  const second=firstTeam==='blue'?reds:blues;
  const order=[];const mx=Math.max(first.length,second.length);
  for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
  state.turnOrder=order;state.currentIndex=0;state.round=1;
  Object.values(state.players).forEach(p=>{p.g3coins=0;p.indicators=G3_INIT_IND});
  state.phase='playing';
  state.message=(firstTeam==='blue'?'🔵蓝队':'🔴红队')+' 先手！'+playerName(order[0])+' 的回合';state.messageType='good';
  document.getElementById('gameInfo').innerHTML='<span>第 <b id="g3Round">1</b> 轮</span><span id="g3Turn"></span><span id="g3IndInfo" class="g3-ind-info"></span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small btn-red" onclick="G.hostActionG3(null,\'skip\')">跳过断线玩家</button>';
};

window.G.renderG3=function(){
  if(!state.game)return;const g=state.game;
  document.getElementById('g3Round').textContent=state.round;
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){const cp=state.players[curId];document.getElementById('g3Turn').innerHTML=`当前：<b style="color:${cp.team==='blue'?'#64b5f6':'#ef9a9a'}">${cp.name}</b>${cp.online?'':'（离线⏸️）'}`}
  if(!isHost&&state.players[myPeerId])document.getElementById('g3IndInfo').innerHTML='我的指示物：<b>'+state.players[myPeerId].indicators+'</b>';
  else if(isHost&&curId)document.getElementById('g3IndInfo').innerHTML=playerName(curId)+' 指示物：<b>'+state.players[curId].indicators+'</b>';

  let html='';
  // 比大小阶段
  if(state.phase==='coinflip'){
    const cf=g.coinflip||{};
    html+='<div class="g3-center"><div class="g3-dice-row">';
    if(cf.done){
      html+=`<div class="g3-dice" style="border:3px solid #1976d2">${G3_DICE[cf.blue-1]}</div><div style="font-size:22px;align-self:center">VS</div><div class="g3-dice" style="border:3px solid #c62828">${G3_DICE[cf.red-1]}</div>`;
    }else html+='<div style="font-size:14px;color:#ffcc80;align-self:center">等待主持人投骰...</div>';
    html+='</div>';
    if(cf.done)html+=`<div style="font-size:13px;margin:8px 0">🔵蓝队 ${cf.blue} 点 · 🔴红队 ${cf.red} 点</div>`;
    if(isHost)html+=`<button class="btn" onclick="G.hostActionG3(null,{type:'coinflip'})">${cf.done&&cf.winner==='tie'?'平局！再投一次':'投骰比大小'}</button>`;
    else html+='<button class="btn" disabled>等待主持人...</button>';
    html+='</div>';
    html+=`<div class="g3-msg ${state.messageType||''}">${state.message||''}</div>`;
    document.getElementById('gameArea').innerHTML=html;return;
  }

  // 酒馆网格
  html+='<div class="g3-taverns">';
  const isMyTurn=!isHost&&curId===myPeerId&&g.diceRolled&&state.phase==='playing'&&state.players[curId]&&state.players[curId].online;
  g.taverns.forEach(tv=>{
    const maxHit=Math.max(1,...Object.values(tv.hits));
    let hitsHtml='';
    state.turnOrder.forEach(id=>{const p=state.players[id];if(!p)return;const h=tv.hits[id]||0;hitsHtml+=`<div class="g3-hit-row"><span>${p.team==='blue'?'🔵':'🔴'}${p.name}</span><span class="bar"><span class="bar-fill" style="width:${(h/maxHit)*100}%"></span></span><span>${h}</span></div>`});
    html+=`<div class="g3-tv ${tv.guardian?'guardian':''} ${isMyTurn?'attackable':''}" ${isMyTurn?`onclick="sendAction({type:'attack',tavernId:${tv.id}})"`:''}>
      <div class="g3-tv-head"><span>🍺 ${tv.id}号</span>${tv.guardian?'🛡️':''}</div>
      <div class="g3-tv-gold">上<b>${tv.topGold}</b>/下<b>${tv.bottomGold}</b></div>${hitsHtml}</div>`;
  });
  html+='</div>';
  // 骰子
  html+='<div class="g3-dice-row">';
  if(g.diceRolled&&g.dice.length)g.dice.forEach(v=>html+=`<div class="g3-dice">${G3_DICE[v-1]}</div>`);
  html+='</div>';
  if(g.diceRolled){
    html+='<div class="g3-counts">';
    for(let n=1;n<=6;n++){const cnt=g.dice.filter(d=>d===n).length;html+=`<span class="g3-count">${G3_DICE[n-1]}×<b>${cnt}</b></span>`}
    html+='</div>';
  }
  // 操作展示
  if(g.lastAction){
    const la=g.lastAction;
    html+=`<div class="g3-reveal"><div class="rv-name">${la.playerName} → ${la.tavernId}号酒馆</div><div class="rv-eff">${la.effect}</div>${la.guardianEffect?`<div class="rv-g">🛡️ ${la.guardianEffect}</div>`:''}</div>`;
  }
  // 操作特效
  if(g.lastEffect){
    const fx=g.lastEffect;
    const fxIcon={break:'🍺',gold:'💰',ind:'🔮',fail:'❌'}[fx.type]||'✨';
    html+=`<div class="g3-fx-overlay"><div class="g3-fx-box g3-fx-${fx.type}"><div class="g3-fx-icon">${fxIcon}</div><div class="g3-fx-text">${fx.text}</div><div class="g3-fx-sub">${fx.playerName} · ${fx.sub}</div></div></div>`;
  }
  html+=`<div class="g3-msg ${state.messageType||''}">${state.message||''}</div>`;
  html+='<div class="g3-center">';
  if(state.phase==='playing'){
    if(g.guardianGame)html+='<button class="btn" disabled>守护者小游戏中...</button>';
    else if(isHost)html+='<button class="btn" disabled>观战中</button>';
    else if(!curId||!state.players[curId].online)html+='<button class="btn" disabled>等待重连...</button>';
    else{
      const myTurn=curId===myPeerId;const myInd=state.players[myPeerId]?state.players[myPeerId].indicators:0;
      if(!g.diceRolled)html+=`<button class="btn" onclick="sendAction({type:'roll'})" ${!myTurn||myInd<=0?'disabled':''}>${myTurn?(myInd<=0?'已用完':'🎲 投掷骰子'):'等待对手...'}</button>`;
      else html+=`<button class="btn" ${!myTurn?'disabled':''}>${myTurn?'点击酒馆攻击 ↑':'等待对手...'}</button>`;
    }
  }else html+='<button class="btn" disabled>游戏已结束</button>';
  html+='</div>';
  document.getElementById('gameArea').innerHTML=html;
  // 守护者弹窗
  if(g.guardianGame)this.g3ShowGuardian(g.guardianGame);
};

window.G.actionG3=function(peerId,action){
  if(action.type==='roll'){
    if(state.phase!=='playing'||state.game.diceRolled)return;
    if(state.turnOrder[state.currentIndex]!==peerId||!state.players[peerId].online)return;
    const count=state.players[peerId].indicators;
    state.game.dice=[];for(let i=0;i<count;i++)state.game.dice.push(1+Math.floor(Math.random()*6));
    state.game.diceRolled=true;
    state.message=state.players[peerId].name+' 投出 '+count+' 颗骰子，请选择攻击的酒馆';state.messageType='';
    broadcastState();this.renderG3();
  }else if(action.type==='attack'){
    if(state.phase!=='playing'||!state.game.diceRolled)return;
    if(state.turnOrder[state.currentIndex]!==peerId)return;
    this.g3DoAttack(action.tavernId);
  }else if(action.type==='guardianAction'){
    if(!state.game.guardianGame||state.game.guardianGame.playerId!==peerId)return;
    this.g3GuardianAction(action.action);
  }else if(action.type==='guardianDone'){
    if(!state.game.guardianGame||state.game.guardianGame.playerId!==peerId)return;
    this.g3FinishGuardian();
  }
};

window.G.hostActionG3=function(peerId,action){
  if(action.type==='coinflip'&&state.phase==='coinflip'){
    const b=1+Math.floor(Math.random()*6),r=1+Math.floor(Math.random()*6);
    state.game.coinflip={blue:b,red:r,done:true};
    if(b>r)state.game.coinflip.winner='blue';else if(r>b)state.game.coinflip.winner='red';else state.game.coinflip.winner='tie';
    if(state.game.coinflip.winner!=='tie'){
      const first=state.game.coinflip.winner==='blue'?state._blues:state._reds;
      const second=state.game.coinflip.winner==='blue'?state._reds:state._blues;
      const order=[];const mx=Math.max(first.length,second.length);
      for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
      state.turnOrder=order;state.currentIndex=0;state.phase='playing';
      state.message=(state.game.coinflip.winner==='blue'?'🔵蓝队':'🔴红队')+' 获胜先行动！'+playerName(order[0])+' 的回合';state.messageType='good';
    }else state.message='平局！再投一次';state.messageType='warn';
    broadcastState();this.renderG3();
  }else if(action==='skip'&&state.phase==='playing'){
    state.message='主持人跳过了 '+state.players[state.turnOrder[state.currentIndex]].name;state.messageType='warn';
    state.game.diceRolled=false;state.game.dice=[];state.game.guardianGame=null;
    this.g3NextTurn();broadcastState();this.renderG3();
  }
};

window.G.g3DoAttack=function(tavernId){
  const curId=state.turnOrder[state.currentIndex];const p=state.players[curId];const tv=state.game.taverns[tavernId-1];
  const baseHits=state.game.dice.filter(d=>d===tavernId).length;
  if(baseHits===0){
    state.message=p.name+' 选了'+tavernId+'号酒馆，但该数字未出现，跳过';state.messageType='warn';
    state.game.lastAction={tavernId,playerName:p.name,effect:'跳过回合'};
    state.game.lastEffect={type:'fail',playerName:p.name,text:'未命中',sub:'该数字未出现'};
    state.game.diceRolled=false;state.game.dice=[];this.g3AfterAttack();return;
  }
  tv.hits[curId]=(tv.hits[curId]||0)+baseHits;
  const cost=Math.min(p.indicators,baseHits);p.indicators-=cost;
  state.message=`${p.name} 攻击${tavernId}号酒馆，打破${baseHits}个酒桶（剩余${p.indicators}指示物）`;state.messageType='good';
  state.game.lastAction={tavernId,playerName:p.name,effect:'打破'+baseHits+'个酒桶',guardian:tv.guardian};
  state.game.lastEffect={type:'break',playerName:p.name,text:'打破 '+baseHits+' 个酒桶',sub:tavernId+'号酒馆'};
  state.game.diceRolled=false;state.game.dice=[];
  if(tv.guardian){
    const gg={active:true,tavernId,playerId:curId,type:tv.guardian,step:'choose'};
    if(tv.guardian==='猞猁')gg.actualHand=Math.random()<0.5?'left':'right';
    else if(tv.guardian==='乌鸦')gg.guardianGuess=1+Math.floor(Math.random()*3);
    else if(tv.guardian==='老虎'){gg.rounds=[];gg.wins=0}
    state.game.guardianGame=gg;broadcastState();this.renderG3();return;
  }
  this.g3AfterAttack();
};

window.G.g3GuardianAction=function(action){
  const gg=state.game.guardianGame;if(!gg)return;
  if(gg.type==='猞猁'){gg.guess=action.guess;gg.step='result'}
  else if(gg.type==='乌鸦'){gg.playerNum=action.playerNum;gg.step='result'}
  else if(gg.type==='老虎'){
    const pr=1+Math.floor(Math.random()*6),gr=1+Math.floor(Math.random()*6);
    if(pr>gr)gg.wins++;gg.rounds.push({player:pr,guardian:gr,win:pr>gr});
    if(gg.rounds.length>=3)gg.step='result';
  }
  broadcastState();this.renderG3();
};

window.G.g3FinishGuardian=function(){
  const gg=state.game.guardianGame;if(!gg)return;const p=state.players[gg.playerId];let eff='';let fx=null;
  if(gg.type==='猞猁'){if(gg.guess===gg.actualHand){p.g3coins+=2;eff='猜对！+2金币';fx={type:'gold',playerName:p.name,text:'+2 金币',sub:'猞猁守护者'}}else eff='猜错，无事发生'}
  else if(gg.type==='乌鸦'){if(gg.playerNum!==gg.guardianGuess){p.indicators+=1;eff='守护者猜错！返还1指示物';fx={type:'ind',playerName:p.name,text:'+1 指示物',sub:'乌鸦守护者猜错'}}else{p.g3coins+=gg.playerNum;eff='守护者猜对！+'+gg.playerNum+'金币';fx={type:'gold',playerName:p.name,text:'+'+gg.playerNum+' 金币',sub:'乌鸦守护者猜对'}}}
  else if(gg.type==='老虎'){p.g3coins+=gg.wins;eff='赢'+gg.wins+'局，+'+gg.wins+'金币';if(gg.wins>0)fx={type:'gold',playerName:p.name,text:'+'+gg.wins+' 金币',sub:'老虎守护者赢'+gg.wins+'局'}}
  state.message+=' | 🛡️'+gg.type+'：'+eff;
  if(state.game.lastAction)state.game.lastAction.guardianEffect=eff;
  if(fx)state.game.lastEffect=fx;
  // 关闭守护者弹窗
  let m=document.getElementById('g3GuardianModal');if(m)m.remove();
  state.game.guardianGame=null;this.g3AfterAttack();
};

window.G.g3AfterAttack=function(){
  broadcastState();this.renderG3();
  // 特效2秒后清除
  if(state.game&&state.game.lastEffect){const fx=state.game.lastEffect;setTimeout(()=>{if(state.game&&state.game.lastEffect===fx){state.game.lastEffect=null;broadcastState();this.renderG3()}},2000)}
  const allDone=state.turnOrder.every(id=>state.players[id].indicators<=0);
  if(allDone){setTimeout(()=>this.g3EndGame(),1500);return}
  setTimeout(()=>{this.g3NextTurn();broadcastState();this.renderG3()},1500);
};

window.G.g3NextTurn=function(){
  const len=state.turnOrder.length;if(len===0)return;
  let nextIdx=(state.currentIndex+1)%len;if(nextIdx<=state.currentIndex)state.round++;
  let guard=0;
  while(state.players[state.turnOrder[nextIdx]].indicators<=0&&guard<len){nextIdx=(nextIdx+1)%len;if(nextIdx===0)state.round++;guard++}
  state.currentIndex=nextIdx;
  const np=state.players[state.turnOrder[nextIdx]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else state.message=np.name+' 的回合（第'+state.round+'轮），投掷骰子';state.messageType='';
};

window.G.g3SettleTavern=function(tv){
  const groups={};
  Object.entries(tv.hits).forEach(([id,c])=>{if(c>0){if(!groups[c])groups[c]=[];groups[c].push(id)}});
  const invalid=new Set();Object.values(groups).forEach(ids=>{if(ids.length>=2)ids.forEach(id=>invalid.add(id))});
  const valid=Object.entries(tv.hits).filter(([id,c])=>c>0&&!invalid.has(id)).sort((a,b)=>b[1]-a[1]);
  return{first:valid[0]?valid[0][0]:null,second:valid[1]?valid[1][0]:null};
};

window.G.g3EndGame=function(){
  state.phase='ended';
  let m=document.getElementById('g3GuardianModal');if(m)m.remove();
  Object.values(state.players).forEach(p=>p.g3coins=0);
  state.game.taverns.forEach(tv=>{const r=this.g3SettleTavern(tv);if(r.first)state.players[r.first].g3coins+=tv.topGold;if(r.second)state.players[r.second].g3coins+=tv.bottomGold});
  const personalGold={};Object.entries(state.players).forEach(([id,p])=>personalGold[id]=p.g3coins);
  let bc=0,rc=0;Object.values(state.players).forEach(p=>{if(p.team==='blue')bc+=p.g3coins;else rc+=p.g3coins});

const G4_DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];
window.G.g4PowerPos=0;window.G.g4PowerDir=1;window.G.g4PowerLocking=false;window.G.g4PowerTimer=null;window.G.g4Rolling=false;

window.G.initG4=function(){
  const blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue').map(([id])=>id);
  const reds=Object.entries(state.players).filter(([_,p])=>p.team==='red').map(([id])=>id);
  state._blues=blues;state._reds=reds;
  state.game={enemy:{name:'🐉 龙蛋',hp:50,maxHp:50,counter:false},lastAction:null,coinflip:null};
  // 使用preGame猜大小的结果
  const firstTeam=state.firstTeam||'blue';
  const first=firstTeam==='blue'?blues:reds;
  const second=firstTeam==='blue'?reds:blues;
  const order=[];const mx=Math.max(first.length,second.length);
  for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
  state.turnOrder=order;state.currentIndex=0;state.round=1;
  state.phase='playing';
  state.message=(firstTeam==='blue'?'🔵蓝队':'🔴红队')+' 先行动！'+playerName(order[0])+' 的回合';state.messageType='good';
  document.getElementById('gameInfo').innerHTML='<span>第 <b id="g4Round">1</b> 轮</span><span id="g4Turn"></span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small btn-red" onclick="G.hostActionG4(null,\'skip\')">跳过断线玩家</button>';
  this.g4PowerLocking=false;this.g4Rolling=false;this.g4StopPower();
};

window.G.renderG4=function(){
  if(!state.game)return;const g=state.game;
  document.getElementById('g4Round').textContent=state.round;
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){const cp=state.players[curId];document.getElementById('g4Turn').innerHTML=`当前：<b style="color:${cp.team==='blue'?'#64b5f6':'#ef9a9a'}">${cp.name}</b>${cp.online?'':'（离线⏸️）'}`}
  const e=g.enemy;
  let html=`<div class="g4-enemy"><div class="g4-enemy-name">${e.name}</div><div class="g4-hp-bar"><div class="g4-hp-fill" style="width:${Math.max(0,(e.hp/e.maxHp)*100)}%">${e.hp}/${e.maxHp}</div></div></div>`;
  // 比大小阶段
  if(state.phase==='coinflip'){
    const cf=g.coinflip||{};
    html+='<div class="g4-roll-area"><div class="g4-msg">'+(cf.done?`🔵蓝队 ${cf.blue}点 · 🔴红队 ${cf.red}点${cf.winner==='tie'?' — 平局！':''}`:'等待主持人投骰比大小...')+'</div>';
    if(isHost)html+=`<button class="btn" onclick="G.hostActionG4(null,{type:'coinflip'})">${cf.done&&cf.winner==='tie'?'平局！再投一次':'投骰比大小'}</button>`;
    else html+='<button class="btn" disabled>等待主持人...</button>';
    html+='</div>';
    // 靶盘
    html+=this.g4TargetHTML(null);
    document.getElementById('gameArea').innerHTML=html;return;
  }
  // 靶盘
  html+=this.g4TargetHTML(g.lastAction);
  // 结果
  if(g.lastAction&&g.lastAction.resolved){
    const la=g.lastAction;
    if(la.result.type==='hit')html+=`<div class="g4-result"><span class="hit">${la.playerName} 命中 ${la.result.ring}环</span> · <span class="dmg">-${la.result.damage} HP</span></div>`;
    else html+=`<div class="g4-result"><span class="miss">${la.playerName} ${la.result.subtype==='hole'?'投进黑洞':'脱靶'}！未命中</span></div>`;
  }
  html+=`<div class="g4-msg ${state.messageType||''}">${state.message||''}</div>`;
  // 力度条
  const showPower=!isHost&&curId===myPeerId&&state.phase==='playing'&&!this.g4Rolling&&this.g4PowerLocking;
  html+=`<div class="g4-power-wrap" id="g4PowerWrap" style="display:${showPower?'block':'none'}"><div class="g4-power">
    <div class="g4-pz miss"></div><div class="g4-pz hole"></div><div class="g4-pz r1"></div><div class="g4-pz r3"></div><div class="g4-pz r5"></div><div class="g4-pz r7"></div><div class="g4-pz r9"></div><div class="g4-pz r10"></div>
    <div class="g4-pointer" id="g4Pointer" style="left:0%"></div></div><div class="g4-plabels"><span>脱靶</span><span>黑洞</span><span>1环</span><span>5环</span><span>10环</span></div></div>`;
  // 按钮
  html+='<div class="g4-roll-area">';
  if(state.phase==='playing'){
    if(isHost)html+='<button class="btn" disabled>观战中</button>';
    else if(!curId||!state.players[curId].online)html+='<button class="btn" disabled>等待重连...</button>';
    else if(curId===myPeerId){
      if(this.g4Rolling)html+='<button class="btn" disabled>投掷中...</button>';
      else if(this.g4PowerLocking)html+='<button class="btn" id="g4LockBtn" onclick="G.g4Lock()">🎯 锁定！</button>';
      else html+='<button class="btn" id="g4StartBtn" onclick="G.g4StartPower()">🎲 投掷骰子</button>';
    }else html+='<button class="btn" disabled>等待对手...</button>';
  }else html+='<button class="btn" disabled>游戏已结束</button>';
  html+='</div>';
  document.getElementById('gameArea').innerHTML=html;
  if(showPower)this.g4StartAnim();
};

  if(la&&!la.resolved){diceClass='g4-tdice';diceStyle=`left:${la.result.x}%;top:${la.result.y}%`;diceContent=G4_DICE[la.diceFace-1]}
  return `<div class="g4-target"><div class="g4-twrap"><svg class="g4-tsvg" viewBox="0 0 200 200">

window.G.g4StartPower=function(){
  this.g4PowerLocking=true;this.g4PowerPos=0;
  this.renderG4();
  setTimeout(()=>document.getElementById('g4PowerWrap')&&document.getElementById('g4PowerWrap').scrollIntoView({behavior:'smooth',block:'center'}),100);

window.G.g4StartAnim=function(){
  this.g4StopPower();
  this.g4PowerTimer=setInterval(()=>{
    this.g4PowerPos+=3.5;
    if(this.g4PowerPos>=100){this.g4PowerPos=0}
    const pt=document.getElementById('g4Pointer');if(pt)pt.style.left=this.g4PowerPos+'%';
  },20);
};
window.G.g4StopPower=function(){if(this.g4PowerTimer){clearInterval(this.g4PowerTimer);this.g4PowerTimer=null}};
window.G.g4Lock=function(){
  this.g4StopPower();this.g4PowerLocking=false;
  const power=Math.round(this.g4PowerPos);
  if(isHost){this.actionG4(myPeerId,{type:'lockPower',power})}
  else{sendAction({type:'lockPower',power})}
};

window.G.actionG4=function(peerId,action){
  if(action.type==='lockPower'&&state.phase==='playing'){
    if(state.turnOrder[state.currentIndex]!==peerId||!state.players[peerId].online)return;
    this.g4DoRoll(action.power);
  }
};

window.G.hostActionG4=function(peerId,action){
  if(action.type==='coinflip'&&state.phase==='coinflip'){
    const b=1+Math.floor(Math.random()*6),r=1+Math.floor(Math.random()*6);
    state.game.coinflip={blue:b,red:r,done:true};
    if(b>r)state.game.coinflip.winner='blue';else if(r>b)state.game.coinflip.winner='red';else state.game.coinflip.winner='tie';
    if(state.game.coinflip.winner!=='tie'){
      const first=state.game.coinflip.winner==='blue'?state._blues:state._reds;
      const second=state.game.coinflip.winner==='blue'?state._reds:state._blues;
      const order=[];const mx=Math.max(first.length,second.length);
      for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
      state.turnOrder=order;state.currentIndex=0;state.phase='playing';
      state.message=(state.game.coinflip.winner==='blue'?'🔵蓝队':'🔴红队')+' 先行动！'+playerName(order[0])+' 的回合';state.messageType='good';
    }else state.message='平局！再投一次';state.messageType='warn';
    broadcastState();this.renderG4();
  }else if(action==='skip'&&state.phase==='playing'){
    state.message='主持人跳过了 '+state.players[state.turnOrder[state.currentIndex]].name;state.messageType='warn';
    this.g4NextTurn();broadcastState();this.renderG4();
  }
};

window.G.g4DoRoll=function(power){
  if(this.g4Rolling)return;this.g4Rolling=true;
  const curId=state.turnOrder[state.currentIndex];
  const p=Math.max(0,Math.min(100,power));
  let result;
  if(p<8){result={type:'miss',subtype:'offtarget',ring:0,damage:0,x:50+Math.random()*100,y:50+Math.random()*100}}
  else if(p<16){const holes=[{x:27.5,y:35},{x:72.5,y:35},{x:27.5,y:65},{x:72.5,y:65}];const h=holes[Math.floor(Math.random()*holes.length)];result={type:'miss',subtype:'hole',ring:0,damage:0,x:h.x,y:h.y}}
  else{
    const ring=Math.max(1,Math.min(10,Math.round((p-16)/84*9)+1));
    const radius=(10-ring)*4.5+2;const angle=Math.random()*Math.PI*2;
    result={type:'hit',ring:ring,damage:ring,x:Math.max(5,Math.min(95,50+radius*Math.cos(angle))),y:Math.max(5,Math.min(95,50+radius*Math.sin(angle)))};
  }
  const diceFace=1+Math.floor(Math.random()*6);
  state.game.lastAction={playerId:curId,playerName:playerName(curId),result,diceFace};
  state.message=playerName(curId)+' 投掷骰子！';state.messageType='';
  broadcastState();this.renderG4();
  setTimeout(()=>{
    const pl=state.players[curId];const enemy=state.game.enemy;
    if(result.type==='hit'){enemy.hp=Math.max(0,enemy.hp-result.damage);state.message=`${pl.name} 命中 ${result.ring}环！造成 ${result.damage} 点伤害`;state.messageType='good'}
    else{state.message=`${pl.name} ${result.subtype==='hole'?'投进黑洞！':'脱靶！'}未命中`;state.messageType='warn'}
    state.game.lastAction.resolved=true;this.g4Rolling=false;
    broadcastState();this.renderG4();
    if(enemy.hp<=0)setTimeout(()=>this.g4EndGame(),1200);
    else setTimeout(()=>{this.g4NextTurn();broadcastState();this.renderG4()},1200);
  },800);
};

window.G.g4NextTurn=function(){
  const len=state.turnOrder.length;if(len===0)return;
  let nextIdx=(state.currentIndex+1)%len;if(nextIdx<=state.currentIndex)state.round++;
  state.currentIndex=nextIdx;
  const np=state.players[state.turnOrder[nextIdx]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else{state.message=np.name+' 的回合（第'+state.round+'轮），点击投掷';state.messageType=''}
};

window.G.g4EndGame=function(){
  state.phase='ended';
  const curId=state.turnOrder[state.currentIndex];
  const winTeam=state.players[curId].team;
  const winner=winTeam==='blue'?'🔵 蓝队获胜！':'🔴 红队获胜！';
  gameOver({winner});
};

window.G.initG5=function(){
  const shuffled=[...G5_SKILLS].sort(()=>Math.random()-0.5);
  const blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue').map(([id])=>id);
  const reds=Object.entries(state.players).filter(([_,p])=>p.team==='red').map(([id])=>id);
  state._blues=blues;state._reds=reds;
  const _discardPool=[...G5_SKILLS].sort(()=>Math.random()-0.5).slice(0,4).map(s=>s.id);
  state.game={skillPools:{0:shuffled.slice(0,8).map(s=>s.id),8:shuffled.slice(8,16).map(s=>s.id),16:shuffled.slice(16,24).map(s=>s.id)},discarded:_discardPool,duel:null,roundSummary:null,globalExactStop:false,coinflip:null,pendingSkillChange:null,pendingTargetChoice:null,pendingPrediction:null,lastRoll:undefined,debuff:null};
  // 使用preGame猜大小的结果
  const firstTeam=state.firstTeam||'blue';
  const first=firstTeam==='blue'?blues:reds;
  const second=firstTeam==='blue'?reds:blues;
  const order=[];const mx=Math.max(first.length,second.length);
  for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
  state.turnOrder=order;state.currentIndex=0;state.round=1;state.skillSelectIndex=0;state.game.skillPoolKey=0;
  Object.values(state.players).forEach(p=>{p.pos=0;p.hp=9;p.skill=null;p.skillUsed=false;p.skipNext=false;p.extraTurn=false;p.predictedWinner=null;p.dead=false;p.skillChangeUsed={};p._rerollCount=0;p._copiedSkill=false;p._shadowTarget=null});
  state.phase='skillselect';
  state.message=(firstTeam==='blue'?'🔵蓝队':'🔴红队')+'先手！抽取初始技能';state.messageType='good';
  document.getElementById('gameInfo').innerHTML='<span>第 <b id="g5Round">1</b> 轮</span><span id="g5Turn"></span><span id="g5Phase" class="g5-phase"></span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small btn-red" onclick="G.hostActionG5(null,\'skip\')">跳过断线玩家</button> <button class="btn btn-small btn-gray" onclick="G.g5ShowSkillPool()">技能池总览</button>';
};

window.G.renderG5=function(){
  if(!state.game)return;const g=state.game;
  document.getElementById('g5Round').textContent=state.round;
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){const cp=state.players[curId];document.getElementById('g5Turn').innerHTML='当前：<b style="color:'+(cp.team==='blue'?'#64b5f6':'#ef9a9a')+'">'+cp.name+'</b>'+(cp.online?'':'（离线⏸️）')}
  let phaseText='';
  if(state.phase==='playing'&&curId){const pos=state.players[curId].pos;phaseText=pos>=16?'第三阶段·石像守卫':pos>=8?'第二阶段·落石':'第一阶段·巨龙吐息'}
  document.getElementById('g5Phase').textContent=phaseText;
  let html='<div class="g5-layout"><div class="g5-map-section"><div class="g5-map">';
  for(let i=0;i<=G5_FINISH;i++){
    let cls='g5-cell';if(i===0)cls+=' start';if(i===G5_FINISH)cls+=' end';if(G5_SKILL_POINTS.includes(i))cls+=' skillpoint';if(G5_ROCK.includes(i))cls+=' rock';if(!G5_SKILL_POINTS.includes(i)&&!G5_ROCK.includes(i)&&i!==0&&i!==G5_FINISH)cls+=' empty';
    const here=Object.entries(state.players).filter(([_,p])=>!p.dead&&p.pos===i);
    let dots='';here.forEach(([id,p])=>{const c=CHARACTERS.find(ch=>ch.id===p.character);dots+='<div class="g5-pdot '+p.team+'" title="'+p.name+'">'+(c?'<img src="'+c.img+'">':p.name.charAt(0))+'</div>'});
    let label=i===0?'🏰 起点':i===G5_FINISH?'🚪 终点':G5_SKILL_POINTS.includes(i)?'📜 技能':G5_ROCK.includes(i)?'🪨 落石':'';
    html+='<div class="'+cls+'"><div class="g5-cell-num">'+i+'</div><div class="g5-cell-label">'+label+'</div><div class="g5-cell-dots">'+dots+'</div></div>';
  }
  html+='</div></div><div class="g5-players-section"><div class="g5-players">';
  state.turnOrder.forEach(id=>{
    const p=state.players[id];if(!p)return;
    const c=CHARACTERS.find(ch=>ch.id===p.character);
    const sk=p.skill?G5_SKILLS.find(s=>s.id===p.skill):null;
    const myTeam=state.players[myPeerId]?state.players[myPeerId].team:null;
    const canSeeSkill=isHost||p.team===myTeam||id===myPeerId;
    const skillHtml=p.skill?(canSeeSkill?'📜'+p.skill+'<span>'+(sk?sk.desc:'')+'</span>':'📜 '+p.skill):'无技能';
    html+='<div class="g5-pcard '+(id===curId&&state.phase==='playing'?'active':'')+' '+(p.dead?'dead':'')+'"><div class="g5-pcard-head"><span class="'+p.team+'">'+(c?'<img src="'+c.img+'">':'')+(p.team==='blue'?'🔵':'🔴')+' '+p.name+(id===myPeerId?'(你)':'')+'</span><span>❤️'+p.hp+' 💰'+(p.gold||0)+'</span></div><div class="g5-pcard-pos">位置：'+p.pos+'格'+(p.dead?' 💀':'')+'</div><div class="g5-pcard-skill">'+skillHtml+'</div></div>';
  });
  html+='</div></div><div class="g5-msg '+(state.messageType||'')+'">'+(state.message||'')+'</div><div class="g5-action"><div class="g5-dice-display" id="g5DiceDisplay"></div><div id="g5Buttons"></div></div>';
  // 操作特效
  if(g.lastEffect){
    const fx=g.lastEffect;
    let fxIcon,fxColor,fxClass;
    if(fx.skillId&&G5_SKILL_FX[fx.skillId]){
      const s=G5_SKILL_FX[fx.skillId];
      fxIcon=s.icon;fxColor=s.color;fxClass='g5-fx-skill';
    }else{
      fxIcon={damage:'💔',combat:'⚔️',rock:'🪨',dragon:'🐉'}[fx.type]||'✨';
      fxColor=fx.type==='damage'?'#ff4444':fx.type==='combat'?'#ff9800':fx.type==='rock'?'#a0522d':fx.type==='dragon'?'#ff6347':'#e8c86a';
      fxClass='g5-fx-'+(fx.type||'normal');
    }
    html+=`<div class="g5-fx-overlay"><div class="g5-fx-box ${fxClass}" style="--fx-color:${fxColor}"><div class="g5-fx-icon" style="color:${fxColor}">${fxIcon}</div><div class="g5-fx-text" style="color:${fxColor}">${fx.text}</div><div class="g5-fx-sub">${fx.sub}</div></div></div>`;
  }
  document.getElementById('gameArea').innerHTML=html;
  this.g5RenderButtons();
  if(g.duel)this.g5RenderDuel();else{let m=document.getElementById('g5DuelModal');if(m)m.remove()}
  if(g.roundSummary)this.g5RenderSummary();else{let m=document.getElementById('g5SumModal');if(m)m.remove()}
  this.g5CheckModals();
  // 特效2秒后自动清除
  if(g.lastEffect){const fx=g.lastEffect;setTimeout(()=>{if(state.game&&state.game.lastEffect===fx){state.game.lastEffect=null;broadcastState();this.renderG5()}},2000)}
};

window.G.g5RenderButtons=function(){

  if(state.phase==='skillselect'){dice.innerHTML='<span style="font-size:13px;color:#a08060">技能选择阶段</span>';return}

  if(g.duel){dice.innerHTML='<span style="font-size:14px;color:var(--gold-light)">⚔️ 决斗中...</span>';return}

  if(typeof g.lastRoll==='number')dice.innerHTML=G5_DICE[g.lastRoll-1]+' <span style="font-size:14px">('+g.lastRoll+')</span>';

    else btns.innerHTML+='<button class="btn btn-gray" style="margin-left:8px" onclick="sendAction({type:\'endTurn\'})">跳过</button>';
    return;
  }

    if(typeof g.lastRoll!=='number')btns.innerHTML='<button class="btn" onclick="sendAction({type:\'roll\'})">🎲 投掷骰子</button>';

  if(p.skill&&!p.skillUsed&&typeof g.lastRoll!=='number'){

  else if(g.pendingSkillChoice&&g.pendingSkillChoice.playerId===myPeerId&&!isHost)this.g5ShowDiscardSelect();
  else if(g.pendingTargetChoice&&g.pendingTargetChoice.playerId===myPeerId&&!isHost)this.g5ShowTargetChoice();
  else if(g.pendingPrediction&&g.pendingPrediction.playerId===myPeerId&&!isHost)this.g5ShowPrediction();
  else if(g.pendingWinnerPrediction&&g.pendingWinnerPrediction.playerId===myPeerId&&!isHost)this.g5ShowWinnerPrediction();

  });
  html+='<div style="margin-bottom:10px"><div style="color:#7bc47f;font-weight:bold;font-size:12px">✅已领取</div>';
  Object.entries(taken).forEach(([sid,n])=>html+='<div style="font-size:10px;padding:2px 0">'+sid+' → '+n+'</div>');
  html+='</div>';
  if(state.game.discarded.length){html+='<div><div style="color:#d46a6a;font-weight:bold;font-size:12px">🗑️弃牌堆</div>';state.game.discarded.forEach(sid=>html+='<div style="font-size:10px">'+sid+'</div>');html+='</div>'}
  this.g5ShowModal('📜 技能池总览',html);
};

window.G.actionG5=function(peerId,action){
  if(action.type==='roll'||action.type==='reroll'){
    if(state.phase!=='playing'||state.game.duel)return;
    if(state.turnOrder[state.currentIndex]!==peerId||!state.players[peerId].online)return;
    this.g5DoRoll(peerId,action.type==='reroll',action.prediction);
  }else if(action.type==='useSkill'){this.g5DoUseSkill(peerId,action.skillId)}
  else if(action.type==='endTurn'){this.g5EndTurn(peerId)}
  else if(action.type==='duel'){this.g5StartDuel(peerId,action.targetId)}
  else if(action.type==='skipDuel'){
    const p=state.players[peerId];p.gold=Math.max(0,(p.gold||0)-5);
    state.game.pendingDuel=null;
    state.message=playerName(peerId)+' 拒绝决斗，被石像收取5金币！';
    state.messageType='warn';
    state.game.lastEffect={type:'damage',playerName:p.name,text:'-5💰 胆小鬼惩罚',sub:'石像惩罚'};
    this.g5EndTurn(peerId);
  }
  else if(action.type==='duelRoll'){this.g5DuelRoll(peerId)}
  else if(action.type==='selectSkill'){
    if(state.phase==='skillselect'&&state.turnOrder[state.skillSelectIndex||0]===peerId)this.g5DoSelectSkill(peerId,action.skillId);
    else if(state.game.pendingSkillChange&&state.game.pendingSkillChange.playerId===peerId)this.g5DoSkillChange(peerId,action.skillId);
    else if(state.game.pendingSkillChoice&&state.game.pendingSkillChoice.playerId===peerId)this.g5DoSelectDiscard(peerId,action.skillId);
  }else if(action.type==='chooseTarget'){
    if(state.game.pendingTargetChoice&&state.game.pendingTargetChoice.playerId===peerId)this.g5ResolveTarget(peerId,action.targetId);
  }else if(action.type==='pickWinner'){
    if(state.game.pendingWinnerPrediction&&state.game.pendingWinnerPrediction.playerId===peerId){state.players[peerId].predictedWinner=action.targetId;state.game.pendingWinnerPrediction=null;state.message=playerName(peerId)+' 预测'+playerName(action.targetId)+'获胜';broadcastState();this.renderG5()}
  }else if(action.type==='pickLeader'){
    if(state.game.pendingLeaderCopy&&state.game.pendingLeaderCopy.playerId===peerId){const p=state.players[peerId];const src=state.players[action.targetId];if(src&&src.skill){p.skill=src.skill;state.message=playerName(peerId)+' 魁首仿酿酒复制了'+src.name+'的'+src.skill}state.game.pendingLeaderCopy=null;broadcastState();this.renderG5()}
  }
};

// G6 最终机制动作处理
window.G.actionG6=function(peerId,action){
  if(action.type==='g6route'){this.g6SelectRoute(peerId,action.route)}
  else if(action.type==='g6move'){this.g6Move(peerId)}
  else if(action.type==='g6combat'){this.g6ResolveCombat(peerId,action)}
};

window.G.hostActionG5=function(peerId,action){
  if(action.type==='coinflip'&&state.phase==='coinflip'){
    const b=1+Math.floor(Math.random()*6),r=1+Math.floor(Math.random()*6);
    state.game.coinflip={blue:b,red:r,done:true,winner:b>r?'blue':r>b?'red':'tie'};
    if(state.game.coinflip.winner!=='tie'){
      const first=state.game.coinflip.winner==='blue'?state._blues:state._reds;
      const second=state.game.coinflip.winner==='blue'?state._reds:state._blues;
      const order=[];const mx=Math.max(first.length,second.length);
      for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
      state.turnOrder=order;state.phase='skillselect';state.skillSelectIndex=0;state.game.skillPoolKey=0;
      state.message=(state.game.coinflip.winner==='blue'?'🔵蓝队':'🔴红队')+'先手！抽取初始技能';state.messageType='good';
    }else state.message='平局！再投一次';state.messageType='warn';
    broadcastState();this.renderG5();
  }else if(action==='skip'&&state.phase==='playing'){
    state.message='主持人跳过了 '+playerName(state.turnOrder[state.currentIndex]);state.messageType='warn';
    state.game.pendingTargetChoice=null;state.game.pendingSkillChange=null;state.game.pendingPrediction=null;
    this.g5EndTurn(state.turnOrder[state.currentIndex]);
  }
};

window.G.g5DoSelectSkill=function(playerId,skillId){
  const poolKey=state.game.skillPoolKey||0;const idx=state.game.skillPools[poolKey].indexOf(skillId);if(idx<0)return;
  const p=state.players[playerId];
  if(p.skill)state.game.discarded.push(p.skill);
  p.skill=skillId;state.game.skillPools[poolKey].splice(idx,1);p.skillChangeUsed[poolKey]=true;
  this.g5OnSkillAcquire(playerId,skillId);
  state.skillSelectIndex=(state.skillSelectIndex||0)+1;
  if(state.skillSelectIndex>=state.turnOrder.length){
    state.phase='playing';state.currentIndex=0;state.round=1;
    state.message=playerName(state.turnOrder[0])+' 的回合，投掷骰子';state.messageType='';
  }else state.message='轮到 '+playerName(state.turnOrder[state.skillSelectIndex])+' 选择技能';
  broadcastState();this.renderG5();
};

window.G.g5DoSelectDiscard=function(playerId,skillId){
  const g=state.game;const idx=g.discarded.indexOf(skillId);if(idx<0)return;
  const p=state.players[playerId];
  if(p.skill)g.discarded.push(p.skill);
  p.skill=skillId;g.discarded.splice(idx,1);p.skillUsed=true;
  this.g5OnSkillAcquire(playerId,skillId);
  g.pendingSkillChoice=null;state.message=playerName(playerId)+' 从弃牌堆获得'+skillId;state.messageType='good';
  broadcastState();this.renderG5();
};

window.G.g5DoSkillChange=function(playerId,skillId){
  const g=state.game;const poolKey=g.pendingSkillChange.poolKey;const idx=g.skillPools[poolKey].indexOf(skillId);if(idx<0)return;
  const p=state.players[playerId];
  p.skill=skillId;g.skillPools[poolKey].splice(idx,1);p.skillChangeUsed[poolKey]=true;
  this.g5OnSkillAcquire(playerId,skillId);
  g.pendingSkillChange=null;state.message=playerName(playerId)+' 在'+poolKey+'格更换为'+skillId;state.messageType='good';
  broadcastState();this.renderG5();this.g5AfterMove(playerId,0);
};

window.G.g5OnSkillAcquire=function(playerId,skillId){
  const p=state.players[playerId];const g=state.game;
  if(skillId==='恰好止步酒'){g.globalExactStop=true;g.lastEffect={skillId:'恰好止步酒',text:'全局：必须正好冲线',sub:p.name+' 获得恰好止步酒'}}
  if(skillId==='次席预言酒'){g.pendingWinnerPrediction={playerId};state.message=playerName(playerId)+' 请预测获胜者';g.lastEffect={skillId:'次席预言酒',text:'请预测获胜者',sub:p.name+' 获得次席预言酒'}}
  if(skillId==='魁首仿酿酒'){
    const alive=Object.values(state.players).filter(pl=>!pl.dead&&pl.skill&&pl!==p);
    if(alive.length){const maxPos=Math.max(...alive.map(pl=>pl.pos));const leaders=alive.filter(pl=>pl.pos===maxPos);
      if(leaders.length===1){p.skill=leaders[0].skill;state.message+=' | 魁首仿酿酒复制了'+leaders[0].name+'的技能';g.lastEffect={skillId:'魁首仿酿酒',text:'复制领先者技能：'+leaders[0].skill,sub:p.name+' 魁首仿酿酒生效'}}
      else{g.pendingLeaderCopy={playerId,candidates:leaders.map(pl=>({id:state.turnOrder.find(tid=>state.players[tid]===pl),name:pl.name,skill:pl.skill}))};state.message=playerName(playerId)+' 魁首仿酿酒：选择复制谁的技能';g.lastEffect={skillId:'魁首仿酿酒',text:'选择复制谁的技能',sub:p.name+' 魁首仿酿酒生效'}}
    }
  }
};

window.G.g5DoRoll=function(playerId,isReroll,prediction){
  const p=state.players[playerId];const g=state.game;
  if(p.skillUsed&&!isReroll)return;
  g.pendingPrediction=null;
  // 附影随行酒：移动前标记起点同格的附影玩家
  Object.entries(state.players).forEach(([id,pl])=>{if(!pl.dead&&pl.skill==='附影随行酒'&&id!==playerId&&pl.pos===p.pos){pl._shadowTarget=playerId}});
  let roll=1+Math.floor(Math.random()*6);g.lastRoll=roll;
  if(g.debuff&&g.debuff[playerId]){roll=Math.max(1,roll-1);delete g.debuff[playerId]}
  let steps=roll<=2?1:roll<=4?2:3;
  if(p.skill==='逆袭苦艾酒'&&roll===1){steps=2;g.lastEffect={skillId:'逆袭苦艾酒',text:'逆袭！投1移动2格',sub:p.name+' 触发逆袭苦艾酒'}}
  if(p.skill==='骄傲兔子酒'){
    const maxPos=Math.max(...Object.values(state.players).filter(pl=>!pl.dead).map(pl=>pl.pos));
    const leaders=Object.values(state.players).filter(pl=>!pl.dead&&pl.pos===maxPos);
    if(leaders.length===1&&leaders[0]===p){state.message=playerName(playerId)+' 独自领先，骄傲兔子酒跳过移动！';state.messageType='warn';g.lastEffect={skillId:'骄傲兔子酒',text:'独自领先，跳过本回合',sub:p.name+' 骄傲兔子酒生效'};g.lastSteps=0;p.skillUsed=true;this.g5AfterMove(playerId,0);return}
    steps+=2;g.lastEffect={skillId:'骄傲兔子酒',text:'步数+2',sub:p.name+' 骄傲兔子酒生效'};
  }
  if(p.skill==='派对小扎啤'||Object.values(state.players).some(pl=>!pl.dead&&pl.skill==='派对小扎啤'&&pl.pos===p.pos&&pl!==p)){const same=Object.values(state.players).filter(pl=>!pl.dead&&pl.pos===p.pos).length;if(same>=2){steps+=1;g.lastEffect={skillId:'派对小扎啤',text:'同格加成+1步',sub:p.name+' 派对小扎啤生效'}}}
  if(p.skill==='狂飙忘忧酒'&&p.skillActive){steps*=2;p.skipNext=true}
  const hasLuoXia=Object.values(state.players).some(pl=>!pl.dead&&pl.skill==='落井下石酒'&&pl!==p);
  let extraMsg='';
  if(roll===1&&hasLuoXia){
    steps=0;
    Object.entries(state.players).forEach(([id,pl])=>{
      if(!pl.dead&&pl.skill==='落井下石酒'&&id!==playerId){
        pl.pos=Math.min(G5_FINISH,pl.pos+1);
        extraMsg+=' | '+playerName(id)+'落井下石+1格，'+playerName(playerId)+'被跳过';
        g.lastEffect={skillId:'落井下石酒',text:playerName(playerId)+'被跳过，'+playerName(id)+'+1格',sub:playerName(id)+' 落井下石酒生效'};
      }
    });
  }else if(roll===1){
    Object.entries(state.players).forEach(([id,pl])=>{
      if(!pl.dead&&pl.skill==='落井下石酒'&&id!==playerId){
        pl.pos=Math.min(G5_FINISH,pl.pos+1);
        extraMsg+=' | '+playerName(id)+'落井下石+1格';
        g.lastEffect={skillId:'落井下石酒',text:playerName(id)+'+1格',sub:playerName(id)+' 落井下石酒生效'};
      }
    });
  }
  if(roll===6){
    Object.entries(state.players).forEach(([id,pl])=>{
      if(!pl.dead&&pl.skill==='有福同享佳酿'&&id!==playerId){
        pl.pos=Math.min(G5_FINISH,pl.pos+2);
        extraMsg+=' | '+playerName(id)+'有福同享+2格';
        g.lastEffect={skillId:'有福同享佳酿',text:playerName(id)+'+2格',sub:playerName(id)+' 有福同享佳酿生效'};
      }
    });
  }
  if(prediction&&prediction===roll)p.extraTurn=true;
  g.lastSteps=steps;
  if(!(p.skill==='再投双杯酿'&&roll===6))p.skillUsed=true;
  state.message=playerName(playerId)+' 投出 '+G5_DICE[roll-1]+'('+roll+')，移动'+steps+'格'+extraMsg;state.messageType='';
  this.g5ExecuteMove(playerId,steps);this.g5AfterMove(playerId,steps);
};

window.G.g5ExecuteMove=function(playerId,steps){
  const p=state.players[playerId];const startPos=p.pos;let targetPos=p.pos+steps;
  if(state.game.globalExactStop&&targetPos>G5_FINISH){state.message+='（恰好止步酒生效）';return}
  targetPos=Math.min(G5_FINISH,targetPos);
  if(p.skill==='蛙跳青柠酒'){let pos=p.pos;for(let i=0;i<steps;i++){pos++;if(pos>G5_FINISH)break;if(Object.values(state.players).some(pl=>!pl.dead&&pl.pos===pos&&pl!==p))pos++}targetPos=Math.min(G5_FINISH,pos);state.game.lastEffect={skillId:'蛙跳青柠酒',text:'跳过有人格',sub:p.name+' 蛙跳青柠酒生效'}}
  const passed=[];
  for(let pos=startPos+1;pos<targetPos;pos++){
    Object.entries(state.players).forEach(([id,pl])=>{
      if(!pl.dead&&pl.pos===pos&&id!==playerId){
        passed.push(id);
        if(pl.skill==='当关烈酒'){
          targetPos=pos;
          state.game.lastEffect={skillId:'当关烈酒',text:'被当关烈酒拦下',sub:pl.name+' 当关烈酒生效'};
        }
        if(pl.skill==='踏风者烈酿'){
          targetPos=Math.max(startPos,targetPos-2);
          state.message+=' | 踏风者：'+playerName(playerId)+'被'+pl.name+'退后2格';
          state.game.lastEffect={skillId:'踏风者烈酿',text:playerName(playerId)+'退后2格',sub:pl.name+' 踏风者烈酿生效'};
        }
      }
    });
  }
  p.pos=targetPos;
};

window.G.g5AfterMove=function(playerId,steps){
  const p=state.players[playerId];const g=state.game;
  const stinkyPlayers=Object.values(state.players).filter(pl=>!pl.dead&&pl.pos===p.pos&&pl!==p&&pl.skill==='恶臭黑啤');
  if(stinkyPlayers.length){p.hp-=1;this.g5CheckDeathObj(p);state.message+=' | 恶臭黑啤：同格-1血';state.game.lastEffect={skillId:'恶臭黑啤',text:p.name+' -1血',sub:stinkyPlayers.map(pl=>pl.name).join('、')+' 恶臭黑啤生效',type:'damage',playerName:p.name}}
  Object.entries(state.players).forEach(([id,pl])=>{if(!pl.dead&&pl.skill==='投机者特调'&&id!==playerId&&pl.pos===p.pos){p.pos=Math.max(0,p.pos-1);state.message+=' | 投机者：'+playerName(id)+'使你后退1格';state.game.lastEffect={skillId:'投机者特调',text:'落地者后退1格',sub:pl.name+' 投机者特调生效'}}});
  const cellCount=Object.values(state.players).filter(pl=>!pl.dead&&pl.pos===p.pos).length;
  if(cellCount===1){
    Object.entries(state.players).forEach(([id,pl])=>{
      if(!pl.dead&&pl.skill==='孤独者陈酿'&&id!==playerId){
        pl.pos=Math.min(G5_FINISH,pl.pos+1);
        state.game.lastEffect={skillId:'孤独者陈酿',text:'独占格+1',sub:pl.name+' 孤独者陈酿生效'};
      }
    });
  }
  const poolKey=G5_SKILL_POINTS.find(c=>p.pos===c);
  if(poolKey!==undefined&&g.skillPools[poolKey]&&g.skillPools[poolKey].length>0&&!p.skillChangeUsed[poolKey]){
    g.pendingSkillChange={playerId,poolKey};state.message=playerName(playerId)+' 到达技能更换点！';state.messageType='good';broadcastState();this.renderG5();return;
  }
  if(p.pos>=G5_FINISH){this.g5EndGame(playerId);return}
  const enemies=Object.entries(state.players).filter(([id,pl])=>!pl.dead&&pl.pos===p.pos&&pl.team!==p.team&&id!==playerId);
  if(enemies.length>0){
    const inPhase3=p.pos>=16;
    g.pendingDuel={playerId,targetId:enemies[0][0],forced:inPhase3};
    state.message+=inPhase3?' | 第三阶段：必须决斗！':' | 与'+playerName(enemies[0][0])+'同格，可决斗';
  }
  broadcastState();this.renderG5();
};

window.G.g5StartDuel=function(playerId,targetId){
  state.game.duel={playerA:playerId,playerB:targetId,rollA:null,rollB:null,phase:'waitA',winner:null};
  state.game.pendingDuel=null;
  state.game.lastEffect={type:'combat',playerName:playerName(playerId),text:'⚔️ 决斗开始！',sub:playerName(playerId)+' VS '+playerName(targetId)};
  broadcastState();this.renderG5();
};
window.G.g5DuelRoll=function(peerId){
  const d=state.game.duel;if(!d)return;
  if(d.phase==='waitA'&&peerId===d.playerA){d.rollA=1+Math.floor(Math.random()*6);d.phase='waitB';broadcastState();this.renderG5()}
  else if(d.phase==='waitB'&&peerId===d.playerB){d.rollB=1+Math.floor(Math.random()*6);d.phase='result';this.g5ResolveDuel();broadcastState();this.renderG5();setTimeout(()=>{if(!state.game.duel)return;const dd=state.game.duel;state.game.duel=null;const a=state.players[dd.playerA];if(a&&a.pos>=G5_FINISH){this.g5EndGame(dd.playerA);return}this.g5EndTurn(dd.playerA)},2500)}
};
window.G.g5HostDuelRoll=function(id){this.g5DuelRoll(id)};
window.G.g5ResolveDuel=function(){
  const d=state.game.duel;const a=state.players[d.playerA],b=state.players[d.playerB];
  if(d.rollA>d.rollB){a.pos=Math.min(G5_FINISH,a.pos+1);b.hp-=1;d.winner=d.playerA;state.message=playerName(d.playerA)+' 决斗胜利！('+d.rollA+'vs'+d.rollB+') +1格，'+playerName(d.playerB)+'-1血';state.messageType='good';state.game.lastEffect={type:'damage',playerName:playerName(d.playerB),text:'-1 血量',sub:playerName(d.playerA)+' 决斗击败 '+playerName(d.playerB)};if(a.skill==='胜者余酿酒'&&b.skill&&!a._copiedSkill){a.skill=b.skill;a._copiedSkill=true;this.g5OnSkillAcquire(d.playerA,b.skill);state.game.lastEffect={skillId:'胜者余酿酒',text:'复制败方技能：'+b.skill,sub:a.name+' 胜者余酿酒生效'}}this.g5CheckDeath(d.playerB)}
  else if(d.rollB>d.rollA){b.pos=Math.min(G5_FINISH,b.pos+1);a.hp-=1;d.winner=d.playerB;state.message=playerName(d.playerB)+' 决斗胜利！('+d.rollB+'vs'+d.rollA+') +1格，'+playerName(d.playerA)+'-1血';state.messageType='warn';state.game.lastEffect={type:'damage',playerName:playerName(d.playerA),text:'-1 血量',sub:playerName(d.playerB)+' 决斗击败 '+playerName(d.playerA)};this.g5CheckDeath(d.playerA)}
  else state.message='决斗平局('+d.rollA+'vs'+d.rollB+')';
};

window.G.g5DoUseSkill=function(playerId,skillId){
  const p=state.players[playerId];const g=state.game;if(p.skillUsed)return;
  if(skillId==='再投双杯酿'){if(g.lastRoll===undefined)return;p.skillUsed=true;p._rerollCount=(p._rerollCount||0)+1;if(p._rerollCount>2)return;g.lastEffect={skillId:'再投双杯酿',text:'重新投掷',sub:p.name+' 再投双杯酿生效'};this.g5DoRoll(playerId,true);return}
  if(skillId==='尾灯引路酒'){const alive=Object.entries(state.players).filter(([_,pl])=>!pl.dead);const minPos=Math.min(...alive.map(([_,pl])=>pl.pos));alive.filter(([_,pl])=>pl.pos===minPos).forEach(([id])=>{state.players[id].pos=Math.min(G5_FINISH,state.players[id].pos+2)});p.skillUsed=true;state.message=playerName(playerId)+' 尾灯引路：放弃移动，末尾玩家+2';state.messageType='good';g.lastEffect={skillId:'尾灯引路酒',text:'末尾玩家+2格',sub:p.name+' 尾灯引路酒生效'};broadcastState();this.renderG5();return}
  if(skillId==='凑桌传送酒'){const counts={};Object.values(state.players).forEach(pl=>{if(!pl.dead)counts[pl.pos]=(counts[pl.pos]||0)+1});const valid=Object.entries(counts).filter(([_,c])=>c===2).map(([pos])=>parseInt(pos));if(!valid.length)return;p.pos=valid[Math.floor(Math.random()*valid.length)];p.skillUsed=true;state.message=playerName(playerId)+' 凑桌传送至'+p.pos+'格';state.messageType='good';g.lastEffect={skillId:'凑桌传送酒',text:'传送至2人格',sub:p.name+' 凑桌传送酒生效'};this.g5AfterMove(playerId,0);return}
  if(skillId==='回收者神酿'){if(!g.discarded.length)return;g.pendingSkillChoice={playerId};state.message=playerName(playerId)+' 从弃牌堆选技能';g.lastEffect={skillId:'回收者神酿',text:'选择弃牌堆技能',sub:p.name+' 回收者神酿生效'};broadcastState();this.renderG5();return}
  if(skillId==='错位时空果酒'||skillId==='绊足黑啤'){g.pendingTargetChoice={playerId,skillId};state.message=playerName(playerId)+' 选择目标';g.lastEffect={skillId:skillId,text:'选择目标',sub:p.name+' '+skillId+'生效'};broadcastState();this.renderG5();return}
  if(skillId==='预言家陈酿'){g.pendingPrediction={playerId};state.message=playerName(playerId)+' 预测点数';g.lastEffect={skillId:'预言家陈酿',text:'预测投掷点数',sub:p.name+' 预言家陈酿生效'};broadcastState();this.renderG5();return}
  if(skillId==='狂飙忘忧酒'){p.skillActive=true;state.message=playerName(playerId)+' 狂飙忘忧：步数×2，下回合跳过';state.messageType='good';g.lastEffect={skillId:'狂飙忘忧酒',text:'步数×2，下回合跳过',sub:p.name+' 狂飙忘忧酒生效'};broadcastState();this.renderG5();return}
};

window.G.g5ResolveTarget=function(playerId,targetId){
  const p=state.players[playerId];const skill=state.game.pendingTargetChoice.skillId;
  if(skill==='错位时空果酒'){state.players[targetId].pos=p.pos;state.message=playerName(playerId)+' 错位时空：将'+playerName(targetId)+'传送到'+p.pos+'格'}
  else if(skill==='绊足黑啤'){if(!state.game.debuff)state.game.debuff={};state.game.debuff[targetId]=true;state.message=playerName(playerId)+' 绊足黑啤：'+playerName(targetId)+'下次-1'}
  p.skillUsed=true;state.game.pendingTargetChoice=null;state.messageType='good';broadcastState();this.renderG5();
};

window.G.g5EndTurn=function(playerId){
  const p=state.players[playerId];const g=state.game;
  p.skillUsed=false;p.skillActive=false;p._rerollCount=0;
  g.pendingDuel=null;g.lastRoll=undefined;g.pendingSkillChange=null;g.pendingTargetChoice=null;g.pendingPrediction=null;
  Object.entries(state.players).forEach(([id,pl])=>{
      if(!pl.dead&&pl.skill==='附影随行酒'&&id!==playerId&&pl._shadowTarget===playerId){
        pl.pos=p.pos;
        pl._shadowTarget=null;
        state.game.lastEffect={skillId:'附影随行酒',text:'传送至目标落点',sub:pl.name+' 附影随行酒生效'};
      }
    });
  const alive=Object.values(state.players).filter(pl=>!pl.dead);
  const aliveCount=alive.length;
  if(aliveCount<=1){const w=Object.entries(state.players).find(([_,pl])=>!pl.dead);if(w)this.g5EndGame(w[0]);return}
  if(p.extraTurn){p.extraTurn=false;state.message=playerName(playerId)+' 额外回合！';state.messageType='good';broadcastState();this.renderG5();return}
  this.g5NextTurn();broadcastState();this.renderG5();
};

window.G.g5NextTurn=function(){
  const g=state.game;const alive=state.turnOrder.filter(id=>!state.players[id].dead);if(!alive.length)return;
  g.lastRoll=undefined;
  let idx=state.turnOrder.indexOf(state.turnOrder[state.currentIndex]);
  let nextIdx=(idx+1)%state.turnOrder.length;let guard=0;
  while(state.players[state.turnOrder[nextIdx]].dead&&guard<state.turnOrder.length){nextIdx=(nextIdx+1)%state.turnOrder.length;guard++}
  state.currentIndex=nextIdx;
  if(nextIdx<=idx){
    state.round++;
    // 大回合结束：巨龙吐息（第一阶段末尾-1血）
    const alive=Object.values(state.players).filter(pl=>!pl.dead);
    if(alive.length){const minPos=Math.min(...alive.map(pl=>pl.pos));if(minPos<=7){const victims=alive.filter(pl=>pl.pos===minPos);victims.forEach(pl=>{pl.hp-=1;this.g5CheckDeathObj(pl)});state.message+=' | 巨龙吐息！末尾-1血';state.game.lastEffect={type:'dragon',playerName:victims.map(pl=>pl.name).join('、'),text:'🐉 巨龙吐息 -1血',sub:'末尾玩家被吐息击中'}}}
    // 大回合结束：落石（第二阶段9/12/15格-1血）
    const rockVictims=alive.filter(pl=>pl.pos>=8&&pl.pos<=15&&G5_ROCK.includes(pl.pos));
    rockVictims.forEach(pl=>{pl.hp-=1;this.g5CheckDeathObj(pl)});
    if(rockVictims.length){state.message+=' | 落石！'+rockVictims.map(pl=>pl.name).join('、')+'-1血';state.game.lastEffect={type:'rock',playerName:rockVictims.map(pl=>pl.name).join('、'),text:'🪨 落石 -1血',sub:'巨石砸中玩家'}}
    const summary=[];
    state.turnOrder.forEach(id=>{const pl=state.players[id];if(!pl)return;summary.push('<div class="g5-sum-player"><span class="'+pl.team+'">'+(pl.team==='blue'?'🔵':'🔴')+' '+pl.name+'</span><span>位置'+pl.pos+' · ❤️'+pl.hp+' · 💰'+(pl.gold||0)+(pl.dead?' · 💀':'')+(pl.skill?' · 📜'+pl.skill:'')+'</span></div>')});
    g.roundSummary={round:state.round-1,html:summary.join('')};
  }
  const np=state.players[state.turnOrder[nextIdx]];
  np.skillUsed=false;np.skillActive=false;np._rerollCount=0;
  if(np.skipNext){np.skipNext=false;state.message=np.name+' 被跳过（狂飙忘忧酒）';state.messageType='warn';setTimeout(()=>this.g5EndTurn(state.turnOrder[nextIdx]),800);return}
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else{state.message=np.name+' 的回合（第'+state.round+'轮），投掷骰子';state.messageType=''}
};

window.G.g5CloseSummary=function(){state.game.roundSummary=null;broadcastState();this.renderG5()};

window.G.g5CheckDeath=function(playerId){
  const p=state.players[playerId];
  if(p.hp<=0&&!p.dead){
    const needed=1-p.hp;
    if(p.gold&&p.gold>=needed){p.gold-=needed;p.hp=1;state.message+=' | '+playerName(playerId)+' 消耗'+needed+'金币复活（1血）';state.messageType='warn'}
    else{p.dead=true;if(p.skill)state.game.discarded.push(p.skill);p.skill=null;if(p.gold)p.gold=0;state.message+=' | '+playerName(playerId)+' 被淘汰！';state.messageType='warn'}
  }
};
window.G.g5CheckDeathObj=function(p){
  if(p.hp<=0&&!p.dead){
    const needed=1-p.hp;
    if((p.gold||0)>=needed){p.gold-=needed;p.hp=1;state.message+=' | '+p.name+' 消耗'+needed+'金币代替血量（恢复1血）';state.game.lastEffect={type:'damage',playerName:p.name,text:'-'+needed+'💰 恢复1❤️',sub:p.name+' 金币代替血量'}}
    else{p.dead=true;if(p.skill)state.game.discarded.push(p.skill);p.skill=null;if(p.gold)p.gold=0;state.message+=' | '+p.name+' 血量归零且金币不足，被淘汰！';state.game.lastEffect={type:'damage',playerName:p.name,text:'💀 淘汰',sub:p.name+' 血量归零'}}
  }
};

window.G.g5EndGame=function(winnerId){
  state.phase='ended';state.winner=winnerId;
  let rankings=Object.entries(state.players).filter(([_,p])=>!p.dead).sort((a,b)=>b[1].pos-a[1].pos);
  // 次席预言酒：预测获胜者正确则直接成为第二名
  const predictor=Object.entries(state.players).find(([id,p])=>p.predictedWinner===winnerId&&!p.dead&&id!==winnerId);
  if(predictor){rankings=rankings.filter(([id])=>id!==predictor[0]);rankings.splice(1,0,predictor);state.message+=' | '+predictor[1].name+' 次席预言酒生效，成为第二名！'}
  const goldMap=[6,5,4,3,2,1];
  const personalGold={};
  rankings.forEach(([id,p],i)=>{const gg=goldMap[i]||0;personalGold[id]=gg});
  // 保存最终血量，继承到后面地下城机制
  Object.entries(state.players).forEach(([id,p])=>{p.escapedHP=p.dead?0:Math.max(0,p.hp)});
  state.g5FinalHP={};
  Object.entries(state.players).forEach(([id,p])=>{state.g5FinalHP[id]=p.escapedHP});
  const winner=state.players[winnerId];
  gameOver({winner:'🎉 '+winner.name+' 逃出地下城！',personalGold});
};

// 开始投骰（玩家端）
window.G.g6StartRoll=function(){
  if(this.g6Rolling||!state.game||state.game.phase!=='combat')return;
  const c=state.game.combat;
  if(!c||c.resolved||c.rolling)return;
  if(c.attacker!==myPeerId)return;
  this.g6Rolling=true;
  this.g6Pointer=0;this.g6Dir=1;this.g6Locked=false;
  c.rolling=true;c.pointer=0;
  broadcastState();this.renderG6();
  // 快速移动指针（比G4难）
  this.g6Timer=setInterval(()=>{
    this.g6Pointer+=this.g6Dir*3;
    if(this.g6Pointer>=100){this.g6Pointer=100;this.g6Dir=-1}
    if(this.g6Pointer<=0){this.g6Pointer=0;this.g6Dir=1}
    c.pointer=this.g6Pointer;
    const p=document.querySelector('.g6-pointer');
    if(p)p.style.left=this.g6Pointer+'%';
  },20);
};

// 锁定投骰（玩家端）
window.G.g6Lock=function(){
  if(!this.g6Rolling)return;
  clearInterval(this.g6Timer);
  this.g6Rolling=false;this.g6Locked=true;
  const c=state.game.combat;
  c.rolling=false;
  // 计算环数：指针位置决定
  const p=this.g6Pointer;
  let ring=0;
  if(p>=85)ring=5;
  else if(p>=70)ring=4;
  else if(p>=52)ring=3;
  else if(p>=34)ring=2;
  else if(p>=16)ring=1;
  else ring=0; // 脱靶
  c.ring=ring;
  c.dice=Math.floor(Math.random()*6)+1;
  c.isEven=c.dice%2===0;
  c.crit=ring===5&&c.isEven&&!c.monster.isDragon;
  // 不设置resolved，等待主持人端确认
  sendAction({type:'g6combat',ring:ring,dice:c.dice,crit:c.crit});
};

  state.game={
    floor:1,

    lastEffect:null,

    currentTeam:'red', // 当前行动队伍
    combat:null,
    shop:null,
    event:null,
    cloverUsed:[],
    monstersDefeated:{red:[],blue:[]},
    bossDefeated:false
  };
  Object.entries(state.players).forEach(([id,p])=>{
    p.floor=1;
    // G6初始血量 = G5继承escapedHP + G6给的3条命(27血)
    const totalHp=(p.escapedHP||0)+27;
    p.life=Math.ceil(totalHp/9);
    p.hp=totalHp%9;
    if(p.hp===0)p.hp=9;
    p.gold=p.gold||0;
    p.dead=false;
    // 分配角色自带技能
    const charData=G6_CHAR_SKILLS[p.character];
    if(charData){
      p.skills=charData.skills.map(s=>({...s,used:false}));
      p.equipSlots=charData.equip;
    }else{
      p.skills=[];
      p.equipSlots=['主武器','副武器','道具'];
    }
    p.equipment=[]; // 已装备的物品
    p.backpack=[]; // 背包（最多2件）
    p.skillSlots=3;
  });
  state.turnOrder=Object.keys(state.players);
  state.message='🐉 最终机制开始！请两队选择路线（上路/下路）';
  state.messageType='';
};

    const fxColor=fx.type==='damage'?'#ff4444':fx.type==='gold'?'#ffd700':fx.type==='heal'?'#44ff44':fx.type==='crit'?'#ff0000':'#e8c86a';
    html+='<div class="g5-fx-overlay"><div class="g5-fx-box g5-fx-'+(fx.type||'normal')+'" style="--fx-color:'+fxColor+'"><div class="g5-fx-icon" style="color:'+fxColor+'">'+fxIcon+'</div><div class="g5-fx-text" style="color:'+fxColor+'">'+fx.text+'</div><div class="g5-fx-sub">'+fx.sub+'</div></div></div>';
  }
  document.getElementById('gameArea').innerHTML=html;
  this.g6RenderButtons();
  if(g.lastEffect){const fx=g.lastEffect;setTimeout(()=>{if(state.game&&state.game.lastEffect===fx){state.game.lastEffect=null;broadcastState();this.renderG6()}},2000)}
