function showScreen(id){['joinScreen','publicLobby','gameScreen'].forEach(s=>document.getElementById(s).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function setConn(s,t){document.getElementById('connDot').className='conn-dot'+(s==='online'?' online':'');document.getElementById('connText').textContent=t}
function saveReconnectCode(roomId,code,name,charId){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');d[roomId]={code,name,charId};localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}catch(e){}}
function loadReconnectCode(roomId){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')[roomId]||null}catch(e){return null}}
function playerName(id){return state&&state.players[id]?state.players[id].name:'?'}
function charImg(charId){const c=CHARACTERS.find(x=>x.id===charId);return c?c.img:''}
function charName(charId){const c=CHARACTERS.find(x=>x.id===charId);return c?c.name:'?'}
// 构建回合顺序，尊重state.firstTeam（猜大小获胜方先手）
function buildTurnOrder(){
  const blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue').map(([id])=>id);
  const reds=Object.entries(state.players).filter(([_,p])=>p.team==='red').map(([id])=>id);
  const first=state.firstTeam==='red'?reds:blues;
  const second=state.firstTeam==='red'?blues:reds;
  const order=[];const mx=Math.max(first.length,second.length);
  for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
  return order;
}

// ==================== 角色选择UI ====================
function renderCharPick(){
  const grid=document.getElementById('charPickGrid');
  grid.innerHTML=CHARACTERS.map(c=>`<div class="char-pick-card ${selectedChar===c.id?'selected':''}" onclick="pickChar('${c.id}')"><img src="${c.img}" alt="${c.name}"><div class="cname">${c.name}</div></div>`).join('');
}
function pickChar(id){selectedChar=id;renderCharPick()}
function selectTeam(t){selectedTeam=t;document.getElementById('teamBlueBtn').classList.toggle('selected',t==='blue');document.getElementById('teamRedBtn').classList.toggle('selected',t==='red')}

// ==================== 主持人 ====================
function enterHost(){
  isHost=true;
  showScreen('publicLobby');
  document.getElementById('hostRoomId').textContent='连接中...';
  document.getElementById('lobbyTitle').textContent='🎩 主持人大厅';
  const roomId=genCode();
  const iceConfig={config:{iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:stun2.l.google.com:19302'},
    {urls:'stun:stun.cloudflare.com:3478'},
    {urls:'stun:stun.services.mozilla.com:3478'},
    {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
  ]}};
  try{peer=new Peer('dungeon-'+roomId,{debug:1,...iceConfig})}catch(e){alert('连接失败');return}
  peer.on('open',id=>{
    myPeerId=id;
    state={phase:'lobby',roomId,players:{},currentGame:0,game:null,gameSummary:null,turnOrder:[],currentIndex:0,round:1,message:'',messageType:''};
    peer.on('connection',c=>{
      c.on('open',()=>{hostConns[c.peer]=c;setupHostConn(c)});
      c.on('close',()=>{
        if(hostConns[c.peer]){delete hostConns[c.peer];
          if(state&&state.players[c.peer]){
            state.players[c.peer].online=false;
            if(state.phase==='lobby'){renderPublicLobby();broadcastState()}
            else{broadcastState();if(window.G&&window.G.render)window.G.render()}
          }
        }
      });
    });
    document.getElementById('hostRoomId').textContent=roomId;
    renderPublicLobby();
  });
  peer.on('error',err=>{if(err.type==='unavailable-id'){alert('房间号冲突，请刷新重试')}else alert('连接失败：'+(err.type||err.message))});
}
function setupHostConn(c){
  c.on('data',msg=>handleHostMsg(c.peer,msg));
}
function sendTo(id,m){if(hostConns[id]&&hostConns[id].open)try{hostConns[id].send(m)}catch(e){}}
function broadcast(m){Object.values(hostConns).forEach(c=>{if(c.open)try{c.send(m)}catch(e){}})}
function broadcastState(){broadcast({type:'state',state:state})}

function handleHostMsg(peerId,msg){
  if(!msg||!msg.type)return;
  if(msg.type==='join'){
    // 重连
    if(msg.reconnectCode){
      const ex=Object.entries(state.players).find(([id,p])=>p.reconnectCode===msg.reconnectCode);
      if(ex){
        const[oldId,p]=ex;delete hostConns[oldId];delete state.players[oldId];
        p.online=true;state.players[peerId]=p;
        if(state.turnOrder){const idx=state.turnOrder.indexOf(oldId);if(idx>=0)state.turnOrder[idx]=peerId}
        sendTo(peerId,{type:'joinAccept',yourId:peerId,reconnectCode:msg.reconnectCode,reconnected:true,name:p.name,team:p.team,charId:p.character,state:state});
        if(state.phase==='lobby')renderHostLobby();
        if(state.phase==='playing'&&window.G&&window.G.render)window.G.render();
        broadcastState();return;
      }
    }
    if(state.phase!=='lobby'){sendTo(peerId,{type:'joinReject',reason:'游戏已开始，需重连码'});return}
    if(Object.values(state.players).filter(p=>p.team===msg.team).length>=3){sendTo(peerId,{type:'joinReject',reason:'队伍已满'});return}
    let charId=msg.charId;
    if(charId&&Object.values(state.players).some(p=>p.character===charId)){
      const taken=Object.values(state.players).map(p=>p.character).filter(Boolean);
      const avail=CHARACTERS.find(c=>!taken.includes(c.id));charId=avail?avail.id:null;
    }
    const rc=genCode();
    const cname=charName(charId);
    state.players[peerId]={id:peerId,name:cname,character:charId,team:msg.team,online:true,reconnectCode:rc,gold:0,ready:false};
    // 新玩家加入，重置所有人准备状态
    Object.values(state.players).forEach(p=>p.ready=false);
    sendTo(peerId,{type:'joinAccept',yourId:peerId,reconnectCode:rc,name:cname,team:msg.team,charId:charId});
    renderPublicLobby();broadcastState();
  }
  else if(msg.type==='hostAction'){
    // 主持人操作由游戏模块处理
    if(window.G && window.G.hostAction)window.G.hostAction(peerId,msg.action);
  }
  else if(msg.type==='playerReady'){
    if(state.players[peerId]){state.players[peerId].ready=true;broadcastState();renderPublicLobby()}
  }
  else if(msg.type==='playerAction'){
    // 猜大小阶段的操作单独处理
    if(state.phase==='preGame'&&msg.action&&msg.action.type==='preGameGuess'){
      if(state.preGame&&state.preGame.phase==='guess'&&!(state.preGame.blueGuess||state.preGame.redGuess)){
        const p=state.players[peerId];
        const guessTeam=state.preGame.guessTeam||'blue';
        if(p&&p.team===guessTeam){
          if(guessTeam==='blue'){
            state.preGame.blueGuess=msg.action.guess;
            state.preGame.redGuess=msg.action.guess==='big'?'small':'big';
          }else{
            state.preGame.redGuess=msg.action.guess;
            state.preGame.blueGuess=msg.action.guess==='big'?'small':'big';
          }
          state.preGame.phase='roll';
          broadcastState();renderPreGame();
        }
      }
      return;
    }
    if(window.G && window.G.playerAction)window.G.playerAction(peerId,msg.action);
  }
}

function renderPublicLobby(){
  const b=Object.entries(state.players).filter(([_,p])=>p.team==='blue');
  const r=Object.entries(state.players).filter(([_,p])=>p.team==='red');
  document.getElementById('blueCount').textContent=b.length+'/3';
  document.getElementById('redCount').textContent=r.length+'/3';
  // 游戏选择网格
  const grid=document.getElementById('gameSelectGrid');
  if(grid){
    let gh='';
    GAMES.forEach((g,i)=>{
      const num=i+1;let cls='game-select-card',label='',icon=g.icon;
      if(num<=state.currentGame){cls+=' done';label='已完成'}
      else if(num===state.currentGame+1&&state.currentGame<6){cls+=' selected';label='下一局'}
      else if(num>state.currentGame+1){cls+=' locked';label='未解锁'}
      if(isHost&&num===state.currentGame+1&&state.currentGame<6)cls+=' selectable';
      gh+=`<div class="${cls}" ${isHost&&num===state.currentGame+1&&state.currentGame<5?`onclick="hostSelectGame(${num})"`:''}><span class="gs-icon">${icon}</span><div class="gs-name">${g.name}</div><div style="font-size:9px;color:var(--gold);margin-top:2px">${label}</div></div>`;
    });
    grid.innerHTML=gh;
  }
  // 玩家列表
  const renderSlot=(list,elId)=>{const el=document.getElementById(elId);if(!el)return;el.innerHTML='';list.forEach(([id,p])=>{
    const d=document.createElement('div');d.className='player-slot';
    const tt=p.team==='blue'?'→红队':'→蓝队';const bc=p.team==='blue'?'btn-red':'btn-blue';
    const readyBadge=p.ready?'<span class="ready-badge yes">✓已准备</span>':'<span class="ready-badge no">未准备</span>';
    let rightHtml=`<span class="status ${p.online?'':'offline'}">${p.online?'在线':'离线'}</span>`;
    if(isHost){
      rightHtml+=`<span style="font-size:11px">💰</span><input type="number" min="0" value="${p.gold||0}" style="width:50px;padding:2px 4px;font-size:12px;background:#1a0f08;color:var(--text);border:1px solid #4a3520;border-radius:3px" onchange="hostSetGold('${id}',this.value)">`;
      rightHtml+=`<button class="btn btn-small ${bc}" style="padding:2px 8px;font-size:11px" onclick="hostSwitchTeam('${id}')">${tt}</button>`;
    }else{
      rightHtml+=`<span style="font-size:11px;color:var(--gold-light)">💰${p.gold||0}</span>`;
    }
    rightHtml+=readyBadge;
    d.innerHTML=`<span class="pinfo">${p.character?`<img src="${charImg(p.character)}">`:''}${p.name} <span class="reconnect-code" onclick="navigator.clipboard.writeText('${p.reconnectCode}')" title="点击复制重连码">🔑${p.reconnectCode}</span></span>
    <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">${rightHtml}</span>`;
    el.appendChild(d);
  });for(let i=list.length;i<3;i++){const d=document.createElement('div');d.className='player-slot empty';d.textContent='空位';el.appendChild(d)}};
  renderSlot(b,'blueList');renderSlot(r,'redList');
  // 操作区
  const actions=document.getElementById('lobbyActions');
  if(actions){
    const can=b.length>=1&&r.length>=1;
    const allReady=Object.values(state.players).every(p=>p.ready||!p.online);
    const nextGame=state.currentGame+1;
    if(isHost){
      if(state.currentGame>=GAMES.length){
        actions.innerHTML='<div class="tip">🎉 全部游戏已结束！</div>';
      }else{
        const gi=GAMES[nextGame-1];
        const readyCount=Object.values(state.players).filter(p=>p.ready).length;
        const totalCount=Object.values(state.players).length;
        let startTip=!can?'等待玩家加入（每队至少1人）':!allReady?`等待玩家准备（${readyCount}/${totalCount}已准备）`:'✅ 全部已准备，可以开始！';
        if(nextGame===6){
          const g5Winner=state.winner?state.players[state.winner]:null;
          const winnerTeam=g5Winner?(g5Winner.team==='blue'?'🔵 蓝队':'🔴 红队'):'蓝队';
          startTip+='<br><span style="color:var(--gold-light)">⚔️ 最终机制：'+winnerTeam+'（G5胜者）先手</span>';
        }
        actions.innerHTML=`<button class="btn" id="startBtn" ${can&&allReady?'':'disabled'} onclick="hostStartNextGame()">🎮 开始第${nextGame}局：${gi.icon} ${gi.name}</button>
        <div class="tip" id="startTip">${startTip}</div>`;
      }
    }else{
      const me=state.players[myPeerId];
      if(me&&me.ready){
        actions.innerHTML='<div style="text-align:center"><span class="ready-badge yes" style="font-size:14px;padding:6px 20px">✓ 已准备，等待主持人开始...</span></div>';
      }else{
        actions.innerHTML='<button class="btn btn-blue" onclick="playerReady()" style="width:100%;max-width:300px">✅ 准备</button>';
      }
    }
  }
  renderProgress('lobbyProgress');
}
// 兼容旧调用
function renderHostLobby(){renderPublicLobby()}
function renderWaitScreen(){renderPublicLobby()}

function playerReady(){
  if(conn&&conn.open)conn.send({type:'playerReady'});
}
function hostSetGold(id,val){if(!state||state.phase!=='lobby')return;state.players[id].gold=Math.max(0,parseInt(val)||0);Object.values(state.players).forEach(p=>p.ready=false);broadcastState();renderPublicLobby()}
function hostSwitchTeam(id){
  if(!state||state.phase!=='lobby')return;const p=state.players[id];if(!p)return;
  const nt=p.team==='blue'?'red':'blue';
  if(Object.values(state.players).filter(pl=>pl.team===nt).length>=3){alert('队伍已满');return}
  p.team=nt;p.ready=false;sendTo(id,{type:'teamChanged',team:nt});broadcastState();renderPublicLobby();
}

function copyRoomId(){
  const el=document.getElementById('hostRoomId');
  const code=state.roomId||'';
  if(!code)return;
  const done=()=>{el.classList.add('copied');const h=el.querySelector('.copy-hint');if(h)h.textContent='✅ 已复制';setTimeout(()=>{el.classList.remove('copied');if(h)h.textContent='📋 点击复制'},1500)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done).catch(()=>{fallbackCopy(code,done)})}
  else fallbackCopy(code,done);
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');cb&&cb()}catch(e){alert('复制失败，请手动复制：'+text)}
  document.body.removeChild(ta);
}

function hostStartNextGame(){
  if(state.currentGame>=GAMES.length)return;
  // 金币确认弹窗
  showGoldConfirm(()=>{
    const nextGame=state.currentGame+1;
    state.currentGame=nextGame;
    state.gameSummary=null;
    Object.values(state.players).forEach(p=>p.ready=false);
    // G6最终机制：跳过猜大小，直接由G5胜者队伍先手
    if(GAMES[nextGame-1].id===6){
      const g5Winner=state.winner?state.players[state.winner]:null;
      state.firstTeam=g5Winner?g5Winner.team:'blue';
      state.finalBattleIntro=true;
      broadcastState();
      showScreen('gameScreen');
      document.getElementById('myRoleLabel').textContent='🎩 主持人';
      document.getElementById('hostControls').classList.remove('hidden');
      document.getElementById('hostSkipBar').classList.remove('hidden');
      setConn('online','已连接');
      document.getElementById('gameTitle').textContent=GAMES[nextGame-1].icon+' '+GAMES[nextGame-1].name;
      // 播放G6震撼特效后初始化（所有人可见）
      if(!window._fbIntroPlaying){
        window._fbIntroPlaying=true;
        playFinalBattleIntro(()=>{
          window._fbIntroPlaying=false;
          state.finalBattleIntro=false;
          state.phase='playing';
          if(window.G && window.G.init)window.G.init(GAMES[nextGame-1].id);
          broadcastState();
          if(window.G && window.G.render)window.G.render();
          if(isHost)renderHostReconnectPanel();
        });
      }
      return;
    }
    // G1-G5：猜大小决定先手
    state.phase='preGame';
    // 随机选每队代表
    const _blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue');
    const _reds=Object.entries(state.players).filter(([_,p])=>p.team==='red');
    const _blueRep=_blues.length?_blues[Math.floor(Math.random()*_blues.length)]:null;
    const _redRep=_reds.length?_reds[Math.floor(Math.random()*_reds.length)]:null;
    // 按局数轮换猜大小队伍：奇数局蓝队先猜，偶数局红队先猜
    const _guessTeam=nextGame%2===1?'blue':'red';
    state.preGame={blueGuess:null,redGuess:null,dice:null,winner:null,rolling:false,phase:'guess',blueRepId:_blueRep?_blueRep[0]:null,redRepId:_redRep?_redRep[0]:null,guessTeam:_guessTeam};
    broadcastState();
    showScreen('gameScreen');
    document.getElementById('myRoleLabel').textContent='🎩 主持人';
    document.getElementById('hostControls').classList.remove('hidden');
    document.getElementById('hostSkipBar').classList.remove('hidden');
    setConn('online','已连接');
    document.getElementById('gameTitle').textContent='🎲 猜大小 — '+GAMES[nextGame-1].name;
    renderPreGame();
    if(isHost)renderHostReconnectPanel();
  });
}

// 猜大小阶段渲染
function renderPreGame(){
  if(!state.preGame)return;
  const pg=state.preGame;
  // 兼容旧状态：如果guessTeam不存在，根据局数计算
  if(!pg.guessTeam){pg.guessTeam=state.currentGame%2===1?'blue':'red';}
  const blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue');
  const reds=Object.entries(state.players).filter(([_,p])=>p.team==='red');
  const blueRep=pg.blueRepId?blues.find(([id])=>id===pg.blueRepId):blues[0];
  const redRep=pg.redRepId?reds.find(([id])=>id===pg.redRepId):reds[0];
  let html='<div class="pregame-container">';
  html+='<h2 style="text-align:center;color:var(--gold-light);margin-bottom:8px">🎲 猜大小决定先手</h2>';
  const guessTeamName=pg.guessTeam==='blue'?'🔵 蓝队':'🔴 红队';
  const otherTeamName=pg.guessTeam==='blue'?'🔴 红队':'🔵 蓝队';
  html+='<p style="text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:16px">'+guessTeamName+'代表猜大或小，'+otherTeamName+'自动获得相反结果，投骰决定谁先开始</p>';
  html+='<div class="pregame-teams">';
  // 蓝队
  html+='<div class="pregame-team blue">';
  html+='<div class="pregame-team-title">🔵 蓝队</div>';
  if(blueRep){html+='<div class="pregame-rep">代表：'+(blueRep[1].character?'<img src="'+charImg(blueRep[1].character)+'" style="width:24px;height:24px;border-radius:50%;vertical-align:middle">':'')+blueRep[1].name+'</div>';}
  html+='<div class="pregame-guess">'+(pg.blueGuess?'<span class="guess-badge '+(pg.blueGuess==='big'?'big':'small')+'">'+(pg.blueGuess==='big'?'大 (4-6)':'小 (1-3)')+'</span>':'<span style="color:var(--text-dim)">等待猜测...</span>')+'</div>';
  html+='</div>';
  // VS
  html+='<div class="pregame-vs">VS</div>';
  // 红队
  html+='<div class="pregame-team red">';
  html+='<div class="pregame-team-title">🔴 红队</div>';
  if(redRep){html+='<div class="pregame-rep">代表：'+(redRep[1].character?'<img src="'+charImg(redRep[1].character)+'" style="width:24px;height:24px;border-radius:50%;vertical-align:middle">':'')+redRep[1].name+'</div>';}
  html+='<div class="pregame-guess">'+(pg.redGuess?'<span class="guess-badge '+(pg.redGuess==='big'?'big':'small')+'">'+(pg.redGuess==='big'?'大 (4-6)':'小 (1-3)')+'</span>':'<span style="color:var(--text-dim)">等待'+(pg.guessTeam==='blue'?'蓝队':'红队')+'猜测...</span>')+'</div>';
  html+='</div>';
  html+='</div>';
  // 骰子
  html+='<div class="pregame-dice-area">';
  if(pg.rolling){
    html+='<div class="pregame-dice rolling">🎲</div><div style="color:var(--gold)">投掷中...</div>';
  }else if(pg.dice){
    const diceEmoji=['⚀','⚁','⚂','⚃','⚄','⚅'][pg.dice-1];
    html+='<div class="pregame-dice result">'+diceEmoji+'</div><div style="font-size:18px;color:var(--gold-light)">点数：'+pg.dice+' ('+(pg.dice>=4?'大':'小')+')</div>';
  }else{
    html+='<div class="pregame-dice">🎲</div><div style="color:var(--text-dim)">等待投骰</div>';
  }
  html+='</div>';
  // 操作区
  html+='<div class="pregame-actions">';
  if(pg.phase==='guess'&&!(pg.blueGuess||pg.redGuess)){
    const guessRep=pg.guessTeam==='blue'?blueRep:redRep;
    const guessTeamLabel=pg.guessTeam==='blue'?'蓝队':'红队';
    if(isHost){
      html+='<div style="color:var(--text-dim);text-align:center">等待'+guessTeamLabel+'代表猜测...</div>';
    }else if(guessRep&&myPeerId===guessRep[0]){
      html+='<button class="btn btn-blue" onclick="playerPreGameGuess(\'big\')" style="margin:0 8px">猜 大 (4-6)</button>';
      html+='<button class="btn btn-red" onclick="playerPreGameGuess(\'small\')" style="margin:0 8px">猜 小 (1-3)</button>';
    }else{
      html+='<div style="color:var(--text-dim);text-align:center">等待'+guessTeamLabel+'代表猜测...</div>';
    }
  }else if(pg.phase==='roll'){
    if(isHost){
      html+='<button class="btn" onclick="hostPreGameRoll()">🎲 投骰子</button>';
    }else{
      html+='<div style="color:var(--gold);text-align:center">等待主持人投骰子...</div>';
    }
  }else if(pg.phase==='result'){
    const winnerName=pg.winner==='blue'?'🔵 蓝队':'🔴 红队';
    html+='<div style="text-align:center"><div style="font-size:24px;color:var(--gold-light);margin-bottom:12px">🎉 '+winnerName+' 先手！</div>';
    if(isHost){
      html+='<button class="btn" onclick="hostStartActualGame()">▶️ 开始游戏</button>';
    }else{
      html+='<div style="color:var(--text-dim)">等待主持人开始游戏...</div>';
    }
    html+='</div>';
  }
  html+='</div></div>';
  document.getElementById('gameArea').innerHTML=html;
  // 主持人控制

function hostPreGameRoll(){
  if(!state.preGame||state.preGame.phase!=='roll')return;
  state.preGame.rolling=true;state.preGame.phase='rolling';
  broadcastState();renderPreGame();
  setTimeout(()=>{
    const dice=Math.floor(Math.random()*6)+1;
    state.preGame.dice=dice;state.preGame.rolling=false;
    const isBig=dice>=4;
    const guessTeam=state.preGame.guessTeam||'blue';
    const guessVal=guessTeam==='blue'?state.preGame.blueGuess:state.preGame.redGuess;
    const guessWon=(guessVal==='big'&&isBig)||(guessVal==='small'&&!isBig);
    state.preGame.winner=guessWon?guessTeam:(guessTeam==='blue'?'red':'blue');
    state.preGame.phase='result';
    state.firstTeam=state.preGame.winner;
    broadcastState();renderPreGame();
  },1500);
}

function hostSkipPreGame(){
  state.firstTeam=state.preGame?(state.preGame.guessTeam||'blue'):'blue';
  hostStartActualGame();
}

// 游戏结束（由游戏模块调用）
function gameOver(summary){
  state.phase='gameOver';
  state.gameSummary=summary;
  // 金币结算
  if(summary.teamGold){
    // 队伍金币平分
    ['blue','red'].forEach(team=>{
      const members=Object.entries(state.players).filter(([_,p])=>p.team===team);
      const teamGold=summary.teamGold[team]||0;
      const share=members.length>0?Math.floor(teamGold/members.length):0;
      members.forEach(([id,p])=>{p.gold=(p.gold||0)+share});
    });
  }
  if(summary.personalGold){
    Object.entries(summary.personalGold).forEach(([id,g])=>{if(state.players[id])state.players[id].gold=(state.players[id].gold||0)+g});
  }
  broadcastState();
  renderGameSummary();
  if(isHost)renderHostReconnectPanel();
}

function renderGameSummary(){
  const s=state.gameSummary;if(!s)return;

    else if(s.winner.includes('红队')){isWin=myTeam==='red';winText='🔴 红队获胜！'}

  }
  if(isHost){isWin=true}

  const bannerSub=isWin?'勇者凯旋，宝藏入袋':'勇者倒下，地牢吞噬...';
  // 粒子效果

  }else{
    for(let i=0;i<8;i++){particles+=`<span class="summary-ember" style="left:${Math.random()*100}%;bottom:0;animation-delay:${Math.random()*2}s"></span>`}
  }
  let html=`<div class="summary-modal"><div class="summary-box">
    <div class="summary-title">${gi.icon} ${gi.name} · 结算</div>
    <div class="summary-result-banner ${bannerClass}">
      ${particles}
      <span class="sr-icon">${bannerIcon}</span>
      <div class="sr-text">${bannerTitle}</div>
      <div class="sr-sub">${winText} · ${bannerSub}</div>
    </div>`;
  // 队伍金币
  if(s.teamGold){
    html+=`<div class="summary-section"><h4>队伍金币</h4>`;
    ['blue','red'].forEach(t=>{
      const members=Object.entries(state.players).filter(([_,p])=>p.team===t);
      const tg=s.teamGold[t]||0;
      const share=members.length>0?Math.floor(tg/members.length):0;
      html+=`<div class="summary-row"><span>${t==='blue'?'🔵蓝队':'🔴红队'}</span><span class="sr-val">${tg}金币 ÷${members.length} = 每人${share}</span></div>`;
    });
    html+='</div>';
  }
  // 个人金币
  if(s.personalGold){
    html+=`<div class="summary-section"><h4>个人金币</h4>`;
    Object.entries(s.personalGold).forEach(([id,g])=>{
      const p=state.players[id];if(!p)return;

  }

  document.getElementById('gameArea').innerHTML=html;

// ==================== 玩家端 ====================
function playerJoin(){
  const roomId=document.getElementById('joinRoomInput').value.trim().toUpperCase();
  const rc=document.getElementById('joinReconnectInput').value.trim().toUpperCase();
  if(roomId.length!==6){document.getElementById('joinStatus').textContent='请输入6位房间号';return}
  if(!selectedChar&&!rc){document.getElementById('joinStatus').textContent='请先选择角色';return}
  myTeam=selectedTeam;myReconnectCode=rc||null;myCharId=selectedChar;
  document.getElementById('joinStatus').textContent='正在连接...';
  const iceConfig={config:{iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:stun2.l.google.com:19302'},
    {urls:'stun:stun.cloudflare.com:3478'},
    {urls:'stun:stun.services.mozilla.com:3478'},
    {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
  ]}};
  try{peer=new Peer({debug:1,...iceConfig})}catch(e){document.getElementById('joinStatus').textContent='连接失败';return}
  peer.on('open',()=>{
    myPeerId=peer.id;
    conn=peer.connect('dungeon-'+roomId,{reliable:true});
    conn.on('open',()=>{
      const m={type:'join',team:myTeam,charId:myCharId};
      if(rc)m.reconnectCode=rc;
      conn.send(m);
      document.getElementById('joinStatus').textContent=rc?'正在重连...':'已连接...';
    });
    conn.on('data',d=>handlePlayerMsg(d));
    conn.on('close',()=>{setConn('offline','已断开')});
    conn.on('error',()=>{document.getElementById('joinStatus').textContent='连接失败'});
  });
  peer.on('error',err=>{document.getElementById('joinStatus').textContent='连接失败：'+(err.type||err.message)});
}

function handlePlayerMsg(msg){
  if(!msg||!msg.type)return;
  if(msg.type==='joinAccept'){
    myPeerId=msg.yourId;myReconnectCode=msg.reconnectCode;
    if(msg.name)myName=msg.name;if(msg.team)myTeam=msg.team;if(msg.charId)myCharId=msg.charId;
    const roomId=document.getElementById('joinRoomInput').value.trim().toUpperCase();
    saveReconnectCode(roomId,msg.reconnectCode,myName,myCharId);
    if(msg.reconnected&&msg.state){state=msg.state;if(state.phase==='playing'||state.phase==='preGame'||state.phase==='gameOver'||state.phase==='coinflip'||state.phase==='skillselect'){let _gm=document.getElementById('g3GuardianModal');if(_gm)_gm.remove();enterGameScreen();const _mid=GAMES[state.currentGame-1].id;if(window.G&&window.G.init)window.G.init(_mid);state=msg.state;window._initGameId=_mid;if(state.phase==='playing'||state.phase==='coinflip'||state.phase==='skillselect'){window.G.gameId=_mid;if(window.G.render)window.G.render()}else if(state.phase==='preGame'){renderPreGame()}else if(state.phase==='gameOver'){renderGameSummary()}}else{let _gm=document.getElementById('g3GuardianModal');if(_gm)_gm.remove();showScreen('publicLobby');renderPublicLobby()}return}
    document.getElementById('lobbyTitle').textContent='🎮 游戏大厅';
    document.getElementById('hostRoomId').textContent=roomId;
    showScreen('publicLobby');
    renderPublicLobby();
  }
  else if(msg.type==='joinReject'){document.getElementById('joinStatus').textContent='加入失败：'+msg.reason}
  else if(msg.type==='teamChanged'){myTeam=msg.team;renderPublicLobby()}
  else if(msg.type==='state'){
    state=msg.state;
    if((state.phase==='playing'||state.phase==='preGame'||state.phase==='coinflip'||state.phase==='skillselect')&&document.getElementById('gameScreen').classList.contains('hidden')){
      enterGameScreen();
    }
    // 玩家端：进入游戏阶段时需要初始化游戏UI元素（gameInfo等），否则render会报错
    if((state.phase==='playing'||state.phase==='coinflip'||state.phase==='skillselect')&&window.G&&window.G.init&&window._initGameId!==GAMES[state.currentGame-1].id){
      let _gm=document.getElementById('g3GuardianModal');if(_gm)_gm.remove();
      window.G.init(GAMES[state.currentGame-1].id);
      state=msg.state;
      window._initGameId=GAMES[state.currentGame-1].id;
    }
    if(state.phase==='gameOver'){
      if(document.getElementById('gameScreen').classList.contains('hidden'))enterGameScreen();
      let _gm=document.getElementById('g3GuardianModal');if(_gm)_gm.remove();
      renderGameSummary();
      if(isHost)renderHostReconnectPanel();
    }
    if(state.phase==='lobby'){
      if(document.getElementById('publicLobby').classList.contains('hidden'))showScreen('publicLobby');
      let _gm=document.getElementById('g3GuardianModal');if(_gm)_gm.remove();
      window._initGameId=null;
      renderPublicLobby();
      document.getElementById('hostReconnectPanel').classList.add('hidden');
    }
    if(state.phase==='preGame'){
      window.G.gameId=GAMES[state.currentGame-1].id;
      renderPreGame();
      renderProgress('gameProgress');
      document.getElementById('gameTitle').textContent='🎲 猜大小 — '+GAMES[state.currentGame-1].name;
      if(isHost)renderHostReconnectPanel();
    }
    if(state.finalBattleIntro){
      // G5→G6最终决战特效（所有人可见）
      if(!window._fbIntroPlaying){
        window._fbIntroPlaying=true;
        playFinalBattleIntro(()=>{
          window._fbIntroPlaying=false;
          // 特效结束后如果state已更新，立即渲染
          if(!state.finalBattleIntro&&(state.phase==='playing'||state.phase==='coinflip'||state.phase==='skillselect')){
            window.G.gameId=GAMES[state.currentGame-1].id;
            if(window.G.render)window.G.render();
            renderProgress('gameProgress');
            document.getElementById('gameTitle').textContent=GAMES[state.currentGame-1].icon+' '+GAMES[state.currentGame-1].name;
            if(isHost)renderHostReconnectPanel();
          }
        });
      }
      return;
    }
    if(state.phase==='playing'||state.phase==='coinflip'||state.phase==='skillselect'){
      window.G.gameId=GAMES[state.currentGame-1].id;
      if(window.G.render)window.G.render();
      renderProgress('gameProgress');
      document.getElementById('gameTitle').textContent=GAMES[state.currentGame-1].icon+' '+GAMES[state.currentGame-1].name;
      if(isHost)renderHostReconnectPanel();
    }
  }
}

window.G={
  gameId:0,g1Rolling:false,g1Deck:null,g1RevealTimer:null,
  init(gameId){this.gameId=gameId;document.getElementById('gameArea').innerHTML='';this[`initG${gameId}`]&&this[`initG${gameId}`]()},
  render(){this[`renderG${this.gameId}`]&&this[`renderG${this.gameId}`]()},
  playerAction(id,action){this[`actionG${this.gameId}`]&&this[`actionG${this.gameId}`](id,action)},
  hostAction(id,action){this[`hostActionG${this.gameId}`]&&this[`hostActionG${this.gameId}`](id,action)},
  restart(){
    // 保留玩家金币，重新初始化当前游戏
    const gid=this.gameId;
    this.init(gid);
    // G5需要回到技能选择阶段，其他游戏默认playing
    if(gid!==5)state.phase='playing';
    broadcastState();
    showScreen('gameScreen');
    setTimeout(()=>this.render(),200);
  }
};

  scarf0:{label:'0围脖',cls:'body-0',value:0,icon:'🐍'},

  scarf2:{label:'2围脖',cls:'body-2',value:2,icon:'🧣'},
  scarf3:{label:'3围脖',cls:'body-3',value:3,icon:'🧣'},
  tail:{label:'蛇尾',cls:'tail',value:0,icon:'🐍'},
};
const G1_DECK=[{type:'head',count:8},{type:'gold',count:4},{type:'scarf0',count:8},{type:'scarf1',count:8},{type:'scarf2',count:8},{type:'scarf3',count:6}];
const G1_DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];

window.G.initG1=function(){
  this.g1Deck=[];G1_DECK.forEach(c=>{for(let i=0;i<c.count;i++)this.g1Deck.push(c.type)});
  for(let i=this.g1Deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[this.g1Deck[i],this.g1Deck[j]]=[this.g1Deck[j],this.g1Deck[i]]}
  // 初始化玩家
  const order=buildTurnOrder();
  state.turnOrder=order;state.currentIndex=0;state.round=1;
  state.game={firstHead:false,lastCard:null,deckCount:this.g1Deck.length};
  Object.values(state.players).forEach(p=>{p.snake=['tail'];p.g1coins=0;p.failed=false;p.g1title=false});
  state.message=playerName(order[0])+' 的回合，投掷骰子';state.messageType='';
  document.getElementById('gameInfo').innerHTML='<span>回合 <b id="g1Round">1</b></span><span>牌堆 <b id="g1DeckN">42</b></span><span id="g1Turn"></span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small btn-red" onclick="G.hostActionG1(null,\'skip\')">跳过当前断线玩家</button> <button class="btn btn-small btn-yellow" onclick="if(confirm(\'确定重新开始本局？金币将保留\'))G.restart()">🔄 重新开始</button>';
  this.g1Rolling=false;
};

window.G.renderG1=function(){
  if(!state.game)return;
  const g=state.game;
  document.getElementById('g1Round').textContent=state.round;
  document.getElementById('g1DeckN').textContent=g.deckCount;
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){
    const cp=state.players[curId];
    document.getElementById('g1Turn').innerHTML=`当前：<b style="color:${cp.team==='blue'?'#64b5f6':'#ef9a9a'}">${cp.name}</b>${cp.online?'':'（离线⏸️）'}`;
  }
  let bc=0,rc=0;
  Object.values(state.players).forEach(p=>{if(p.team==='blue')bc+=p.g1coins;else rc+=p.g1coins});
  let html=`<div class="g1-team-coins"><div class="g1-team-coin blue"><span>🔵 蓝队</span><b>${bc}</b></div><div class="g1-team-coin red"><span>🔴 红队</span><b>${rc}</b></div></div>`;
  html+='<div class="g1-players">';
  state.turnOrder.forEach(id=>{
    const p=state.players[id];if(!p)return;
    let badges='';
    if(p.g1title)badges+='<span class="g1-mini-badge title">一发入魂</span>';
    if(p.failed)badges+='<span class="g1-mini-badge fail">出局</span>';
    let snakeHtml='';
    p.snake.forEach(t=>{const c=G1_CARDS[t];let mv=t==='gold'?'5':t.startsWith('scarf')?c.value:t==='head'?'✕':'';snakeHtml+=`<div class="g1-mcard ${c.cls}"><span class="mi">${c.icon}</span><span class="mv">${mv}</span></div>`});
    html+=`<div class="g1-card ${id===curId&&state.phase==='playing'&&!p.failed?'active':''} ${p.failed?'failed':''} ${id===myPeerId?'me':''}">
      <div class="g1-pc-head"><span class="g1-pc-name">${p.team==='blue'?'🔵':'🔴'} ${p.name}${id===myPeerId?' (你)':''}${badges}${p.online?'':' 💤'}</span><span class="g1-pc-coins">${p.g1coins}币</span></div>
      <div class="g1-snake">${snakeHtml}</div></div>`;
  });
  html+='</div>';
  html+=`<div class="g1-center"><div class="g1-msg ${state.messageType||''}" id="g1Msg">${state.message||''}</div><div class="g1-rollrow">
    <div><div class="g1-deck">🃏</div><div style="font-size:11px;color:#a5d6a7;margin-top:4px">牌堆 ${g.deckCount}</div></div>
    <div class="g1-dice" id="g1Dice">🎲</div>
    <button class="btn" id="g1RollBtn" onclick="sendAction({type:'roll'})">投掷骰子</button>
  </div></div>`;
  if(g.lastCard){
    const lc=g.lastCard,ct=G1_CARDS[lc.type];
    html+=`<div class="g1-reveal"><div class="g1-rcard ${ct.cls}"><div class="g1-ricon">${ct.icon}</div><div class="g1-rname">${ct.label}</div><div class="g1-reffect">${lc.effect}</div></div><div class="g1-rplayer">${lc.playerName} 抽到</div></div>`;
  }
  document.getElementById('gameArea').innerHTML=html;
  // 按钮状态
  const btn=document.getElementById('g1RollBtn');
  if(state.phase==='playing'){
    if(isHost){btn.disabled=true;btn.textContent='观战中'}
    else if(!curId||!state.players[curId].online){btn.disabled=true;btn.textContent='等待重连...'}
    else{const myTurn=curId===myPeerId&&!state.players[myPeerId].failed;btn.disabled=!myTurn||this.g1Rolling;btn.textContent=myTurn?(this.g1Rolling?'投掷中...':'🎲 投掷骰子'):'等待对手...'}
  }else{btn.disabled=true;btn.textContent='游戏已结束'}
};

window.G.actionG1=function(peerId,action){
  if(action.type!=='roll')return;
  if(state.phase!=='playing'||this.g1Rolling)return;
  if(state.turnOrder[state.currentIndex]!==peerId)return;
  if(!state.players[peerId].online||state.players[peerId].failed)return;
  this.g1Rolling=true;this.renderG1();
  this.g1AnimateDice();
  setTimeout(()=>{this.g1DrawCard()},850);
};

window.G.hostActionG1=function(peerId,action){
  if(action.type==='skip'&&state.phase==='playing'){
    const curId=state.turnOrder[state.currentIndex];
    state.message='主持人跳过了 '+state.players[curId].name+' 的回合';state.messageType='warn';
    this.g1NextTurn();broadcastState();this.renderG1();
  }
};

window.G.g1AnimateDice=function(){
  const el=document.getElementById('g1Dice');if(!el)return;
  el.classList.add('rolling');let t=0;
  const iv=setInterval(()=>{el.textContent=G1_DICE[Math.floor(Math.random()*6)];t++;if(t>=10){clearInterval(iv);el.classList.remove('rolling');el.textContent=G1_DICE[Math.floor(Math.random()*6)]}},80);
};

window.G.g1DrawCard=function(){
  if(!this.g1Deck||this.g1Deck.length===0){this.g1EndGame();return}
  const idx=Math.floor(Math.random()*this.g1Deck.length);
  const cardType=this.g1Deck.splice(idx,1)[0];
  const curId=state.turnOrder[state.currentIndex];
  const p=state.players[curId];const card=G1_CARDS[cardType];
  if(cardType==='head'){
    if(state.round<=3){
      this.g1Deck.push('head');
      for(let i=this.g1Deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[this.g1Deck[i],this.g1Deck[j]]=[this.g1Deck[j],this.g1Deck[i]]}
      state.message=`🐍 ${p.name} 翻出蛇头！第${state.round}回合保底期，无效放回。继续投掷！`;state.messageType='warn';
      state.game.lastCard={type:'head',playerName:p.name,effect:'保底无效，放回牌堆'};
    }else{
      p.snake.push('head');p.failed=true;
      let m=`💀 ${p.name} 翻出蛇头，出局！`;let eff='失败出局';
      if(!state.game.firstHead){state.game.firstHead=true;p.g1title=true;p.g1coins+=5;m+=' 一发入魂+5金币！';eff='出局 · 一发入魂+5币'}
      state.message=m;state.messageType='warn';
      state.game.lastCard={type:'head',playerName:p.name,effect:eff};
    }
  }else{
    p.snake.push(cardType);p.g1coins+=card.value;
    state.message=`${p.name} 抓到【${card.label}】，${card.value>0?'+'+card.value+'金币':'无金币'}`;state.messageType='good';
    state.game.lastCard={type:cardType,playerName:p.name,effect:card.value>0?'+'+card.value+'金币':'无金币'};
  }
  state.game.deckCount=this.g1Deck.length;
  broadcastState();this.renderG1();
  if(this.g1CheckEnd())setTimeout(()=>this.g1EndGame(),1500);
  else setTimeout(()=>{this.g1NextTurn();this.g1Rolling=false;broadcastState();this.renderG1()},1200);
};

window.G.g1NextTurn=function(){
  const len=state.turnOrder.length;if(len===0)return;
  let nextIdx=(state.currentIndex+1)%len;
  if(nextIdx<=state.currentIndex)state.round++;
  state.currentIndex=nextIdx;
  let guard=0;
  while(state.players[state.turnOrder[state.currentIndex]].failed&&guard<len){
    state.currentIndex=(state.currentIndex+1)%len;
    if(state.currentIndex===0)state.round++;guard++;
  }
  const np=state.players[state.turnOrder[state.currentIndex]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else{state.message=np.name+' 的回合（第'+state.round+'回合），投掷骰子';state.messageType=''}
};

window.G.g1CheckEnd=function(){
  if(state.round>8)return true;
  const alive=state.turnOrder.filter(id=>!state.players[id].failed);
  if(alive.length===0)return true;
  if(!this.g1Deck||this.g1Deck.length===0)return true;
  return false;
};

window.G.g1EndGame=function(){
  let bc=0,rc=0;
  Object.values(state.players).forEach(p=>{if(p.team==='blue')bc+=p.g1coins;else rc+=p.g1coins});
  const winner=bc>rc?'🔵 蓝队获胜！':rc>bc?'🔴 红队获胜！':'🤝 平局！';
  gameOver({winner,teamGold:{blue:bc,red:rc}});
};

// ==================== 游戏2：拍词酒杯 ====================
const G2_DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const G2_EFF={1:'+1酒',2:'+2酒',3:'+3酒',4:'-4酒',5:'跳过',6:'反转'};
const G2_CUP_INIT=15,G2_CUP_MAX=31;

window.G.initG2=function(){
  const order=buildTurnOrder();
  state.turnOrder=order;state.currentIndex=0;state.round=1;
  state.game={cup:G2_CUP_INIT,direction:1,dice:[null,null,null],diceRolled:false,winner:null};
  Object.values(state.players).forEach(p=>{p.g2coins=0});
  state.message=playerName(order[0])+' 的回合，投掷骰子';state.messageType='';
  document.getElementById('gameInfo').innerHTML='<span>第 <b id="g2Round">1</b> 轮</span><span id="g2Turn"></span><span id="g2Dir">➡️</span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small btn-red" onclick="G.hostActionG2(null,\'skip\')">跳过当前断线玩家</button> <button class="btn btn-small btn-yellow" onclick="if(confirm(\'确定重新开始本局？金币将保留\'))G.restart()">🔄 重新开始</button>';
};

window.G.renderG2=function(){
  if(!state.game)return;const g=state.game;
  document.getElementById('g2Round').textContent=state.round;
  document.getElementById('g2Dir').textContent=g.direction===1?'➡️':'⬅️';
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){const cp=state.players[curId];document.getElementById('g2Turn').innerHTML=`当前：<b style="color:${cp.team==='blue'?'#64b5f6':'#ef9a9a'}">${cp.name}</b>${cp.online?'':'（离线⏸️）'}`}
  const pct=Math.min(100,(g.cup/G2_CUP_MAX)*100);
  let html=`<div class="g2-cup-area"><div class="g2-cup-wrap"><div class="g2-cup ${g.cup>=27?'danger':''}"><div class="g2-liquid" style="height:${pct}%;background:${g.cup>=27?'linear-gradient(180deg,#ff5252,#b71c1c)':g.cup>=20?'linear-gradient(180deg,#ff8a65,#d84315)':'linear-gradient(180deg,#ffb74d,#e65100)'}"></div></div><div class="g2-cup-txt">${g.cup}<span class="max">/${G2_CUP_MAX}</span></div></div></div>`;
  html+='<div class="g2-center"><div class="g2-dice-row">';
  for(let i=0;i<3;i++){
    const val=g.dice[i];
    const canSelect=!isHost&&curId===myPeerId&&g.diceRolled&&state.phase==='playing'&&state.players[curId]&&state.players[curId].online;
    html+=`<div class="g2-dice ${g.diceRolled&&val!=null?(canSelect?'selectable':''):'disabled'}" id="g2d${i}" ${canSelect?`onclick="sendAction({type:'select',index:${i}})"`:''}>${g.diceRolled&&val!=null?G2_DICE[val-1]:'🎲'}</div>`;
  }
  html+='</div><div class="g2-dice-eff">'+(g.diceRolled?g.dice.map((v,i)=>`骰${i+1}:${G2_EFF[v]}`).join(' | '):'')+'</div>';
  html+=`<div class="g2-msg ${state.messageType||''}">${state.message||''}</div>`;
  const canRoll=!isHost&&curId===myPeerId&&!g.diceRolled&&state.phase==='playing'&&state.players[curId]&&state.players[curId].online;
  html+=`<button class="btn" id="g2RollBtn" onclick="sendAction({type:'roll'})" ${canRoll?'':'disabled'}>${g.diceRolled?'请选择一颗骰子':(curId===myPeerId?'🎲 投掷骰子':'等待对手...')}</button></div>`;
  // 队伍
  html+='<div class="g2-teams">';
  ['blue','red'].forEach(t=>{
    let tc=0;state.turnOrder.forEach(id=>{const p=state.players[id];if(p&&p.team===t)tc+=p.g2coins});
    html+=`<div class="g2-team ${t}"><h4>${t==='blue'?'🔵 蓝队':'🔴 红队'}<span class="coins">${tc}币</span></h4>`;
    state.turnOrder.forEach(id=>{const p=state.players[id];if(!p||p.team!==t)return;html+=`<span class="g2-chip ${id===curId?'active':''} ${id===myPeerId?'me':''} ${p.online?'':'offline'}">${p.name}${p.online?'':'💤'}${id===curId?(g.direction===1?'➡️':'⬅️'):''}</span>`});
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('gameArea').innerHTML=html;
};

window.G.actionG2=function(peerId,action){
  if(state.phase!=='playing')return;
  if(state.turnOrder[state.currentIndex]!==peerId)return;
  if(!state.players[peerId].online)return;
  if(action.type==='roll'&&!state.game.diceRolled){
    state.game.dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];
    state.game.diceRolled=true;
    state.message=state.players[peerId].name+' 投出骰子，请选择一颗';state.messageType='';
    broadcastState();this.renderG2();
  }else if(action.type==='select'&&state.game.diceRolled){
    this.g2DoSelect(action.index);
  }
};

window.G.hostActionG2=function(peerId,action){
  if(action.type==='skip'&&state.phase==='playing'){
    state.message='主持人跳过了 '+state.players[state.turnOrder[state.currentIndex]].name+' 的回合';state.messageType='warn';
    state.game.diceRolled=false;state.game.dice=[null,null,null];
    this.g2NextTurn();broadcastState();this.renderG2();
  }
};

window.G.g2DoSelect=function(idx){
  const val=state.game.dice[idx];const curId=state.turnOrder[state.currentIndex];const p=state.players[curId];
  if(val<=3){state.game.cup+=val;state.message=`${p.name} 选择+${val}酒，酒杯 ${state.game.cup-val}→${state.game.cup}`}
  else if(val===4){state.game.cup=Math.max(0,state.game.cup-4);state.message=`${p.name} 选择-4酒，酒杯降至 ${state.game.cup}`}
  else if(val===5){state.message=`${p.name} 选择跳过回合`}
  else if(val===6){state.game.direction*=-1;state.message=`${p.name} 选择反转！方向${state.game.direction===1?'恢复正向':'变为逆向'}`}
  state.messageType=(val<=3&&state.game.cup>=27)?'warn':'good';
  if(state.game.cup>=G2_CUP_MAX){
    state.game.winner=p.team==='blue'?'red':'blue';
    state.message+=` — 酒杯溢出！${p.team==='blue'?'蓝队':'红队'}输了！`;state.messageType='warn';
    const winTeam=state.game.winner;
    const personalGold={};
    Object.entries(state.players).forEach(([id,pl])=>{pl.g2coins=pl.team===winTeam?10:6;personalGold[id]=pl.team===winTeam?10:6});
    const winner=winTeam==='blue'?'🔵 蓝队获胜！':'🔴 红队获胜！';
    gameOver({winner,personalGold});
    return;
  }
  state.game.diceRolled=false;state.game.dice=[null,null,null];
  this.g2NextTurn();broadcastState();this.renderG2();
};

window.G.g2NextTurn=function(){
  const len=state.turnOrder.length;if(len===0)return;
  const nextIdx=(state.currentIndex+state.game.direction+len)%len;
  if(state.game.direction===1&&nextIdx<=state.currentIndex)state.round++;
  if(state.game.direction===-1&&nextIdx>=state.currentIndex&&nextIdx!==state.currentIndex)state.round++;
  state.currentIndex=nextIdx;
  const np=state.players[state.turnOrder[nextIdx]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else{state.message=np.name+' 的回合（第'+state.round+'轮），投掷骰子';state.messageType=''}
};

// ==================== 游戏3：酒馆争夺战 ====================
const G3_DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const G3_TAVERNS=[
  {id:1,topGold:5,bottomGold:2,guardian:'猞猁'},{id:2,topGold:7,bottomGold:3,guardian:'乌鸦'},
  {id:3,topGold:9,bottomGold:4,guardian:'老虎'},{id:4,topGold:12,bottomGold:5,guardian:null},
  {id:5,topGold:15,bottomGold:6,guardian:null},{id:6,topGold:20,bottomGold:8,guardian:null},
];
const G3_INIT_IND=8;

window.G.initG3=function(){
  const blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue').map(([id])=>id);
  const reds=Object.entries(state.players).filter(([_,p])=>p.team==='red').map(([id])=>id);
  state._blues=blues;state._reds=reds;
  state.game={taverns:G3_TAVERNS.map(t=>({...t,hits:{}})),dice:[],diceRolled:false,coinflip:null,guardianGame:null,lastAction:null};
  // 使用preGame猜大小的结果，不再内部比大小
  const firstTeam=state.firstTeam||'blue';
  const first=firstTeam==='blue'?blues:reds;
  const second=firstTeam==='blue'?reds:blues;
  const order=[];const mx=Math.max(first.length,second.length);
  for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
  state.turnOrder=order;state.currentIndex=0;state.round=1;
  Object.values(state.players).forEach(p=>{p.g3coins=0;p.indicators=G3_INIT_IND});
  state.phase='playing';
  state.message=(firstTeam==='blue'?'🔵蓝队':'🔴红队')+' 先手！'+playerName(order[0])+' 的回合';state.messageType='good';
  document.getElementById('gameInfo').innerHTML='<span>第 <b id="g3Round">1</b> 轮</span><span id="g3Turn"></span><span id="g3IndInfo" class="g3-ind-info"></span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small btn-red" onclick="G.hostActionG3(null,\'skip\')">跳过断线玩家</button> <button class="btn btn-small btn-yellow" onclick="if(confirm(\'确定重新开始本局？金币将保留\'))G.restart()">🔄 重新开始</button>';
};

window.G.renderG3=function(){
  if(!state.game)return;
  // 游戏结束阶段显示结算界面
  if(state.phase==='gameOver'){renderGameSummary();return}
  const g=state.game;
  document.getElementById('g3Round').textContent=state.round;
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){const cp=state.players[curId];document.getElementById('g3Turn').innerHTML=`当前：<b style="color:${cp.team==='blue'?'#64b5f6':'#ef9a9a'}">${cp.name}</b>${cp.online?'':'（离线⏸️）'}`}
  if(!isHost&&state.players[myPeerId])document.getElementById('g3IndInfo').innerHTML='我的指示物：<b>'+state.players[myPeerId].indicators+'</b>';
  else if(isHost){
    let indHtml='指示物：';
    Object.values(state.players).forEach(p=>{indHtml+=`<span style="color:${p.team==='blue'?'#64b5f6':'#ef9a9a'};margin:0 6px">${p.name}:<b>${p.indicators}</b></span>`});
    document.getElementById('g3IndInfo').innerHTML=indHtml;
  }

  let html='';
  // 比大小阶段
  if(state.phase==='coinflip'){
    const cf=g.coinflip||{};
    html+='<div class="g3-center"><div class="g3-dice-row">';
    if(cf.done){
      html+=`<div class="g3-dice" style="border:3px solid #1976d2">${G3_DICE[cf.blue-1]}</div><div style="font-size:22px;align-self:center">VS</div><div class="g3-dice" style="border:3px solid #c62828">${G3_DICE[cf.red-1]}</div>`;
    }else html+='<div style="font-size:14px;color:#ffcc80;align-self:center">等待主持人投骰...</div>';
    html+='</div>';
    if(cf.done)html+=`<div style="font-size:13px;margin:8px 0">🔵蓝队 ${cf.blue} 点 · 🔴红队 ${cf.red} 点</div>`;
    if(isHost)html+=`<button class="btn" onclick="G.hostActionG3(null,{type:'coinflip'})">${cf.done&&cf.winner==='tie'?'平局！再投一次':'投骰比大小'}</button>`;
    else html+='<button class="btn" disabled>等待主持人...</button>';
    html+='</div>';
    html+=`<div class="g3-msg ${state.messageType||''}">${state.message||''}</div>`;
    document.getElementById('gameArea').innerHTML=html;return;
  }

  // 酒馆网格
  html+='<div class="g3-taverns">';
  const isMyTurn=!isHost&&curId===myPeerId&&g.diceRolled&&state.phase==='playing'&&state.players[curId]&&state.players[curId].online;
  g.taverns.forEach(tv=>{
    const maxHit=Math.max(1,...Object.values(tv.hits));
    let hitsHtml='';
    state.turnOrder.forEach(id=>{const p=state.players[id];if(!p)return;const h=tv.hits[id]||0;hitsHtml+=`<div class="g3-hit-row"><span>${p.team==='blue'?'🔵':'🔴'}${p.name}</span><span class="bar"><span class="bar-fill" style="width:${(h/maxHit)*100}%"></span></span><span>${h}</span></div>`});
    html+=`<div class="g3-tv ${tv.guardian?'guardian':''} ${isMyTurn?'attackable':''}" ${isMyTurn?`onclick="sendAction({type:'attack',tavernId:${tv.id}})"`:''}>
      <div class="g3-tv-head"><span>🍺 ${tv.id}号</span>${tv.guardian?'🛡️':''}</div>
      <div class="g3-tv-gold">上<b>${tv.topGold}</b>/下<b>${tv.bottomGold}</b></div>${hitsHtml}</div>`;
  });
  html+='</div>';
  // 骰子
  html+='<div class="g3-dice-row">';
  if(g.diceRolled&&g.dice.length)g.dice.forEach(v=>html+=`<div class="g3-dice">${G3_DICE[v-1]}</div>`);
  html+='</div>';
  if(g.diceRolled){
    html+='<div class="g3-counts">';
    for(let n=1;n<=6;n++){const cnt=g.dice.filter(d=>d===n).length;html+=`<span class="g3-count">${G3_DICE[n-1]}×<b>${cnt}</b></span>`}
    html+='</div>';
  }
  // 操作展示
  if(g.lastAction){
    const la=g.lastAction;
    html+=`<div class="g3-reveal"><div class="rv-name">${la.playerName} → ${la.tavernId}号酒馆</div><div class="rv-eff">${la.effect}</div>${la.guardianEffect?`<div class="rv-g">🛡️ ${la.guardianEffect}</div>`:''}</div>`;
  }
  // 操作特效
  if(g.lastEffect){
    const fx=g.lastEffect;
    const fxIcon={break:'🍺',gold:'💰',ind:'🔮',fail:'❌'}[fx.type]||'✨';
    html+=`<div class="g3-fx-overlay"><div class="g3-fx-box g3-fx-${fx.type}"><div class="g3-fx-icon">${fxIcon}</div><div class="g3-fx-text">${fx.text}</div><div class="g3-fx-sub">${fx.playerName} · ${fx.sub}</div></div></div>`;
  }
  html+=`<div class="g3-msg ${state.messageType||''}">${state.message||''}</div>`;
  html+='<div class="g3-center">';
  if(state.phase==='playing'){
    if(g.guardianGame)html+='<button class="btn" disabled>守护者小游戏中...</button>';
    else if(isHost)html+='<button class="btn" disabled>观战中</button>';
    else if(!curId||!state.players[curId].online)html+='<button class="btn" disabled>等待重连...</button>';
    else{
      const myTurn=curId===myPeerId;const myInd=state.players[myPeerId]?state.players[myPeerId].indicators:0;
      if(!g.diceRolled)html+=`<button class="btn" onclick="sendAction({type:'roll'})" ${!myTurn||myInd<=0?'disabled':''}>${myTurn?(myInd<=0?'已用完':'🎲 投掷骰子'):'等待对手...'}</button>`;
      else html+=`<button class="btn" ${!myTurn?'disabled':''}>${myTurn?'点击酒馆攻击 ↑':'等待对手...'}</button>`;
    }
  }else html+='<button class="btn" disabled>游戏已结束</button>';
  html+='</div>';
  document.getElementById('gameArea').innerHTML=html;
  // 守护者弹窗
  if(g.guardianGame)this.g3ShowGuardian(g.guardianGame);
};

window.G.actionG3=function(peerId,action){
  if(action.type==='roll'){
    if(state.phase!=='playing'||state.game.diceRolled)return;
    if(state.turnOrder[state.currentIndex]!==peerId||!state.players[peerId].online)return;
    const count=state.players[peerId].indicators;
    state.game.dice=[];for(let i=0;i<count;i++)state.game.dice.push(1+Math.floor(Math.random()*6));
    state.game.diceRolled=true;
    state.message=state.players[peerId].name+' 投出 '+count+' 颗骰子，请选择攻击的酒馆';state.messageType='';
    broadcastState();this.renderG3();
  }else if(action.type==='attack'){
    if(state.phase!=='playing'||!state.game.diceRolled)return;
    if(state.turnOrder[state.currentIndex]!==peerId)return;
    this.g3DoAttack(action.tavernId);
  }else if(action.type==='guardianAction'){
    if(!state.game.guardianGame||state.game.guardianGame.playerId!==peerId)return;
    this.g3GuardianAction(action.action);
  }else if(action.type==='guardianDone'){
    if(!state.game.guardianGame||state.game.guardianGame.playerId!==peerId)return;
    this.g3FinishGuardian();
  }
};

window.G.hostActionG3=function(peerId,action){
  if(action.type==='coinflip'&&state.phase==='coinflip'){
    const b=1+Math.floor(Math.random()*6),r=1+Math.floor(Math.random()*6);
    state.game.coinflip={blue:b,red:r,done:true};
    if(b>r)state.game.coinflip.winner='blue';else if(r>b)state.game.coinflip.winner='red';else state.game.coinflip.winner='tie';
    if(state.game.coinflip.winner!=='tie'){
      const first=state.game.coinflip.winner==='blue'?state._blues:state._reds;
      const second=state.game.coinflip.winner==='blue'?state._reds:state._blues;
      const order=[];const mx=Math.max(first.length,second.length);
      for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
      state.turnOrder=order;state.currentIndex=0;state.phase='playing';
      state.message=(state.game.coinflip.winner==='blue'?'🔵蓝队':'🔴红队')+' 获胜先行动！'+playerName(order[0])+' 的回合';state.messageType='good';
    }else state.message='平局！再投一次';state.messageType='warn';
    broadcastState();this.renderG3();
  }else if(action==='skip'&&state.phase==='playing'){
    state.message='主持人跳过了 '+state.players[state.turnOrder[state.currentIndex]].name;state.messageType='warn';
    state.game.diceRolled=false;state.game.dice=[];state.game.guardianGame=null;
    this.g3NextTurn();broadcastState();this.renderG3();
  }
};

window.G.g3DoAttack=function(tavernId){
  const curId=state.turnOrder[state.currentIndex];const p=state.players[curId];const tv=state.game.taverns[tavernId-1];
  const baseHits=state.game.dice.filter(d=>d===tavernId).length;
  if(baseHits===0){
    state.message=p.name+' 选了'+tavernId+'号酒馆，但该数字未出现，跳过';state.messageType='warn';
    state.game.lastAction={tavernId,playerName:p.name,effect:'跳过回合'};
    state.game.lastEffect={type:'fail',playerName:p.name,text:'未命中',sub:'该数字未出现'};
    state.game.diceRolled=false;state.game.dice=[];this.g3AfterAttack();return;
  }
  tv.hits[curId]=(tv.hits[curId]||0)+baseHits;
  const cost=Math.min(p.indicators,baseHits);p.indicators-=cost;
  state.message=`${p.name} 攻击${tavernId}号酒馆，打破${baseHits}个酒桶（剩余${p.indicators}指示物）`;state.messageType='good';
  state.game.lastAction={tavernId,playerName:p.name,effect:'打破'+baseHits+'个酒桶',guardian:tv.guardian};
  state.game.lastEffect={type:'break',playerName:p.name,text:'打破 '+baseHits+' 个酒桶',sub:tavernId+'号酒馆'};
  state.game.diceRolled=false;state.game.dice=[];
  if(tv.guardian){
    const gg={active:true,tavernId,playerId:curId,type:tv.guardian,step:'choose'};
    if(tv.guardian==='猞猁')gg.actualHand=Math.random()<0.5?'left':'right';
    else if(tv.guardian==='乌鸦')gg.guardianGuess=1+Math.floor(Math.random()*3);
    else if(tv.guardian==='老虎'){gg.rounds=[];gg.wins=0}
    state.game.guardianGame=gg;broadcastState();this.renderG3();return;
  }
  this.g3AfterAttack();
};

window.G.g3GuardianAction=function(action){
  const gg=state.game.guardianGame;if(!gg)return;
  if(gg.type==='猞猁'){gg.guess=action.guess;gg.step='result'}
  else if(gg.type==='乌鸦'){gg.playerNum=action.playerNum;gg.step='result'}
  else if(gg.type==='老虎'){
    const pr=1+Math.floor(Math.random()*6),gr=1+Math.floor(Math.random()*6);
    if(pr>gr)gg.wins++;gg.rounds.push({player:pr,guardian:gr,win:pr>gr});
    if(gg.rounds.length>=3)gg.step='result';
  }
  broadcastState();this.renderG3();
};

window.G.g3FinishGuardian=function(){
  const gg=state.game.guardianGame;if(!gg)return;const p=state.players[gg.playerId];let eff='';let fx=null;
  if(gg.type==='猞猁'){if(gg.guess===gg.actualHand){p.g3coins+=2;eff='猜对！+2金币';fx={type:'gold',playerName:p.name,text:'+2 金币',sub:'猞猁守护者'}}else eff='猜错，无事发生'}
  else if(gg.type==='乌鸦'){if(gg.playerNum!==gg.guardianGuess){p.indicators+=1;eff='守护者猜错！返还1指示物';fx={type:'ind',playerName:p.name,text:'+1 指示物',sub:'乌鸦守护者猜错'}}else{p.g3coins+=gg.playerNum;eff='守护者猜对！+'+gg.playerNum+'金币';fx={type:'gold',playerName:p.name,text:'+'+gg.playerNum+' 金币',sub:'乌鸦守护者猜对'}}}
  else if(gg.type==='老虎'){p.g3coins+=gg.wins;eff='赢'+gg.wins+'局，+'+gg.wins+'金币';if(gg.wins>0)fx={type:'gold',playerName:p.name,text:'+'+gg.wins+' 金币',sub:'老虎守护者赢'+gg.wins+'局'}}
  state.message+=' | 🛡️'+gg.type+'：'+eff;
  if(state.game.lastAction)state.game.lastAction.guardianEffect=eff;
  if(fx)state.game.lastEffect=fx;
  // 关闭守护者弹窗
  let m=document.getElementById('g3GuardianModal');if(m)m.remove();
  state.game.guardianGame=null;this.g3AfterAttack();
};

window.G.g3AfterAttack=function(){
  broadcastState();this.renderG3();
  // 特效2秒后清除
  if(state.game&&state.game.lastEffect&&isHost){const fx=state.game.lastEffect;setTimeout(()=>{if(state.game&&state.game.lastEffect===fx){state.game.lastEffect=null;broadcastState();this.renderG3()}},3500)}
  const allDone=state.turnOrder.every(id=>state.players[id].indicators<=0);
  if(allDone){setTimeout(()=>this.g3EndGame(),1500);return}
  setTimeout(()=>{this.g3NextTurn();broadcastState();this.renderG3()},1500);
};

window.G.g3NextTurn=function(){
  // 清除上一轮特效
  if(state.game)state.game.lastEffect=null;
  const len=state.turnOrder.length;if(len===0)return;
  let nextIdx=(state.currentIndex+1)%len;if(nextIdx<=state.currentIndex)state.round++;
  let guard=0;
  while(state.players[state.turnOrder[nextIdx]].indicators<=0&&guard<len){nextIdx=(nextIdx+1)%len;if(nextIdx===0)state.round++;guard++}
  state.currentIndex=nextIdx;
  const np=state.players[state.turnOrder[nextIdx]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else state.message=np.name+' 的回合（第'+state.round+'轮），投掷骰子';state.messageType='';
};

window.G.g3SettleTavern=function(tv){
  const groups={};
  Object.entries(tv.hits).forEach(([id,c])=>{if(c>0){if(!groups[c])groups[c]=[];groups[c].push(id)}});
  const invalid=new Set();Object.values(groups).forEach(ids=>{if(ids.length>=2)ids.forEach(id=>invalid.add(id))});
  const valid=Object.entries(tv.hits).filter(([id,c])=>c>0&&!invalid.has(id)).sort((a,b)=>b[1]-a[1]);
  return{first:valid[0]?valid[0][0]:null,second:valid[1]?valid[1][0]:null};
};

window.G.g3EndGame=function(){
  state.phase='ended';
  let m=document.getElementById('g3GuardianModal');if(m)m.remove();
  Object.values(state.players).forEach(p=>p.g3coins=0);
  state.game.taverns.forEach(tv=>{const r=this.g3SettleTavern(tv);if(r.first)state.players[r.first].g3coins+=tv.topGold;if(r.second)state.players[r.second].g3coins+=tv.bottomGold});
  const personalGold={};Object.entries(state.players).forEach(([id,p])=>personalGold[id]=p.g3coins);
  let bc=0,rc=0;Object.values(state.players).forEach(p=>{if(p.team==='blue')bc+=p.g3coins;else rc+=p.g3coins});
  const winner=bc>rc?'🔵 蓝队获胜！':rc>bc?'🔴 红队获胜！':'🤝 平局！';
  gameOver({winner,personalGold});
};

window.G.g3ShowGuardian=function(gg){
  const isPlayer=!isHost&&gg.playerId===myPeerId;const pname=playerName(gg.playerId);
  let title='',content='';

      <div style="display:flex;gap:12px;justify-content:center;margin:14px 0">
      <button class="btn btn-blue" ${isPlayer?'':'disabled'} onclick="sendAction({type:'guardianAction',action:{guess:'left'}})">🤚 左手</button>
      <button class="btn btn-red" ${isPlayer?'':'disabled'} onclick="sendAction({type:'guardianAction',action:{guess:'right'}})">🤚 右手</button></div>`;
    else{const ok=gg.guess===gg.actualHand;content=`<div style="font-size:36px;margin:10px">${ok?'🎉':'😅'}</div><p>${pname}猜${gg.guess==='left'?'左':'右'}手，金币在${gg.actualHand==='left'?'左':'右'}手</p><p style="color:${ok?'#a5d6a7':'#ef9a9a'};font-weight:bold">${ok?'猜对！+2金币':'猜错'}</p>${isPlayer?'<button class="btn" onclick="sendAction({type:\'guardianDone\'})">继续</button>':'<p style="color:#888">等待...</p>'}`}
  }else if(gg.type==='乌鸦'){
    title='🛡️ 乌鸦守护者';
    if(gg.step==='choose')content=`<p>放1-3个金币，守护者猜数字。猜错返1指示物，猜对得对应金币。</p><p style="color:${isPlayer?'var(--gold-light)':'#888'}">${isPlayer?'请选择：':pname+' 正在选择...'}</p>
      <div style="display:flex;gap:10px;justify-content:center;margin:14px 0">
      <button class="btn" ${isPlayer?'':'disabled'} onclick="sendAction({type:'guardianAction',action:{playerNum:1}})">1个</button>
      <button class="btn" ${isPlayer?'':'disabled'} onclick="sendAction({type:'guardianAction',action:{playerNum:2}})">2个</button>
      <button class="btn" ${isPlayer?'':'disabled'} onclick="sendAction({type:'guardianAction',action:{playerNum:3}})">3个</button></div>`;
    else{const wrong=gg.playerNum!==gg.guardianGuess;content=`<div style="font-size:36px;margin:10px">${wrong?'🎉':'😅'}</div><p>${pname}放了<b>${gg.playerNum}</b>个，守护者猜<b>${gg.guardianGuess}</b></p><p style="color:${wrong?'#a5d6a7':'#ef9a9a'};font-weight:bold">${wrong?'猜错！返1指示物':'猜对！+'+gg.playerNum+'金币'}</p>${isPlayer?'<button class="btn" onclick="sendAction({type:\'guardianDone\'})">继续</button>':'<p style="color:#888">等待...</p>'}`}
  }else if(gg.type==='老虎'){
    title='🛡️ 老虎守护者';
    let rh='';gg.rounds.forEach((r,i)=>rh+=`<div style="font-size:13px;padding:3px 0">第${i+1}局：${pname} ${G3_DICE[r.player-1]}(${r.player}) vs 守护者 ${G3_DICE[r.guardian-1]}(${r.guardian}) → ${r.win?'赢':'输/平'}</div>`);
    if(gg.step==='choose')content=`<p>3局赌大小，赢几局得几金币。</p><div style="margin:10px 0">${rh}</div>${isPlayer?`<button class="btn" onclick="sendAction({type:'guardianAction',action:{roll:true}})">投第${gg.rounds.length+1}局</button>`:'<p style="color:#888">等待'+pname+'...</p>'}`;
    else content=`<p>3局赌大小，赢几局得几金币。</p><div style="margin:10px 0">${rh}</div><div style="color:var(--gold-light);font-weight:bold">共赢${gg.wins}局，+${gg.wins}金币！</div>${isPlayer?'<button class="btn" style="margin-top:10px" onclick="sendAction({type:\'guardianDone\'})">继续</button>':'<p style="color:#888">等待...</p>'}`}
  // 渲染弹窗
  let modal=document.getElementById('g3GuardianModal');
  if(!modal){modal=document.createElement('div');modal.id='g3GuardianModal';modal.className='g3-guardian-modal';document.querySelector('.container').appendChild(modal)}
  modal.innerHTML=`<div class="g3-guardian-box"><h3>${title}</h3>${content}</div>`;
  modal.style.display='flex';
};
// 守护者弹窗在游戏切换时隐藏
const _origInit3=window.G.initG3;
window.G.initG3=function(){let m=document.getElementById('g3GuardianModal');if(m)m.remove();_origInit3.call(this)};

// ==================== 游戏4：冒险王之投了个骰 ====================
const G4_DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];
window.G.g4PowerPos=0;window.G.g4PowerDir=1;window.G.g4PowerLocking=false;window.G.g4PowerTimer=null;window.G.g4Rolling=false;

window.G.initG4=function(){
  const blues=Object.entries(state.players).filter(([_,p])=>p.team==='blue').map(([id])=>id);
  const reds=Object.entries(state.players).filter(([_,p])=>p.team==='red').map(([id])=>id);
  state._blues=blues;state._reds=reds;
  state.game={enemy:{name:'🐉 龙蛋',hp:50,maxHp:50,counter:false},lastAction:null,coinflip:null};
  // 使用preGame猜大小的结果
  const firstTeam=state.firstTeam||'blue';
  const first=firstTeam==='blue'?blues:reds;
  const second=firstTeam==='blue'?reds:blues;
  const order=[];const mx=Math.max(first.length,second.length);
  for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
  state.turnOrder=order;state.currentIndex=0;state.round=1;
  state.phase='playing';
  state.message=(firstTeam==='blue'?'🔵蓝队':'🔴红队')+' 先行动！'+playerName(order[0])+' 的回合';state.messageType='good';
  document.getElementById('gameInfo').innerHTML='<span>第 <b id="g4Round">1</b> 轮</span><span id="g4Turn"></span>';
  document.getElementById('hostControls').innerHTML='<button class="btn btn-small btn-red" onclick="G.hostActionG4(null,\'skip\')">跳过断线玩家</button> <button class="btn btn-small btn-yellow" onclick="if(confirm(\'确定重新开始本局？金币将保留\'))G.restart()">🔄 重新开始</button>';
  this.g4PowerLocking=false;this.g4Rolling=false;this.g4StopPower();
};

window.G.renderG4=function(){
  if(!state.game)return;const g=state.game;
  document.getElementById('g4Round').textContent=state.round;
  const curId=state.turnOrder[state.currentIndex];
  if(curId&&state.players[curId]){const cp=state.players[curId];document.getElementById('g4Turn').innerHTML=`当前：<b style="color:${cp.team==='blue'?'#64b5f6':'#ef9a9a'}">${cp.name}</b>${cp.online?'':'（离线⏸️）'}`}
  const e=g.enemy;
  let html=`<div class="g4-enemy"><div class="g4-enemy-name">${e.name}</div><div class="g4-hp-bar"><div class="g4-hp-fill" style="width:${Math.max(0,(e.hp/e.maxHp)*100)}%">${e.hp}/${e.maxHp}</div></div></div>`;
  // 比大小阶段
  if(state.phase==='coinflip'){
    const cf=g.coinflip||{};
    html+='<div class="g4-roll-area"><div class="g4-msg">'+(cf.done?`🔵蓝队 ${cf.blue}点 · 🔴红队 ${cf.red}点${cf.winner==='tie'?' — 平局！':''}`:'等待主持人投骰比大小...')+'</div>';
    if(isHost)html+=`<button class="btn" onclick="G.hostActionG4(null,{type:'coinflip'})">${cf.done&&cf.winner==='tie'?'平局！再投一次':'投骰比大小'}</button>`;
    else html+='<button class="btn" disabled>等待主持人...</button>';
    html+='</div>';
    // 靶盘
    html+=this.g4TargetHTML(null);
    document.getElementById('gameArea').innerHTML=html;return;
  }
  // 靶盘
  html+=this.g4TargetHTML(g.lastAction);
  // 结果
  if(g.lastAction&&g.lastAction.resolved){
    const la=g.lastAction;
    if(la.result.type==='hit')html+=`<div class="g4-result"><span class="hit">${la.playerName} 命中 ${la.result.ring}环</span> · <span class="dmg">-${la.result.damage} HP</span></div>`;

window.G.actionG4=function(peerId,action){

window.G.hostActionG4=function(peerId,action){
  if(action.type==='coinflip'&&state.phase==='coinflip'){
    const b=1+Math.floor(Math.random()*6),r=1+Math.floor(Math.random()*6);
    state.game.coinflip={blue:b,red:r,done:true};
    if(b>r)state.game.coinflip.winner='blue';else if(r>b)state.game.coinflip.winner='red';else state.game.coinflip.winner='tie';
    if(state.game.coinflip.winner!=='tie'){
      const first=state.game.coinflip.winner==='blue'?state._blues:state._reds;
      const second=state.game.coinflip.winner==='blue'?state._reds:state._blues;
      const order=[];const mx=Math.max(first.length,second.length);
      for(let i=0;i<mx;i++){if(first[i])order.push(first[i]);if(second[i])order.push(second[i])}
      state.turnOrder=order;state.currentIndex=0;state.phase='playing';
      state.message=(state.game.coinflip.winner==='blue'?'🔵蓝队':'🔴红队')+' 先行动！'+playerName(order[0])+' 的回合';state.messageType='good';
    }else state.message='平局！再投一次';state.messageType='warn';
    broadcastState();this.renderG4();
  }else if(action==='skip'&&state.phase==='playing'){
    state.message='主持人跳过了 '+state.players[state.turnOrder[state.currentIndex]].name;state.messageType='warn';
    this.g4NextTurn();broadcastState();this.renderG4();
  }
};

window.G.g4DoRoll=function(power){
  if(this.g4Rolling)return;this.g4Rolling=true;
  const curId=state.turnOrder[state.currentIndex];
  const p=Math.max(0,Math.min(100,power));
  let result;
  if(p<8){result={type:'miss',subtype:'offtarget',ring:0,damage:0,x:50+Math.random()*100,y:50+Math.random()*100}}
  else if(p<16){const holes=[{x:27.5,y:35},{x:72.5,y:35},{x:27.5,y:65},{x:72.5,y:65}];const h=holes[Math.floor(Math.random()*holes.length)];result={type:'miss',subtype:'hole',ring:0,damage:0,x:h.x,y:h.y}}
  else{
    const ring=Math.max(1,Math.min(10,Math.round((p-16)/84*9)+1));
    const radius=(10-ring)*4.5+2;const angle=Math.random()*Math.PI*2;
    result={type:'hit',ring:ring,damage:ring,x:Math.max(5,Math.min(95,50+radius*Math.cos(angle))),y:Math.max(5,Math.min(95,50+radius*Math.sin(angle)))};
  }
  const diceFace=1+Math.floor(Math.random()*6);
  state.game.lastAction={playerId:curId,playerName:playerName(curId),result,diceFace};
  state.message=playerName(curId)+' 投掷骰子！';state.messageType='';
  broadcastState();this.renderG4();
  setTimeout(()=>{
    const pl=state.players[curId];const enemy=state.game.enemy;
    if(result.type==='hit'){enemy.hp=Math.max(0,enemy.hp-result.damage);state.message=`${pl.name} 命中 ${result.ring}环！造成 ${result.damage} 点伤害`;state.messageType='good'}
    else{state.message=`${pl.name} ${result.subtype==='hole'?'投进黑洞！':'脱靶！'}未命中`;state.messageType='warn'}
    state.game.lastAction.resolved=true;this.g4Rolling=false;
    broadcastState();this.renderG4();
    if(enemy.hp<=0)setTimeout(()=>this.g4EndGame(),1200);
    else setTimeout(()=>{this.g4NextTurn();broadcastState();this.renderG4()},1200);
  },800);
};

window.G.g4NextTurn=function(){
  const len=state.turnOrder.length;if(len===0)return;
  let nextIdx=(state.currentIndex+1)%len;if(nextIdx<=state.currentIndex)state.round++;
  state.currentIndex=nextIdx;
  const np=state.players[state.turnOrder[nextIdx]];
  if(!np.online){state.message='⏸️ '+np.name+' 断线，等待重连...';state.messageType='warn'}
  else{state.message=np.name+' 的回合（第'+state.round+'轮），点击投掷';state.messageType=''}
};

  const winner=winTeam==='blue'?'🔵 蓝队获胜！':'🔴 红队获胜！';

      fxClass='g5-fx-'+(fx.type||'normal');
    }
    html+=`<div class="g5-fx-overlay"><div class="g5-fx-box ${fxClass}" style="--fx-color:${fxColor}"><div class="g5-fx-icon" style="color:${fxColor}">${fxIcon}</div><div class="g5-fx-text" style="color:${fxColor}">${fx.text}</div><div class="g5-fx-sub">${fx.sub}</div></div></div>`;
  }
  document.getElementById('gameArea').innerHTML=html;
  this.g5RenderButtons();
  if(g.duel)this.g5RenderDuel();else{let m=document.getElementById('g5DuelModal');if(m)m.remove()}
  if(g.roundSummary)this.g5RenderSummary();else{let m=document.getElementById('g5SumModal');if(m)m.remove()}
  this.g5CheckModals();
  // 特效2秒后自动清除（技能选择阶段不重新渲染，避免弹窗刷新导致点击丢失）
  if(g.lastEffect&&isHost){const fx=g.lastEffect;setTimeout(()=>{if(state.game&&state.game.lastEffect===fx){state.game.lastEffect=null;broadcastState();this.renderG5()}},3500)}
};

window.G.g5RenderButtons=function(){
  const g=state.game;const btns=document.getElementById('g5Buttons');const dice=document.getElementById('g5DiceDisplay');
  if(!btns)return;btns.innerHTML='';
  if(state.phase==='coinflip'){
    if(isHost)btns.innerHTML='<button class="btn" onclick="G.hostActionG5(null,{type:\'coinflip\'})">'+(g.coinflip&&g.coinflip.done&&g.coinflip.winner==='tie'?'平局！再投一次':'投骰比大小')+'</button>';

    return;
  }
  if(state.phase==='skillselect'){
    const selector=state.turnOrder[state.skillSelectIndex||0];
    dice.innerHTML='<span style="font-size:13px;color:#a08060">技能选择阶段</span>';

      btns.innerHTML='<button class="btn" onclick="G.g5ShowSkillSelect(state.game.skillPoolKey||0)">📜 选择技能</button>';
    }else if(isHost){
      btns.innerHTML='<span style="font-size:12px;color:#888">等待 '+playerName(selector)+' 选择技能...</span>';
    }
    return;
  }
  if(state.phase!=='playing')return;
  if(g.duel){dice.innerHTML='<span style="font-size:14px;color:var(--gold-light)">⚔️ 决斗中...</span>';return}
  if(g.roundSummary){dice.innerHTML='<span style="font-size:13px;color:#888">查看回合总结...</span>';return}
  const curId=state.turnOrder[state.currentIndex];const p=state.players[curId];if(!p)return;
  if(isHost){dice.innerHTML='<span style="font-size:13px;color:#888">观战中</span>';return}
  if(curId!==myPeerId){dice.innerHTML='<span style="font-size:13px;color:#888">等待'+p.name+'...</span>';return}
  if(!p.online){dice.innerHTML='<span style="font-size:13px;color:#d46a6a">断线中...</span>';return}
  if(typeof g.lastRoll==='number')dice.innerHTML=G5_DICE[g.lastRoll-1]+' <span style="font-size:14px">('+g.lastRoll+')</span>';
  if(g.pendingDuel&&g.pendingDuel.playerId===myPeerId){
    const t=state.players[g.pendingDuel.targetId];
    btns.innerHTML='<button class="btn btn-red" onclick="sendAction({type:\'duel\',targetId:\''+g.pendingDuel.targetId+'\'})">⚔️ 与'+t.name+'决斗</button>';
    if(g.pendingDuel.forced)btns.innerHTML+='<button class="btn btn-gray" style="margin-left:8px" onclick="sendAction({type:\'skipDuel\'})">拒绝决斗(-5💰)</button>';
    else btns.innerHTML+='<button class="btn btn-gray" style="margin-left:8px" onclick="sendAction({type:\'endTurn\'})">跳过</button>';
    return;
  }
  if(g.pendingSkillChange&&g.pendingSkillChange.playerId===myPeerId){dice.innerHTML='<span style="font-size:13px;color:var(--gold-light)">请选择新技能</span>';btns.innerHTML='<button class="btn" onclick="G.g5ShowSkillSelect('+g.pendingSkillChange.poolKey+')">📜 选择新技能</button>';return}
  if(!p.skillUsed||(p.skill==='再投双杯酿'&&typeof g.lastRoll==='number'&&(p._rerollCount||0)<2)){
    if(typeof g.lastRoll!=='number')btns.innerHTML='<button class="btn" onclick="sendAction({type:\'roll\'})">🎲 投掷骰子</button>';
    else if(p.skill==='再投双杯酿'&&(p._rerollCount||0)<2)btns.innerHTML='<button class="btn" onclick="sendAction({type:\'reroll\'})">🔄 重投('+(2-(p._rerollCount||0))+')</button><button class="btn btn-gray" style="margin-left:8px" onclick="sendAction({type:\'endTurn\'})">结束回合</button>';
    else btns.innerHTML='<button class="btn btn-gray" onclick="sendAction({type:\'endTurn\'})">结束回合</button>';
  }else btns.innerHTML='<button class="btn btn-gray" onclick="sendAction({type:\'endTurn\'})">结束回合</button>';
  if(p.skill&&!p.skillUsed&&!p.skillLocked&&typeof g.lastRoll!=='number'){
    const sk=G5_SKILLS.find(s=>s.id===p.skill);
    // 再投双杯酿不需要投掷前点击，投掷后自动显示重投按钮

  }
};

window.G.g5CheckModals=function(){
  try{
  const g=state.game;
  // 防重复弹窗：仅在pending状态（非初始技能选择）时检查，玩家刚点击选择后1秒内不重复弹出
  if(state.phase!=='skillselect'&&window._g5JustSelected&&Date.now()-window._g5JustSelected<1000)return;
  // 优先处理需要当前玩家操作的pending状态（即使在技能选择阶段）
  if(g.pendingWinnerPrediction&&g.pendingWinnerPrediction.playerId===myPeerId&&!isHost){
    this.g5ShowWinnerPrediction();return;
  }
  if(g.pendingLeaderCopy&&g.pendingLeaderCopy.playerId===myPeerId&&!isHost){
    this.g5ShowLeaderCopy();return;
  }
  if(g.pendingTargetChoice&&g.pendingTargetChoice.playerId===myPeerId&&!isHost){
    this.g5ShowTargetChoice();return;
  }
  if(g.pendingPrediction&&g.pendingPrediction.playerId===myPeerId&&!isHost){
    this.g5ShowPrediction();return;
  }
  if(g.pendingSkillChoice&&g.pendingSkillChoice.playerId===myPeerId&&!isHost){
    this.g5ShowDiscardSelect();return;
  }
  if(g.pendingSkillChange&&g.pendingSkillChange.playerId===myPeerId&&!isHost){
    this.g5ShowSkillSelect(g.pendingSkillChange.poolKey);return;
  }
  if(state.phase==='skillselect'){
    const selector=state.turnOrder[state.skillSelectIndex||0];
    if(selector===myPeerId&&!isHost)this.g5ShowSkillSelect(g.skillPoolKey||0);
    else if(isHost)this.g5ShowSkillSelectHost(selector,g.skillPoolKey||0);
    else this.g5RemoveModal();
  }else if(g.pendingSkillChange){
    if(isHost)this.g5ShowSkillSelectHost(g.pendingSkillChange.playerId,g.pendingSkillChange.poolKey);
    else this.g5RemoveModal();
  }else if(g.pendingSkillChoice){
    if(isHost)this.g5ShowDiscardSelectHost(g.pendingSkillChoice.playerId);
    else this.g5RemoveModal();
  }else if(g.pendingTargetChoice){
    if(isHost)this.g5ShowTargetChoiceHost(g.pendingTargetChoice.playerId,g.pendingTargetChoice.skillId);
    else this.g5RemoveModal();
  }else if(g.pendingPrediction){
    if(isHost)this.g5ShowPredictionHost(g.pendingPrediction.playerId);
    else this.g5RemoveModal();
  }else if(g.pendingWinnerPrediction){
    if(isHost)this.g5ShowWinnerPredictionHost(g.pendingWinnerPrediction.playerId);
    else this.g5RemoveModal();
  }else if(g.pendingLeaderCopy){
    if(isHost)this.g5ShowLeaderCopyHost(g.pendingLeaderCopy.playerId);
    else this.g5RemoveModal();
  }else this.g5RemoveModal();
  }catch(e){console.error('g5CheckModals error:',e);this.g5RemoveModal()}
};

    else actHtml='<span style="color:#888">等待'+pb.name+'投骰...</span>';

    else if(d.winner===d.playerB)actHtml='<span style="color:var(--gold-light);font-weight:bold">'+pb.name+'获胜！+1格，'+pa.name+'-1血</span>';
    else actHtml='<span>平局！无事发生</span>';
  }
  m.innerHTML='<div class="g5-duel-box"><h3>⚔️ 决斗</h3><div class="g5-duel-row"><div><div class="g5-duel-player '+pa.team+'">'+(pa.team==='blue'?'🔵':'🔴')+' '+pa.name+'</div><div class="g5-duel-dice '+(d.rollA!==null?'stopped':'')+'">'+(d.rollA!==null?G5_DICE[d.rollA-1]:'🎲')+'</div></div><div class="g5-duel-vs">VS</div><div><div class="g5-duel-player '+pb.team+'">'+(pb.team==='blue'?'🔵':'🔴')+' '+pb.name+'</div><div class="g5-duel-dice '+(d.rollB!==null?'stopped':'')+'">'+(d.rollB!==null?G5_DICE[d.rollB-1]:'🎲')+'</div></div></div><div style="margin:12px 0">'+actHtml+'</div></div>';
};

window.G.g5RenderSummary=function(){

window.G.g5ShowSkillPool=function(){

    html+='</div>';
  });

  this.g5ShowModal('📜 技能池总览',html);
